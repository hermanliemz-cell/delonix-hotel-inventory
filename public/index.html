      setOpnames(opRes.data || []);
      setCategories(catRes.data || []);
      setItems(itemRes.data || []);
      setUsers(usrRes.data || []);
      setDepartments(deptRes.data || []);
    } catch (err) {
      showNotification('Error loading data: ' + err.message, 'error');
    }
    setLoading(false);
  }

  function canCreate() {
    return ['superadmin', 'gm', 'findir'].includes(currentUser?.role?.code);
  }

  function canStartCounting(opname) {
    return currentUser?.id === opname.assigned_to && opname.status === 'PENDING';
  }

  function canFillAndSubmit(opname) {
    return currentUser?.id === opname.assigned_to && opname.status === 'COUNTING';
  }

  function canDelete(opname) {
    return canCreate() && opname.status === 'PENDING';
  }

  function openCreateModal() {
    setCreateForm({
      category_id: '',
      assigned_to: '',
      opname_date: new Date().toISOString().split('T')[0],
      notes: ''
    });
    setSelectedItems([]);
    setCategoryItems([]);
    setShowCreateModal(true);
  }

  function handleCategoryChange(catId) {
    setCreateForm({ ...createForm, category_id: catId });
    if (catId) {
      const filtered = items.filter(i => i.category_id === catId);
      setCategoryItems(filtered);
      setSelectedItems([]);
    } else {
      setCategoryItems([]);
      setSelectedItems([]);
    }
  }

  function toggleItem(itemId) {
    setSelectedItems(prev =>
      prev.includes(itemId) ? prev.filter(id => id !== itemId) : [...prev, itemId]
    );
  }

  function selectAllItems() {
    if (selectedItems.length === categoryItems.length) {
      setSelectedItems([]);
    } else {
      setSelectedItems(categoryItems.map(i => i.id));
    }
  }

  async function generateOpnameNumber() {
    const prefix = `OPN-${selectedOrg.code}-`;
    const { data } = await supabase.from('stock_opname').select('opname_number').eq('organization_id', selectedOrg.id).like('opname_number', prefix + '%').order('created_at', { ascending: false }).limit(1);
    let nextNum = 1;
    if (data && data.length > 0) {
      const lastNum = parseInt(data[0].opname_number.replace(prefix, ''), 10);
      if (!isNaN(lastNum)) nextNum = lastNum + 1;
    }
    return prefix + String(nextNum).padStart(4, '0');
  }

  async function handleCreateOpname() {
    if (!createForm.category_id || !createForm.assigned_to || selectedItems.length === 0) {
      showNotification('Please fill all required fields and select items', 'error');
      return;
    }
    setSaving(true);
    try {
      // Validate date
      const inputDate = new Date(createForm.opname_date);
      const today = new Date();
      const maxBackdateDays = selectedOrg.max_backdate_days || 3;
      const daysDiff = Math.floor((today - inputDate) / (1000 * 60 * 60 * 24));
      if (daysDiff > maxBackdateDays) {
        showNotification('Date exceeds maximum backdate limit (' + maxBackdateDays + ' days)', 'error');
        setSaving(false);
        return;
      }

      // Check if period is locked
      const periodMonth = inputDate.getMonth() + 1;
      const periodYear = inputDate.getFullYear();
      const { data: locks } = await supabase.from('period_locks')
        .select('*')
        .eq('organization_id', selectedOrg.id)
        .eq('period_month', periodMonth)
        .eq('period_year', periodYear)
        .eq('is_locked', true)
        .single();
      if (locks) {
        showNotification('Period is locked', 'error');
        setSaving(false);
        return;
      }

      // Get stock balances for selected items
      const { data: balances } = await supabase.from('stock_balances').select('*').eq('organization_id', selectedOrg.id).in('item_id', selectedItems);
      const balMap = {};
      (balances || []).forEach(b => { balMap[b.item_id] = b; });

      // Create stock_opname record
      const opnameNumber = await generateOpnameNumber();
      const { data: newOpname, error: opError } = await supabase.from('stock_opname').insert({
        opname_number: opnameNumber,
        organization_id: selectedOrg.id,
        category_id: createForm.category_id,
        assigned_to: createForm.assigned_to,
        assigned_by: currentUser.id,
        opname_date: createForm.opname_date,
        status: 'PENDING',
        notes: createForm.notes || null
      }).select().single();

      if (opError) throw opError;

      // Create stock_opname_details
      const details = selectedItems.map(itemId => {
        const bal = balMap[itemId];
        return {
          opname_id: newOpname.id,
          item_id: itemId,
          system_qty: bal?.quantity || 0,
          physical_qty: 0,
          unit_cost: bal?.avg_cost || 0,
          organization_id: selectedOrg.id
        };
      });

      const { error: detError } = await supabase.from('stock_opname_details').insert(details).select();
      if (detError) throw detError;

      // Log approval_logs entry
      await supabase.from('approval_logs').insert({
        organization_id: selectedOrg.id,
        document_type: 'STOCK_OPNAME',
        document_id: newOpname.id,
        document_number: opnameNumber,
        action: 'CREATED',
        action_by: currentUser.id,
        notes: 'Assignment created'
      });

      showNotification('Stock opname assignment created', 'success');
      setShowCreateModal(false);
      loadAll();
    } catch (err) {
      showNotification('Error: ' + err.message, 'error');
    }
    setSaving(false);
  }

  async function handleStartCounting(opname) {
    setSaving(true);
    try {
      const { error } = await supabase.from('stock_opname').update({
        status: 'COUNTING',
        started_at: new Date().toISOString()
      }).eq('id', opname.id);

      if (error) throw error;

      // Log approval_logs entry
      await supabase.from('approval_logs').insert({
        organization_id: selectedOrg.id,
        document_type: 'STOCK_OPNAME',
        document_id: opname.id,
        document_number: opname.opname_number,
        action: 'COUNTING_STARTED',
        action_by: currentUser.id,
        notes: 'Counting started'
      });

      showNotification('Counting started', 'success');
      openCountingModal(opname);
      loadAll();
    } catch (err) {
      showNotification('Error: ' + err.message, 'error');
    }
    setSaving(false);
  }

  async function openCountingModal(opname) {
    setCountingOpname(opname);
    const { data: dets } = await supabase.from('stock_opname_details').select('*').eq('opname_id', opname.id);
    setCountingDetails(dets || []);
    setShowCountingModal(true);
  }

  function updateCountingDetail(idx, field, value) {
    const nd = [...countingDetails];
    const updated = { ...nd[idx], [field]: value };

    if (field === 'physical_qty') {
      updated.variance_qty = updated.physical_qty - updated.system_qty;
      updated.variance_value = updated.variance_qty * updated.unit_cost;
    }

    nd[idx] = updated;
    setCountingDetails(nd);
  }

  async function handleSubmitCounting() {
    if (!countingOpname) return;
    setSaving(true);
    try {
      // Delete old details
      await supabase.from('stock_opname_details').delete().eq('opname_id', countingOpname.id);

      // Insert updated details (variance_qty and variance_value are generated columns)
      const { error: detError } = await supabase.from('stock_opname_details').insert(
        countingDetails.map(d => ({
          opname_id: countingOpname.id,
          item_id: d.item_id,
          system_qty: d.system_qty,
          physical_qty: d.physical_qty,
          unit_cost: d.unit_cost,
          notes: d.notes || null,
          organization_id: selectedOrg.id
        }))
      );

      if (detError) throw detError;

      // Calculate total variance
      const totalVariance = countingDetails.reduce((s, d) => s + (d.variance_value || 0), 0);

      // Update opname status
      const { error: opError } = await supabase.from('stock_opname').update({
        status: 'SUBMITTED',
        submitted_at: new Date().toISOString(),
        submitted_by: currentUser.id,
        total_variance_value: totalVariance
      }).eq('id', countingOpname.id);

      if (opError) throw opError;

      // Log approval_logs entry
      await supabase.from('approval_logs').insert({
        organization_id: selectedOrg.id,
        document_type: 'STOCK_OPNAME',
        document_id: countingOpname.id,
        document_number: countingOpname.opname_number,
        action: 'SUBMITTED',
        action_by: currentUser.id,
        notes: 'Counting submitted for approval'
      });

      showNotification('Counting submitted for approval', 'success');
      setShowCountingModal(false);
      loadAll();
    } catch (err) {
      showNotification('Error: ' + err.message, 'error');
    }
    setSaving(false);
  }

  async function handleDelete(opname) {
    if (!canDelete(opname)) {
      showNotification('Cannot delete this opname', 'error');
      return;
    }
    if (!confirm(t('opname.confirmDelete'))) return;

    try {
      await supabase.from('stock_opname_details').delete().eq('opname_id', opname.id);
      await supabase.from('approval_logs').delete().eq('record_id', opname.id).eq('record_type', 'stock_opname');
      const { error } = await supabase.from('stock_opname').delete().eq('id', opname.id);
      if (error) throw error;
      showNotification('Opname deleted', 'success');
      loadAll();
    } catch (err) {
      showNotification('Error: ' + err.message, 'error');
    }
  }

  const userMap = {};
  users.forEach(u => { userMap[u.id] = u; });
  const catMap = {};
  categories.forEach(c => { catMap[c.id] = c; });
  const itemMap = {};
  items.forEach(i => { itemMap[i.id] = i; });

  return (
    <div>
      <PageHeader
        title={t('opname.title')}
        subtitle={t('opname.subtitle')}
        actions={canCreate() ? <Button onClick={openCreateModal}><Icons.Plus /> {t('opname.create')}</Button> : null}
      />
      <div className="bg-white rounded-xl shadow-sm border border-gray-100">
        <DataTable
          loading={loading}
          columns={[
            { header: t('opname.number'), render: r => <span className="font-mono text-xs font-semibold text-primary-700">{r.opname_number}</span> },
            { header: t('opname.date'), render: r => new Date(r.opname_date).toLocaleDateString('id-ID') },
            { header: 'Category', render: r => catMap[r.category_id]?.name || '-' },
            { header: 'Assigned To', render: r => userMap[r.assigned_to]?.full_name || '-' },
            { header: t('opname.totalVariance'), render: r => <span className={r.total_variance_value < 0 ? 'text-red-600' : r.total_variance_value > 0 ? 'text-green-600' : ''}>{formatCurrency(r.total_variance_value || 0)}</span> },
            { header: t('common.status'), render: r => {
              const opnameStatusMap = {
                PENDING: { color: 'yellow', label: t('opname.statusPending') },
                COUNTING: { color: 'orange', label: t('opname.statusCounting') },
                SUBMITTED: { color: 'blue', label: t('opname.statusSubmitted') },
                APPROVED: { color: 'green', label: t('opname.statusApproved') },
                REJECTED: { color: 'red', label: t('opname.statusRejected') },
              };
              const s = opnameStatusMap[r.status] || { color: 'gray', label: r.status };
              return <Badge color={s.color}>{s.label}</Badge>;
            }},
          ]}
          data={opnames}
          actions={(row) => (
            <div className="flex items-center gap-1">
              {canStartCounting(row) && (
                <Button
                  size="sm"
                  onClick={e => { e.stopPropagation(); handleStartCounting(row); }}
                >
                  Mulai
                </Button>
              )}
              {canFillAndSubmit(row) && (
                <>
                  <Button
                    size="sm"
                    variant="secondary"
                    onClick={e => { e.stopPropagation(); openCountingModal(row); }}
                  >
                    Buka Detail
                  </Button>
                  <Button
                    size="sm"
                    onClick={e => { e.stopPropagation(); handleSubmitCounting(); }}
                  >
                    Submit
                  </Button>
                </>
              )}
              {canDelete(row) && (
                <button
                  onClick={e => { e.stopPropagation(); handleDelete(row); }}
                  className="p-1.5 hover:bg-red-50 rounded-lg text-red-400"
                >
                  <Icons.Trash />
                </button>
              )}
            </div>
          )}
        />
        {opnames.length === 0 && !loading && (
          <div className="p-8 text-center text-gray-500">{t('opname.empty')}</div>
        )}
      </div>

      <Modal
        open={showCreateModal}
        onClose={() => setShowCreateModal(false)}
        title={t('opname.create')}
        size="lg"
      >
        <div className="space-y-4">
          <FormField label="Category" required>
            <Select
              value={createForm.category_id}
              onChange={e => handleCategoryChange(e.target.value)}
            >
              <option value="">Select a category</option>
              {categories.map(c => <option key={c.id} value={c.id}>{c.name}</option>)}
            </Select>
          </FormField>

          {categoryItems.length > 0 && (
            <FormField label="Select Items">
              <div className="border rounded p-3 space-y-2 max-h-48 overflow-y-auto">
                <label className="flex items-center gap-2 cursor-pointer font-semibold">
                  <input
                    type="checkbox"
                    checked={selectedItems.length === categoryItems.length && categoryItems.length > 0}
                    onChange={selectAllItems}
                  />
                  Select All
                </label>
                {categoryItems.map(item => (
                  <label key={item.id} className="flex items-center gap-2 cursor-pointer">
                    <input
                      type="checkbox"
                      checked={selectedItems.includes(item.id)}
                      onChange={() => toggleItem(item.id)}
                    />
                    <span className="text-sm">{item.code} - {item.name}</span>
                  </label>
                ))}
              </div>
              <div className="text-xs text-gray-500 mt-1">{selectedItems.length} selected</div>
            </FormField>
          )}

          <FormField label="Assign To" required>
            <Select
              value={createForm.assigned_to}
              onChange={e => setCreateForm({ ...createForm, assigned_to: e.target.value })}
            >
              <option value="">Select a user</option>
              {users.map(u => <option key={u.id} value={u.id}>{u.full_name}</option>)}
            </Select>
          </FormField>

          <FormField label={t('opname.date')} required>
            <Input
              type="date"
              value={createForm.opname_date}
              onChange={e => setCreateForm({ ...createForm, opname_date: e.target.value })}
            />
          </FormField>

          <FormField label={t('opname.notes')}>
            <Input
              value={createForm.notes}
              onChange={e => setCreateForm({ ...createForm, notes: e.target.value })}
              placeholder="Optional notes..."
            />
          </FormField>

          <div className="flex justify-end gap-3 pt-4 border-t">
            <Button variant="secondary" onClick={() => setShowCreateModal(false)}>
              {t('common.cancel')}
            </Button>
            <Button onClick={handleCreateOpname} disabled={saving}>
              {t('common.save')}
            </Button>
          </div>
        </div>
      </Modal>

      <Modal
        open={showCountingModal}
        onClose={() => setShowCountingModal(false)}
        title={`Counting: ${countingOpname?.opname_number}`}
        size="xl"
      >
        {countingDetails.length > 0 && (
          <div className="space-y-4">
            <div className="overflow-x-auto">
              <table className="w-full text-sm">
                <thead>
                  <tr className="bg-gray-50">
                    <th className="p-2 text-left">Item</th>
                    <th className="p-2 text-right w-20">System Qty</th>
                    <th className="p-2 text-right w-20">Physical Qty</th>
                    <th className="p-2 text-right w-20">Variance</th>
                    <th className="p-2 text-right w-24">Unit Cost</th>
                    <th className="p-2 text-right w-28">Variance Value</th>
                  </tr>
                </thead>
                <tbody>
                  {countingDetails.map((det, idx) => {
                    const item = itemMap[det.item_id];
                    return (
                      <tr key={idx} className="border-b">
                        <td className="p-2 text-xs">{item ? `${item.code} - ${item.name}` : det.item_id}</td>
                        <td className="p-2 text-right text-gray-500">{det.system_qty}</td>
                        <td className="p-2">
                          <input
                            type="number"
                            value={det.physical_qty}
                            onChange={e => updateCountingDetail(idx, 'physical_qty', parseFloat(e.target.value) || 0)}
                            className="w-full px-2 py-1 border rounded text-sm text-right"
                            min="0"
                          />
                        </td>
                        <td className={`p-2 text-right font-medium ${det.variance_qty < 0 ? 'text-red-600' : det.variance_qty > 0 ? 'text-green-600' : ''}`}>
                          {det.variance_qty}
                        </td>
                        <td className="p-2 text-right text-gray-500">{formatCurrency(det.unit_cost)}</td>
                        <td className={`p-2 text-right font-medium ${det.variance_value < 0 ? 'text-red-600' : det.variance_value > 0 ? 'text-green-600' : ''}`}>
                          {formatCurrency(det.variance_value || 0)}
                        </td>
                      </tr>
                    );
                  })}
                </tbody>
              </table>
            </div>

            <div className="flex justify-end gap-3 pt-4 border-t">
              <Button variant="secondary" onClick={() => setShowCountingModal(false)}>
                {t('common.cancel')}
              </Button>
              <Button onClick={handleSubmitCounting} disabled={saving}>
                Submit Counting
              </Button>
            </div>
          </div>
        )}
      </Modal>
    </div>
  );
}

// ============================================================
// WRITE-OFF PAGE
// ============================================================
function WriteOffPage() {
  const { selectedOrg, showNotification } = useApp();
  const { t } = useTranslation();
  const [writeoffs, setWriteoffs] = useState([]);
  const [departments, setDepartments] = useState([]);
  const [items, setItems] = useState([]);
  const [loading, setLoading] = useState(true);
  const [showModal, setShowModal] = useState(false);
  const [editing, setEditing] = useState(null);
  const [saving, setSaving] = useState(false);
  const [form, setForm] = useState({ department_id: '', write_off_date: new Date().toISOString().split('T')[0], reason: 'DAMAGED', notes: '' });
  const [lineItems, setLineItems] = useState([]);

  useEffect(() => { if(selectedOrg) loadAll(); }, [selectedOrg]);

  async function loadAll() {
    setLoading(true);
    const [woRes, deptRes, itemRes] = await Promise.all([
      supabase.from('write_offs').select('*, departments(name, code)').eq('organization_id', selectedOrg.id).order('created_at', { ascending: false }),
      supabase.from('departments').select('*').eq('organization_id', selectedOrg.id).eq('is_active', true).order('name'),
      supabase.from('items').select('id, code, name').eq('is_active', true).order('code'),
    ]);
    setWriteoffs(woRes.data || []);
    setDepartments(deptRes.data || []);
    setItems(itemRes.data || []);
    setLoading(false);
  }

  function openCreate() {
    setEditing(null);
    setForm({ department_id: departments[0]?.id || '', write_off_date: new Date().toISOString().split('T')[0], reason: 'DAMAGED', notes: '' });
    setLineItems([{ item_id: '', quantity: 1, unit_cost: 0, notes: '' }]);
    setShowModal(true);
  }

  async function openEdit(wo) {
    setEditing(wo);
    setForm({ department_id: wo.department_id || '', write_off_date: wo.write_off_date, reason: wo.reason, notes: wo.notes || '' });
    const { data: woItems } = await supabase.from('write_off_items').select('*').eq('wo_id', wo.id);
    setLineItems((woItems || []).map(i => ({ item_id: i.item_id, quantity: i.quantity, unit_cost: i.unit_cost || 0, notes: i.notes || '' })));
    if (!woItems || woItems.length === 0) setLineItems([{ item_id: '', quantity: 1, unit_cost: 0, notes: '' }]);
    setShowModal(true);
  }

  function addLine() { setLineItems([...lineItems, { item_id: '', quantity: 1, unit_cost: 0, notes: '' }]); }
  function removeLine(idx) { setLineItems(lineItems.filter((_, i) => i !== idx)); }
  function updateLine(idx, field, val) { const nl = [...lineItems]; nl[idx] = { ...nl[idx], [field]: val }; setLineItems(nl); }

  async function generateWONumber() {
    const prefix = `WO-${selectedOrg.code}-`;
    const { data } = await supabase.from('write_offs').select('wo_number').eq('organization_id', selectedOrg.id).like('wo_number', prefix + '%').order('created_at', { ascending: false }).limit(1);
    let nextNum = 1;
    if (data && data.length > 0) {
      const lastNum = parseInt(data[0].wo_number.replace(prefix, ''), 10);
      if (!isNaN(lastNum)) nextNum = lastNum + 1;
    }
    return prefix + String(nextNum).padStart(4, '0');
  }

  async function handleSave() {
    if (!form.department_id || lineItems.filter(l => l.item_id).length === 0) return;
    setSaving(true);
    try {
      // Validate write-off date
      const inputDate = new Date(form.write_off_date);
      const today = new Date();
      const maxBackdateDays = selectedOrg.max_backdate_days || 3;
      const daysDiff = Math.floor((today - inputDate) / (1000 * 60 * 60 * 24));
      if (daysDiff > maxBackdateDays) {
        showNotification('Write-off date exceeds maximum backdate limit (' + maxBackdateDays + ' days)', 'error');
        setSaving(false);
        return;
      }

      // Check if period is locked
      const periodMonth = inputDate.getMonth() + 1;
      const periodYear = inputDate.getFullYear();
      const { data: locks } = await supabase.from('period_locks')
        .select('*')
        .eq('organization_id', selectedOrg.id)
        .eq('period_month', periodMonth)
        .eq('period_year', periodYear)
        .eq('is_locked', true)
        .single();
      if (locks) {
        showNotification('Period is locked', 'error');
        setSaving(false);
        return;
      }

      const validLines = lineItems.filter(l => l.item_id);
      const totalValue = validLines.reduce((s, l) => s + (l.quantity * l.unit_cost), 0);
      if (editing) {
        const { error } = await supabase.from('write_offs').update({
          department_id: form.department_id, write_off_date: form.write_off_date,
          reason: form.reason, notes: form.notes || null, total_value: totalValue
        }).eq('id', editing.id);
        if (error) throw error;
        await supabase.from('write_off_items').delete().eq('wo_id', editing.id);
        const itemsPayload = validLines.map(l => ({
          wo_id: editing.id, item_id: l.item_id, quantity: l.quantity,
          unit_cost: l.unit_cost, total_value: l.quantity * l.unit_cost, notes: l.notes || null
        }));
        await supabase.from('write_off_items').insert(itemsPayload);
      } else {
        const woNumber = await generateWONumber();
        const { data: newWO, error } = await supabase.from('write_offs').insert({
          wo_number: woNumber, organization_id: selectedOrg.id, department_id: form.department_id,
          write_off_date: form.write_off_date, reason: form.reason, status: 'DRAFT',
          total_value: totalValue, notes: form.notes || null
        }).select().single();
        if (error) throw error;
        const itemsPayload = validLines.map(l => ({
          wo_id: newWO.id, item_id: l.item_id, quantity: l.quantity,
          unit_cost: l.unit_cost, total_value: l.quantity * l.unit_cost, notes: l.notes || null
        }));
        await supabase.from('write_off_items').insert(itemsPayload);
      }
      showNotification(t('writeoff.successSave'));
      setShowModal(false);
      loadAll();
    } catch (err) { showNotification('Error: ' + err.message, 'error'); }
    setSaving(false);
  }

  async function handleDelete(wo) {
    if (wo.status !== 'DRAFT') { showNotification('Cannot delete — status is ' + wo.status, 'error'); return; }
    if (!confirm(t('writeoff.confirmDelete'))) return;
    try {
      await supabase.from('write_off_items').delete().eq('wo_id', wo.id);
      const { error } = await supabase.from('write_offs').delete().eq('id', wo.id);
      if (error) throw error;
      showNotification(t('writeoff.successDelete'));
      loadAll();
    } catch (err) { showNotification('Error: ' + err.message, 'error'); }
  }

  async function submitForApproval(wo) {
    if (!confirm('Submit for approval?')) return;
    const upd = { status: 'PENDING', submitted_by: currentUser?.id, submitted_at: new Date().toISOString() };
    await supabase.from('write_offs').update(upd).eq('id', wo.id);
    await supabase.from('approval_logs').insert({
      organization_id: selectedOrg.id, document_type: 'WRITEOFF', document_id: wo.id,
      document_number: wo.wo_number, action: 'SUBMITTED', action_by: currentUser?.id,
    });
    showNotification(t('writeoff.title') + ' submitted for approval', 'success');
    loadAll();
  }

  const grandTotal = lineItems.reduce((s, l) => s + (l.quantity * l.unit_cost), 0);

  return (
    <div>
      <PageHeader title={t('writeoff.title')} subtitle={t('writeoff.subtitle')}
        actions={<Button onClick={openCreate}><Icons.Plus /> {t('writeoff.create')}</Button>} />
      <div className="bg-white rounded-xl shadow-sm border border-gray-100">
        <DataTable loading={loading}
          columns={[
            { header: t('writeoff.number'), render: r => <span className="font-mono text-xs font-semibold text-primary-700">{r.wo_number}</span> },
            { header: t('writeoff.date'), render: r => new Date(r.write_off_date).toLocaleDateString('id-ID') },
            { header: t('stock.dept'), render: r => <Badge color="blue">{r.departments?.code}</Badge> },
            { header: t('writeoff.reason'), render: r => <Badge color="orange">{r.reason}</Badge> },
            { header: t('writeoff.totalValue'), render: r => formatCurrency(r.total_value) },
            { header: t('common.status'), render: r => <StatusBadge status={r.status}/> },
          ]}
          data={writeoffs}
          actions={(row) => (
            <div className="flex items-center gap-1">
              {row.status === 'DRAFT' && <button onClick={e=>{e.stopPropagation();submitForApproval(row)}} className="p-1 text-xs bg-blue-50 text-blue-600 rounded hover:bg-blue-100">{t('writeoff.submit')}</button>}
              {row.status === 'DRAFT' && <button onClick={e=>{e.stopPropagation();openEdit(row)}} className="p-1.5 hover:bg-gray-100 rounded-lg text-gray-500"><Icons.Edit /></button>}
              {row.status === 'DRAFT' && <button onClick={e=>{e.stopPropagation();handleDelete(row)}} className="p-1.5 hover:bg-red-50 rounded-lg text-red-400"><Icons.Trash /></button>}
            </div>
          )}
        />
        {writeoffs.length === 0 && !loading && (
          <div className="p-8 text-center text-gray-500">{t('writeoff.empty')}</div>
        )}
      </div>

      <Modal open={showModal} onClose={() => setShowModal(false)} title={editing ? 'Edit Write-Off' : t('writeoff.create')} size="xl">
        <div className="grid grid-cols-1 sm:grid-cols-3 gap-4 mb-4">
          <FormField label={t('writeoff.department')} required>
            <Select value={form.department_id} onChange={e => setForm({...form, department_id: e.target.value})}>
              <option value="">Select</option>
              {departments.map(d => <option key={d.id} value={d.id}>{d.code} - {d.name}</option>)}
            </Select>
          </FormField>
          <FormField label={t('writeoff.date')} required>
            <Input type="date" value={form.write_off_date} onChange={e => setForm({...form, write_off_date: e.target.value})} />
          </FormField>
          <FormField label={t('writeoff.reason')}>
            <Select value={form.reason} onChange={e => setForm({...form, reason: e.target.value})}>
              <option value="EXPIRED">{t('writeoff.reasonExpired')}</option>
              <option value="DAMAGED">{t('writeoff.reasonDamaged')}</option>
              <option value="LOST">{t('writeoff.reasonLost')}</option>
              <option value="OBSOLETE">{t('writeoff.reasonObsolete')}</option>
              <option value="OTHER">{t('writeoff.reasonOther')}</option>
            </Select>
          </FormField>
          <div className="sm:col-span-3">
            <FormField label={t('writeoff.notes')}>
              <Input value={form.notes} onChange={e => setForm({...form, notes: e.target.value})} />
            </FormField>
          </div>
        </div>

        <div className="border-t pt-4">
          <div className="flex justify-between items-center mb-3">
            <h4 className="font-semibold text-sm">{t('writeoff.addItem')}</h4>
            <button onClick={addLine} className="text-xs text-primary-600 hover:text-primary-800 font-medium">+ {t('writeoff.addItem')}</button>
          </div>
          <table className="w-full text-sm">
            <thead><tr className="bg-gray-50">
              <th className="p-2 text-left">{t('dashboard.item')}</th>
              <th className="p-2 text-right w-20">{t('writeoff.qty')}</th>
              <th className="p-2 text-right w-28">{t('writeoff.unitCost')}</th>
              <th className="p-2 text-right w-28">{t('writeoff.lineTotal')}</th>
              <th className="p-2 text-left w-32">{t('writeoff.notes')}</th>
              <th className="p-2 w-10"></th>
            </tr></thead>
            <tbody>
              {lineItems.map((line, idx) => (
                <tr key={idx} className="border-b">
                  <td className="p-2">
                    <select value={line.item_id} onChange={e => updateLine(idx, 'item_id', e.target.value)}
                      className="w-full px-2 py-1 border rounded text-sm">
                      <option value="">{t('pr.selectItem')}</option>
                      {items.map(i => <option key={i.id} value={i.id}>{i.code} - {i.name}</option>)}
                    </select>
                  </td>
                  <td className="p-2"><input type="number" value={line.quantity} onChange={e => updateLine(idx, 'quantity', parseFloat(e.target.value)||0)}
                    className="w-full px-2 py-1 border rounded text-sm text-right" min="1" /></td>
                  <td className="p-2"><input type="number" value={line.unit_cost} onChange={e => updateLine(idx, 'unit_cost', parseFloat(e.target.value)||0)}
                    className="w-full px-2 py-1 border rounded text-sm text-right" min="0" /></td>
                  <td className="p-2 text-right font-medium">{formatCurrency(line.quantity * line.unit_cost)}</td>
                  <td className="p-2"><input value={line.notes} onChange={e => updateLine(idx, 'notes', e.target.value)}
                    className="w-full px-2 py-1 border rounded text-sm" /></td>
                  <td className="p-2">{lineItems.length > 1 && <button onClick={() => removeLine(idx)} className="text-red-400 hover:text-red-600"><Icons.Trash /></button>}</td>
                </tr>
              ))}
            </tbody>
            <tfoot><tr className="bg-gray-50 font-semibold">
              <td colSpan="3" className="p-2 text-right">{t('writeoff.totalValue')}:</td>
              <td className="p-2 text-right">{formatCurrency(grandTotal)}</td>
              <td colSpan="2"></td>
            </tr></tfoot>
          </table>
        </div>

        <div className="flex justify-end gap-3 mt-6 pt-4 border-t">
          <Button variant="secondary" onClick={() => setShowModal(false)}>{t('common.cancel')}</Button>
          <Button onClick={handleSave} disabled={saving}>{editing ? t('common.update') : t('common.save')}</Button>
        </div>
      </Modal>
    </div>
  );
}

// ============================================================
// PURCHASE INVOICE PAGE
// ============================================================
function PurchaseInvoicePage() {
  const { selectedOrg, showNotification } = useApp();
  const { t } = useTranslation();
  const [invoices, setInvoices] = useState([]);
  const [vendors, setVendors] = useState([]);
  const [items, setItems] = useState([]);
  const [pos, setPos] = useState([]);
  const [users, setUsers] = useState([]);
  const [loading, setLoading] = useState(true);
  const [showModal, setShowModal] = useState(false);
  const [editing, setEditing] = useState(null);
  const [saving, setSaving] = useState(false);
  const [form, setForm] = useState({ vendor_id: '', invoice_number: '', invoice_date: new Date().toISOString().split('T')[0], due_date: '', po_id: '', notes: '' });
  const [lineItems, setLineItems] = useState([]);
  const [viewDoc, setViewDoc] = useState(null);
  const [viewItems, setViewItems] = useState([]);

  useEffect(() => { if(selectedOrg) loadAll(); }, [selectedOrg]);

  async function loadAll() {
    setLoading(true);
    const [piRes, vendorRes, itemRes, poRes, userRes] = await Promise.all([
      supabase.from('purchase_invoices').select('*, vendors(name, code), purchase_orders(po_number)').eq('organization_id', selectedOrg.id).order('created_at', { ascending: false }),
      supabase.from('vendors').select('*').eq('is_active', true).order('name'),
      supabase.from('items').select('id, code, name, unit_id').eq('is_active', true).order('code'),
      supabase.from('purchase_orders').select('id, po_number, vendor_id, status').eq('organization_id', selectedOrg.id).in('status', ['SENT','RECEIVED']).order('po_number'),
      supabase.from('users').select('id, full_name').order('full_name'),
    ]);
    setInvoices(piRes.data || []);
    setVendors(vendorRes.data || []);
    setItems(itemRes.data || []);
    setPos(poRes.data || []);
    setUsers(userRes.data || []);
    setLoading(false);
  }

  function getUserName(userId) {
    if (!userId) return '-';
    const u = users.find(u => u.id === userId);
    return u ? u.full_name : '-';
  }

  async function openView(pi) {
    setViewDoc(pi);
    const { data } = await supabase.from('purchase_invoice_items').select('*, items(code, name)').eq('pi_id', pi.id);
    setViewItems(data || []);
  }

  function openCreate() {
    setEditing(null);
    setForm({ vendor_id: '', invoice_number: '', invoice_date: new Date().toISOString().split('T')[0], due_date: '', po_id: '', notes: '' });
    setLineItems([{ item_id: '', quantity: 1, unit_price: 0, discount_percent: 0, tax_percent: 11 }]);
    setShowModal(true);
  }

  async function openEdit(pi) {
    setEditing(pi);
    setForm({ vendor_id: pi.vendor_id || '', invoice_number: pi.invoice_number || '', invoice_date: pi.invoice_date, due_date: pi.due_date || '', po_id: pi.po_id || '', notes: pi.notes || '' });
    const { data: piItems } = await supabase.from('purchase_invoice_items').select('*').eq('pi_id', pi.id);
    setLineItems((piItems || []).map(i => ({ item_id: i.item_id, quantity: i.quantity, unit_price: i.unit_price || 0, discount_percent: i.discount_percent || 0, tax_percent: i.tax_percent || 11 })));
    if (!piItems || piItems.length === 0) setLineItems([{ item_id: '', quantity: 1, unit_price: 0, discount_percent: 0, tax_percent: 11 }]);
    setShowModal(true);
  }

  async function importFromPO(poId) {
    if (!poId) return;
    const selectedPO = pos.find(p => p.id === poId);
    if (selectedPO) setForm(f => ({ ...f, vendor_id: selectedPO.vendor_id || f.vendor_id, po_id: poId }));
    const { data: poItems } = await supabase.from('purchase_order_items').select('*').eq('po_id', poId);
    if (poItems && poItems.length > 0) {
      setLineItems(poItems.map(i => ({ item_id: i.item_id, quantity: i.quantity, unit_price: i.unit_price || 0, discount_percent: i.discount_percent || 0, tax_percent: i.tax_percent || 11 })));
    }
  }

  function addLine() { setLineItems([...lineItems, { item_id: '', quantity: 1, unit_price: 0, discount_percent: 0, tax_percent: 11 }]); }
  function removeLine(idx) { setLineItems(lineItems.filter((_, i) => i !== idx)); }
  function updateLine(idx, field, val) { const nl = [...lineItems]; nl[idx] = { ...nl[idx], [field]: val }; setLineItems(nl); }

  function calcLineTotal(line) {
    const base = line.quantity * line.unit_price;
    const disc = base * (line.discount_percent / 100);
    const afterDisc = base - disc;
    const tax = afterDisc * (line.tax_percent / 100);
    return afterDisc + tax;
  }

  async function generatePINumber() {
    const prefix = `PI-${selectedOrg.code}-`;
    const { data } = await supabase.from('purchase_invoices').select('invoice_number').eq('organization_id', selectedOrg.id).like('invoice_number', prefix + '%').order('created_at', { ascending: false }).limit(1);
    let nextNum = 1;
    if (data && data.length > 0) {
      const lastNum = parseInt(data[0].invoice_number.replace(prefix, ''), 10);
      if (!isNaN(lastNum)) nextNum = lastNum + 1;
    }
    return prefix + String(nextNum).padStart(4, '0');
  }

  async function handleSave() {
    if (!form.vendor_id || lineItems.filter(l => l.item_id).length === 0) return;
    setSaving(true);
    try {
      // Validate invoice date
      const inputDate = new Date(form.invoice_date);
      const today = new Date();
      const maxBackdateDays = selectedOrg.max_backdate_days || 3;
      const daysDiff = Math.floor((today - inputDate) / (1000 * 60 * 60 * 24));
      if (daysDiff > maxBackdateDays) {
        showNotification('Invoice date exceeds maximum backdate limit (' + maxBackdateDays + ' days)', 'error');
        setSaving(false);
        return;
      }

      // Check if period is locked
      const periodMonth = inputDate.getMonth() + 1;
      const periodYear = inputDate.getFullYear();
      const { data: locks } = await supabase.from('period_locks')
        .select('*')
        .eq('organization_id', selectedOrg.id)
        .eq('period_month', periodMonth)
        .eq('period_year', periodYear)
        .eq('is_locked', true)
        .single();
      if (locks) {
        showNotification('Period is locked', 'error');
        setSaving(false);
        return;
      }

      const validLines = lineItems.filter(l => l.item_id);
      const subtotal = validLines.reduce((s, l) => s + (l.quantity * l.unit_price), 0);
      const totalDiscount = validLines.reduce((s, l) => s + (l.quantity * l.unit_price * l.discount_percent / 100), 0);
      const afterDiscTotal = subtotal - totalDiscount;
      const totalTax = validLines.reduce((s, l) => {
        const base = l.quantity * l.unit_price;
        const disc = base * (l.discount_percent / 100);
        return s + ((base - disc) * l.tax_percent / 100);
      }, 0);
      const totalAmount = afterDiscTotal + totalTax;

      if (editing) {
        const { error } = await supabase.from('purchase_invoices').update({
          vendor_id: form.vendor_id, invoice_number: form.invoice_number || null,
          invoice_date: form.invoice_date, due_date: form.due_date || null,
          po_id: form.po_id || null, notes: form.notes || null,
          subtotal, discount_amount: totalDiscount, tax_amount: totalTax, total_amount: totalAmount
        }).eq('id', editing.id);
        if (error) throw error;
        await supabase.from('purchase_invoice_items').delete().eq('pi_id', editing.id);
        const itemsPayload = validLines.map(l => ({
          pi_id: editing.id, item_id: l.item_id, quantity: l.quantity,
          unit_price: l.unit_price, discount_percent: l.discount_percent, tax_percent: l.tax_percent,
          total_price: calcLineTotal(l)
        }));
        const { error: itemErr } = await supabase.from('purchase_invoice_items').insert(itemsPayload);
        if (itemErr) throw itemErr;
      } else {
        const piNumber = await generatePINumber();
        const { data: newPI, error } = await supabase.from('purchase_invoices').insert({
          pi_number: piNumber, organization_id: selectedOrg.id, vendor_id: form.vendor_id,
          invoice_number: form.invoice_number || null, invoice_date: form.invoice_date,
          due_date: form.due_date || null, po_id: form.po_id || null,
          status: 'DRAFT', payment_status: 'UNPAID', notes: form.notes || null,
          subtotal, discount_amount: totalDiscount, tax_amount: totalTax, total_amount: totalAmount
        }).select().single();
        if (error) throw error;
        const itemsPayload = validLines.map(l => ({
          pi_id: newPI.id, item_id: l.item_id, quantity: l.quantity,
          unit_price: l.unit_price, discount_percent: l.discount_percent, tax_percent: l.tax_percent,
          total_price: calcLineTotal(l)
        }));
        const { error: itemErr } = await supabase.from('purchase_invoice_items').insert(itemsPayload);
        if (itemErr) throw itemErr;
      }
      showNotification(t('pi.successSave'));
      setShowModal(false);
      loadAll();
    } catch (err) { showNotification('Error: ' + err.message, 'error'); }
    setSaving(false);
  }

  async function handleDelete(pi) {
    if (pi.status !== 'DRAFT') { showNotification('Cannot delete — status is ' + pi.status, 'error'); return; }
    if (!confirm(t('pi.confirmDelete'))) return;
    try {
      await supabase.from('purchase_invoice_items').delete().eq('pi_id', pi.id);
      const { error } = await supabase.from('purchase_invoices').delete().eq('id', pi.id);
      if (error) throw error;
      showNotification(t('pi.successDelete'));
      loadAll();
    } catch (err) { showNotification('Error: ' + err.message, 'error'); }
  }

  async function submitForApproval(pi) {
    if (!confirm('Submit for approval?')) return;
    const upd = { status: 'PENDING', submitted_by: currentUser?.id, submitted_at: new Date().toISOString() };
    await supabase.from('purchase_invoices').update(upd).eq('id', pi.id);
    await supabase.from('approval_logs').insert({
      organization_id: selectedOrg.id, document_type: 'PI', document_id: pi.id,
      document_number: pi.pi_number, action: 'SUBMITTED', action_by: currentUser?.id,
    });
    showNotification(t('pi.title') + ' submitted for approval', 'success');
    loadAll();
  }

  async function markPaid(pi) {
    await supabase.from('purchase_invoices').update({ payment_status: 'PAID' }).eq('id', pi.id);
    showNotification(t('pi.markPaid'));
    loadAll();
  }

  const grandSubtotal = lineItems.reduce((s, l) => s + (l.quantity * l.unit_price), 0);
  const grandDiscount = lineItems.reduce((s, l) => s + (l.quantity * l.unit_price * l.discount_percent / 100), 0);
  const grandTax = lineItems.reduce((s, l) => { const b = l.quantity * l.unit_price; const d = b * (l.discount_percent/100); return s + ((b-d) * l.tax_percent / 100); }, 0);
  const grandTotal = grandSubtotal - grandDiscount + grandTax;

  const paymentBadgeColor = (ps) => ps === 'PAID' ? 'green' : ps === 'PARTIAL' ? 'yellow' : 'red';

  return (
    <div>
      <PageHeader title={t('pi.title')} subtitle={t('pi.subtitle')}
        actions={<Button onClick={openCreate}><Icons.Plus /> {t('pi.create')}</Button>} />
      <div className="bg-white rounded-xl shadow-sm border border-gray-100">
        <DataTable loading={loading}
          columns={[
            { header: t('pi.number'), render: r => <button onClick={() => openView(r)} className="font-mono text-xs font-semibold text-primary-700 hover:underline cursor-pointer">{r.pi_number}</button> },
            { header: t('pi.invoiceDate'), render: r => new Date(r.invoice_date).toLocaleDateString('id-ID') },
            { header: t('pi.vendor'), render: r => r.vendors?.name || '-' },
            { header: t('pi.fromPO'), render: r => r.purchase_orders?.po_number ? <Badge color="blue">{r.purchase_orders.po_number}</Badge> : '-' },
            { header: t('pi.totalAmount'), render: r => formatCurrency(r.total_amount) },
            { header: t('common.status'), render: r => <StatusBadge status={r.status}/> },
            { header: t('approval.info'), render: r => r.approved_by ? (
              <div className="text-xs">
                <div className="font-medium text-green-700">{getUserName(r.approved_by)}</div>
                <div className="text-gray-400">{r.approved_at ? new Date(r.approved_at).toLocaleDateString('id-ID') : ''}</div>
              </div>
            ) : r.status === 'PENDING' ? <span className="text-xs text-yellow-600">{t('approval.notApproved')}</span> : <span className="text-xs text-gray-400">-</span> },
            { header: t('pi.paymentStatus'), render: r => <Badge color={paymentBadgeColor(r.payment_status)}>{r.payment_status}</Badge> },
          ]}
          data={invoices}
          actions={(row) => (
            <div className="flex items-center gap-1">
              {row.status === 'DRAFT' && <button onClick={e=>{e.stopPropagation();submitForApproval(row)}} className="p-1 text-xs bg-blue-50 text-blue-600 rounded hover:bg-blue-100">{t('pi.submit')}</button>}
              {row.status === 'APPROVED' && row.payment_status !== 'PAID' && <button onClick={e=>{e.stopPropagation();markPaid(row)}} className="p-1 text-xs bg-emerald-50 text-emerald-700 rounded hover:bg-emerald-100">{t('pi.markPaid')}</button>}
              {row.status === 'DRAFT' && <button onClick={e=>{e.stopPropagation();openEdit(row)}} className="p-1.5 hover:bg-gray-100 rounded-lg text-gray-500"><Icons.Edit /></button>}
              {row.status === 'DRAFT' && <button onClick={e=>{e.stopPropagation();handleDelete(row)}} className="p-1.5 hover:bg-red-50 rounded-lg text-red-400"><Icons.Trash /></button>}
            </div>
          )}
        />
        {invoices.length === 0 && !loading && (
          <div className="p-8 text-center text-gray-500"><Icons.ClipboardList /><p className="mt-2">{t('pi.empty')}</p></div>
        )}
      </div>

      <Modal open={showModal} onClose={() => setShowModal(false)} title={editing ? 'Edit Invoice' : t('pi.create')} size="xl">
        <div className="grid grid-cols-1 sm:grid-cols-3 gap-4 mb-4">
          <FormField label={t('pi.vendor')} required>
            <Select value={form.vendor_id} onChange={e => setForm({...form, vendor_id: e.target.value})}>
              <option value="">{t('pi.selectVendor')}</option>
              {vendors.map(v => <option key={v.id} value={v.id}>{v.code} - {v.name}</option>)}
            </Select>
          </FormField>
          <FormField label={t('pi.invoiceNumber')}>
            <Input value={form.invoice_number} onChange={e => setForm({...form, invoice_number: e.target.value})} placeholder="INV-001" />
          </FormField>
          <FormField label={t('pi.invoiceDate')} required>
            <Input type="date" value={form.invoice_date} onChange={e => setForm({...form, invoice_date: e.target.value})} />
          </FormField>
          <FormField label={t('pi.dueDate')}>
            <Input type="date" value={form.due_date} onChange={e => setForm({...form, due_date: e.target.value})} />
          </FormField>
          <FormField label={t('pi.importFromPO')}>
            <Select value={form.po_id} onChange={e => { setForm({...form, po_id: e.target.value}); importFromPO(e.target.value); }}>
              <option value="">{t('pi.selectPO')}</option>
              {pos.map(p => <option key={p.id} value={p.id}>{p.po_number}</option>)}
            </Select>
          </FormField>
          <FormField label={t('pi.notes')}>
            <Input value={form.notes} onChange={e => setForm({...form, notes: e.target.value})} />
          </FormField>
        </div>

        <div className="border-t pt-4">
          <div className="flex justify-between items-center mb-3">
            <h4 className="font-semibold text-sm">{t('pi.addItem')}</h4>
            <button onClick={addLine} className="text-xs text-primary-600 hover:text-primary-800 font-medium">+ {t('pi.addItem')}</button>
          </div>
          <div className="overflow-x-auto">
            <table className="w-full text-sm">
              <thead><tr className="bg-gray-50">
                <th className="p-2 text-left">{t('dashboard.item')}</th>
                <th className="p-2 text-right w-16">{t('pi.qty')}</th>
                <th className="p-2 text-right w-28">{t('pi.unitPrice')}</th>
                <th className="p-2 text-right w-16">{t('pi.discount')}</th>
                <th className="p-2 text-right w-16">{t('pi.tax')}</th>
                <th className="p-2 text-right w-28">{t('pi.lineTotal')}</th>
                <th className="p-2 w-10"></th>
              </tr></thead>
              <tbody>
                {lineItems.map((line, idx) => (
                  <tr key={idx} className="border-b">
                    <td className="p-2">
                      <SearchableItemSelect items={items} value={line.item_id} onChange={v => updateLine(idx, 'item_id', v)} placeholder={t('pr.selectItem')} />
                    </td>
                    <td className="p-2"><input type="number" value={line.quantity} onChange={e => updateLine(idx, 'quantity', parseFloat(e.target.value)||0)}
                      className="w-full px-2 py-1 border rounded text-sm text-right" min="1" /></td>
                    <td className="p-2"><input type="number" value={line.unit_price} onChange={e => updateLine(idx, 'unit_price', parseFloat(e.target.value)||0)}
                      className="w-full px-2 py-1 border rounded text-sm text-right" min="0" /></td>
                    <td className="p-2"><input type="number" value={line.discount_percent} onChange={e => updateLine(idx, 'discount_percent', parseFloat(e.target.value)||0)}
                      className="w-full px-2 py-1 border rounded text-sm text-right" min="0" max="100" /></td>
                    <td className="p-2"><input type="number" value={line.tax_percent} onChange={e => updateLine(idx, 'tax_percent', parseFloat(e.target.value)||0)}
                      className="w-full px-2 py-1 border rounded text-sm text-right" min="0" max="100" /></td>
                    <td className="p-2 text-right font-medium">{formatCurrency(calcLineTotal(line))}</td>
                    <td className="p-2">{lineItems.length > 1 && <button onClick={() => removeLine(idx)} className="text-red-400 hover:text-red-600"><Icons.Trash /></button>}</td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
          <div className="mt-3 flex flex-col items-end gap-1 text-sm">
            <div className="flex gap-4"><span className="text-gray-500">{t('pi.subtotal')}:</span><span className="w-28 text-right">{formatCurrency(grandSubtotal)}</span></div>
            <div className="flex gap-4"><span className="text-gray-500">{t('pi.discountAmount')}:</span><span className="w-28 text-right text-red-500">-{formatCurrency(grandDiscount)}</span></div>
            <div className="flex gap-4"><span className="text-gray-500">{t('pi.taxAmount')}:</span><span className="w-28 text-right">+{formatCurrency(grandTax)}</span></div>
            <div className="flex gap-4 font-bold text-base border-t pt-1"><span>{t('pi.totalAmount')}:</span><span className="w-28 text-right">{formatCurrency(grandTotal)}</span></div>
          </div>
        </div>

        <div className="flex justify-end gap-3 mt-6 pt-4 border-t">
          <Button variant="secondary" onClick={() => setShowModal(false)}>{t('common.cancel')}</Button>
          <Button onClick={handleSave} disabled={saving}>{editing ? t('common.update') : t('common.save')}</Button>
        </div>
      </Modal>

      {viewDoc && (
        <Modal open={!!viewDoc} onClose={() => setViewDoc(null)} title={`PI Details: ${viewDoc.pi_number}`} size="lg">
          <div className="space-y-4">
            <div className="grid grid-cols-2 gap-4 bg-gray-50 p-4 rounded">
              <div>
                <p className="text-xs text-gray-500">{t('pi.number')}</p>
                <p className="font-semibold">{viewDoc.pi_number}</p>
              </div>
              <div>
                <p className="text-xs text-gray-500">{t('pi.invoiceNumber')}</p>
                <p className="font-semibold">{viewDoc.invoice_number || '-'}</p>
              </div>
              <div>
                <p className="text-xs text-gray-500">{t('pi.invoiceDate')}</p>
                <p className="font-semibold">{new Date(viewDoc.invoice_date).toLocaleDateString('id-ID')}</p>
              </div>
              <div>
                <p className="text-xs text-gray-500">{t('pi.vendor')}</p>
                <p className="font-semibold">{viewDoc.vendors?.name}</p>
              </div>
              {viewDoc.po_id && (
                <div>
                  <p className="text-xs text-gray-500">{t('pi.fromPO')}</p>
                  <p className="font-semibold">{viewDoc.purchase_orders?.po_number}</p>
                </div>
              )}
              <div>
                <p className="text-xs text-gray-500">{t('common.status')}</p>
                <StatusBadge status={viewDoc.status} />
              </div>
              {viewDoc.notes && (
                <div className="col-span-2">
                  <p className="text-xs text-gray-500">{t('pi.notes')}</p>
                  <p className="text-sm">{viewDoc.notes}</p>
                </div>
              )}
            </div>
            {viewItems.length > 0 && (
              <div>
                <h4 className="font-semibold mb-2">{t('pi.items')}</h4>
                <table className="w-full text-sm">
                  <thead className="bg-gray-50">
                    <tr>
                      <th className="text-left p-2">{t('dashboard.item')}</th>
                      <th className="text-right p-2">{t('pi.qty')}</th>
                      <th className="text-right p-2">{t('pi.unitPrice')}</th>
                      <th className="text-right p-2">{t('pi.lineTotal')}</th>
                    </tr>
                  </thead>
                  <tbody>
                    {viewItems.map((item, idx) => (
                      <tr key={idx} className="border-b">
                        <td className="p-2"><span className="font-mono text-xs">{item.items?.code}</span> - {item.items?.name}</td>
                        <td className="p-2 text-right">{formatNumber(item.quantity)}</td>
                        <td className="p-2 text-right">{formatCurrency(item.unit_price)}</td>
                        <td className="p-2 text-right font-medium">{formatCurrency(item.total_price)}</td>
                      </tr>
                    ))}
                  </tbody>
                </table>
              </div>
            )}
          </div>
          <div className="flex justify-end gap-3 mt-6 pt-4 border-t">
            <Button variant="secondary" onClick={() => setViewDoc(null)}>{t('common.close')}</Button>
          </div>
        </Modal>
      )}
    </div>
  );
}

// ============================================================
// PURCHASE RECEIVED PAGE (Goods Receipt from PI)
// ============================================================
function PurchaseReceivedPage() {
  const { selectedOrg, showNotification } = useApp();
  const { t } = useTranslation();
  const [receipts, setReceipts] = useState([]);
  const [invoices, setInvoices] = useState([]);
  const [allItems, setAllItems] = useState([]);
  const [warehouses, setWarehouses] = useState([]);
  const [loading, setLoading] = useState(true);
  const [showModal, setShowModal] = useState(false);
  const [saving, setSaving] = useState(false);
  const [form, setForm] = useState({ pi_id: '', received_date: new Date().toISOString().split('T')[0], notes: '' });
  const [lineItems, setLineItems] = useState([]);
  const [selectedPI, setSelectedPI] = useState(null);
  const [viewDoc, setViewDoc] = useState(null);
  const [viewItems, setViewItems] = useState([]);

  useEffect(() => { if(selectedOrg) loadAll(); }, [selectedOrg]);

  async function loadAll() {
    setLoading(true);
    const [grRes, piRes, itemRes, whRes] = await Promise.all([
      supabase.from('purchase_received').select('*, vendors(name, code), purchase_invoices(pi_number, invoice_number)').eq('organization_id', selectedOrg.id).order('created_at', { ascending: false }),
      supabase.from('purchase_invoices').select('*, vendors(name, code)').eq('organization_id', selectedOrg.id).eq('status', 'APPROVED').order('pi_number'),
      supabase.from('items').select('id, code, name, default_warehouse_id').eq('is_active', true).order('code'),
      supabase.from('warehouses').select('*').eq('organization_id', selectedOrg.id).eq('is_active', true).order('name'),
    ]);
    setReceipts(grRes.data || []);
    setInvoices(piRes.data || []);
    setAllItems(itemRes.data || []);
    setWarehouses(whRes.data || []);
    setLoading(false);
  }

  async function generateGRNumber() {
    const prefix = `GR-${selectedOrg.code}-`;
    const { data } = await supabase.from('goods_receipts').select('gr_number').eq('organization_id', selectedOrg.id).like('gr_number', prefix + '%').order('created_at', { ascending: false }).limit(1);
    let nextNum = 1;
    if (data && data.length > 0) {
      const lastNum = parseInt(data[0].gr_number.replace(prefix, ''), 10);
      if (!isNaN(lastNum)) nextNum = lastNum + 1;
    }
    return prefix + String(nextNum).padStart(4, '0');
  }

  async function loadPIItems(piId) {
    if (!piId) { setLineItems([]); setSelectedPI(null); return; }
    const pi = invoices.find(p => p.id === piId);
    setSelectedPI(pi);
    setForm(f => ({ ...f, pi_id: piId }));

    // Load PI line items
    const { data: piItems } = await supabase.from('purchase_invoice_items').select('*').eq('pi_id', piId);

    // Load previously received quantities for this PI
    const { data: prevGRs } = await supabase.from('purchase_received').select('id').eq('pi_id', piId).eq('status', 'CONFIRMED');
    let prevReceivedMap = {};
    if (prevGRs && prevGRs.length > 0) {
      const grIds = prevGRs.map(g => g.id);
      const { data: prevItems } = await supabase.from('purchase_received_items').select('item_id, received_qty').in('gr_id', grIds);
      (prevItems || []).forEach(pi => {
        prevReceivedMap[pi.item_id] = (prevReceivedMap[pi.item_id] || 0) + parseFloat(pi.received_qty);
      });
    }

    const lines = (piItems || []).map(pi => {
      const item = allItems.find(i => i.id === pi.item_id);
      const prevReceived = prevReceivedMap[pi.item_id] || 0;
      const remaining = parseFloat(pi.quantity) - prevReceived;
      return {
        item_id: pi.item_id,
        item_code: item?.code || '',
        item_name: item?.name || '',
        pi_qty: parseFloat(pi.quantity),
        unit_price: parseFloat(pi.unit_price) || 0,
        prev_received: prevReceived,
        remaining: remaining,
        received_qty: remaining > 0 ? remaining : 0,
        warehouse_id: item?.default_warehouse_id || '',
      };
    });
    setLineItems(lines);
  }

  async function openView(gr) {
    setViewDoc(gr);
    const { data } = await supabase.from('purchase_received_items').select('*, items(code, name)').eq('gr_id', gr.id);
    setViewItems(data || []);
  }

  function openCreate() {
    setForm({ pi_id: '', received_date: new Date().toISOString().split('T')[0], notes: '' });
    setLineItems([]);
    setSelectedPI(null);
    setShowModal(true);
  }

  async function handleSave() {
    if (!form.pi_id || lineItems.length === 0) { showNotification('Please select a Purchase Invoice', 'error'); return; }
    const validLines = lineItems.filter(l => l.received_qty > 0);
    if (validLines.length === 0) { showNotification('No items to receive', 'error'); return; }

    // Validate warehouse is selected for every line
    for (const l of validLines) {
      if (!l.warehouse_id) {
        showNotification(t('gr.errorNoWarehouse') + `: ${l.item_code}`, 'error');
        return;
      }
    }

    // Validate no line exceeds remaining
    for (const l of validLines) {
      if (l.received_qty > l.remaining + 0.001) {
        showNotification(t('gr.errorOverQty') + `: ${l.item_code}`, 'error');
        return;
      }
    }

    setSaving(true);
    try {
      const grNumber = await generateGRNumber();
      const pi = invoices.find(p => p.id === form.pi_id);
      const { data: newGR, error } = await supabase.from('purchase_received').insert({
        organization_id: selectedOrg.id,
        gr_number: grNumber,
        pi_id: form.pi_id,
        vendor_id: pi?.vendor_id || null,
        received_date: form.received_date,
        notes: form.notes || null,
        status: 'DRAFT',
      }).select().single();
      if (error) throw error;

      const itemsPayload = validLines.map(l => ({
        gr_id: newGR.id,
        item_id: l.item_id,
        pi_item_qty: l.pi_qty,
        received_qty: l.received_qty,
        unit_price: l.unit_price,
        warehouse_id: l.warehouse_id || null,
      }));
      const { error: itemErr } = await supabase.from('purchase_received_items').insert(itemsPayload);
      if (itemErr) throw itemErr;

      showNotification(t('gr.successSave'));
      setShowModal(false);
      loadAll();
    } catch (err) { showNotification(t('gr.errorSave') + ': ' + err.message, 'error'); }
    setSaving(false);
  }

  async function confirmReceipt(gr) {
    if (!confirm(t('gr.confirmReceipt'))) return;
    try {
      // Load GR items
      const { data: grItems, error: grErr } = await supabase.from('purchase_received_items').select('*').eq('gr_id', gr.id);
      if (grErr) throw new Error('Failed to load GR items: ' + grErr.message);
      if (!grItems || grItems.length === 0) throw new Error('No items in this receipt');

      // Create stock movements and update stock balance for each item
      for (const item of grItems) {
        const qty = parseFloat(item.received_qty);
        if (qty <= 0) continue;
        const unitPrice = parseFloat(item.unit_price) || 0;
        const totalCost = qty * unitPrice;

        const { error: smErr } = await supabase.from('stock_movements').insert({
          organization_id: selectedOrg.id,
          item_id: item.item_id,
          movement_type: 'IN',
          quantity: qty,
          unit_cost: unitPrice,
          total_cost: totalCost,
          reference_type: 'GR',
          reference_number: gr.gr_number,
          notes: 'Goods received from ' + (gr.purchase_invoices?.pi_number || 'PI'),
          warehouse_id: item.warehouse_id || null,
        });
        if (smErr) throw new Error('Stock movement error: ' + smErr.message);

        // Upsert stock_balance: get current balance then update
        const { data: existing, error: sbErr } = await supabase.from('stock_balance')
          .select('id, quantity, avg_cost, total_value')
          .eq('organization_id', selectedOrg.id)
          .eq('item_id', item.item_id)
          .maybeSingle();

        if (existing) {
          const newQty = parseFloat(existing.quantity) + qty;
          const newTotalValue = parseFloat(existing.total_value) + totalCost;
          const newAvgCost = newQty > 0 ? newTotalValue / newQty : 0;
          await supabase.from('stock_balance').update({
            quantity: newQty,
            avg_cost: newAvgCost,
            total_value: newTotalValue,
            last_movement_at: new Date().toISOString(),
            updated_at: new Date().toISOString(),
          }).eq('id', existing.id);
        } else {
          await supabase.from('stock_balance').insert({
            organization_id: selectedOrg.id,
            item_id: item.item_id,
            quantity: qty,
            avg_cost: unitPrice,
            total_value: totalCost,
            last_movement_at: new Date().toISOString(),
            updated_at: new Date().toISOString(),
          });
        }
      }

      // Update GR status to CONFIRMED
      await supabase.from('purchase_received').update({ status: 'CONFIRMED' }).eq('id', gr.id);

      // Update PI status to RECEIVED if all items fully received
      if (gr.pi_id) {
        const { data: piItems } = await supabase.from('purchase_invoice_items').select('item_id, quantity').eq('pi_id', gr.pi_id);
        const { data: allGRs } = await supabase.from('purchase_received').select('id').eq('pi_id', gr.pi_id).eq('status', 'CONFIRMED');
        const grIds = (allGRs || []).map(g => g.id);
        // Include the current GR we just confirmed
        if (!grIds.includes(gr.id)) grIds.push(gr.id);
        const { data: allGRItems } = await supabase.from('purchase_received_items').select('item_id, received_qty').in('gr_id', grIds);

        let totalReceivedMap = {};
        (allGRItems || []).forEach(g => {
          totalReceivedMap[g.item_id] = (totalReceivedMap[g.item_id] || 0) + parseFloat(g.received_qty);
        });

        const allFullyReceived = (piItems || []).every(pi => {
          const received = totalReceivedMap[pi.item_id] || 0;
          return received >= parseFloat(pi.quantity) - 0.001;
        });

        if (allFullyReceived) {
          await supabase.from('purchase_invoices').update({ status: 'RECEIVED' }).eq('id', gr.pi_id);
        }
      }

      showNotification(t('gr.successConfirm'));
      loadAll();
    } catch (err) { showNotification('Error: ' + err.message, 'error'); }
  }

  async function handleDelete(gr) {
    if (gr.status !== 'DRAFT') { showNotification('Cannot delete — status is ' + gr.status, 'error'); return; }
    if (!confirm(t('gr.confirmDelete'))) return;
    try {
      await supabase.from('purchase_received_items').delete().eq('gr_id', gr.id);
      const { error } = await supabase.from('purchase_received').delete().eq('id', gr.id);
      if (error) throw error;
      showNotification(t('gr.successDelete'));
      loadAll();
    } catch (err) { showNotification('Error: ' + err.message, 'error'); }
  }

  function updateLine(idx, field, val) {
    const nl = [...lineItems];
    nl[idx] = { ...nl[idx], [field]: val };
    setLineItems(nl);
  }

  return (
    <div>
      <PageHeader title={t('gr.title')} subtitle={t('gr.subtitle')}
        actions={<Button onClick={openCreate}><Icons.Plus /> {t('gr.create')}</Button>} />
      <div className="bg-white rounded-xl shadow-sm border border-gray-100">
        <DataTable loading={loading}
          columns={[
            { header: t('gr.number'), render: r => <button onClick={() => openView(r)} className="font-mono text-xs font-semibold text-primary-700 hover:underline cursor-pointer">{r.gr_number}</button> },
            { header: t('gr.receivedDate'), render: r => new Date(r.received_date).toLocaleDateString('id-ID') },
            { header: t('pi.vendor'), render: r => r.vendors?.name || '-' },
            { header: t('gr.fromPI'), render: r => r.purchase_invoices?.pi_number ? <Badge color="blue">{r.purchase_invoices.pi_number}</Badge> : '-' },
            { header: t('gr.status'), render: r => <Badge color={r.status === 'CONFIRMED' ? 'green' : 'yellow'}>{r.status}</Badge> },
            { header: t('gr.notes'), render: r => r.notes || '-' },
          ]}
          data={receipts}
          actions={(row) => (
            <div className="flex items-center gap-1">
              {row.status === 'DRAFT' && <button onClick={e=>{e.stopPropagation();confirmReceipt(row)}} className="p-1 text-xs bg-green-50 text-green-600 rounded hover:bg-green-100">{t('gr.confirm')}</button>}
              {row.status === 'DRAFT' && <button onClick={e=>{e.stopPropagation();handleDelete(row)}} className="p-1.5 hover:bg-red-50 rounded-lg text-red-400"><Icons.Trash /></button>}
            </div>
          )}
        />
        {receipts.length === 0 && !loading && (
          <div className="p-8 text-center text-gray-500"><Icons.Truck /><p className="mt-2">{t('gr.empty')}</p></div>
        )}
      </div>

      <Modal open={showModal} onClose={() => setShowModal(false)} title={t('gr.create')} size="xl">
        <div className="grid grid-cols-1 sm:grid-cols-3 gap-4 mb-4">
          <FormField label={t('gr.selectPI')} required>
            <Select value={form.pi_id} onChange={e => loadPIItems(e.target.value)}>
              <option value="">{t('gr.selectPI')}</option>
              {invoices.map(pi => <option key={pi.id} value={pi.id}>{pi.pi_number} - {pi.vendors?.name || ''} ({pi.invoice_number || ''})</option>)}
            </Select>
          </FormField>
          <FormField label={t('gr.receivedDate')} required>
            <Input type="date" value={form.received_date} onChange={e => setForm({...form, received_date: e.target.value})} />
          </FormField>
          <FormField label={t('gr.notes')}>
            <Input value={form.notes} onChange={e => setForm({...form, notes: e.target.value})} placeholder={t('gr.notes')} />
          </FormField>
        </div>

        {lineItems.length > 0 && (
          <div className="border-t pt-4">
            <h4 className="font-semibold text-sm mb-3">{t('pi.addItem')}</h4>
            <div className="overflow-x-auto">
              <table className="w-full text-sm">
                <thead><tr className="bg-gray-50">
                  <th className="p-2 text-left">{t('dashboard.item')}</th>
                  <th className="p-2 text-right w-20">{t('gr.piQty')}</th>
                  <th className="p-2 text-right w-20">{t('gr.prevReceived')}</th>
                  <th className="p-2 text-right w-20">{t('gr.remaining')}</th>
                  <th className="p-2 text-right w-24">{t('gr.receivedQty')}</th>
                  <th className="p-2 text-left w-40">{t('gr.warehouse')}</th>
                </tr></thead>
                <tbody>
                  {lineItems.map((line, idx) => (
                    <tr key={idx} className={`border-b ${line.remaining <= 0 ? 'bg-gray-50 opacity-50' : ''}`}>
                      <td className="p-2"><span className="font-mono text-xs bg-gray-100 px-1.5 py-0.5 rounded mr-1">{line.item_code}</span> {line.item_name}</td>
                      <td className="p-2 text-right font-medium">{formatNumber(line.pi_qty)}</td>
                      <td className="p-2 text-right">{line.prev_received > 0 ? <span className="text-blue-600">{formatNumber(line.prev_received)}</span> : <span className="text-gray-300">0</span>}</td>
                      <td className="p-2 text-right">{line.remaining > 0 ? <span className="text-orange-600 font-medium">{formatNumber(line.remaining)}</span> : <span className="text-green-600 font-medium">Done</span>}</td>
                      <td className="p-2">
                        <input type="number" min="0" max={line.remaining} step="0.01"
                          value={line.received_qty} onChange={e => updateLine(idx, 'received_qty', parseFloat(e.target.value) || 0)}
                          className="w-full px-2 py-1 border rounded text-sm text-right" disabled={line.remaining <= 0} />
                      </td>
                      <td className="p-2">
                        <select value={line.warehouse_id} onChange={e => updateLine(idx, 'warehouse_id', e.target.value)}
                          className="w-full px-2 py-1 border rounded text-sm">
                          <option value="">{t('gr.selectWarehouse')}</option>
                          {warehouses.map(w => <option key={w.id} value={w.id}>{w.name}</option>)}
                        </select>
                      </td>
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>
          </div>
        )}

        <div className="flex justify-end gap-3 mt-6 pt-4 border-t">
          <Button variant="secondary" onClick={() => setShowModal(false)}>{t('common.cancel')}</Button>
          <Button onClick={handleSave} disabled={saving || lineItems.length === 0}>{t('common.save')}</Button>
        </div>
      </Modal>

      {viewDoc && (
        <Modal open={!!viewDoc} onClose={() => setViewDoc(null)} title={`GR Details: ${viewDoc.gr_number}`} size="lg">
          <div className="space-y-4">
            <div className="grid grid-cols-2 gap-4 bg-gray-50 p-4 rounded">
              <div>
                <p className="text-xs text-gray-500">{t('gr.number')}</p>
                <p className="font-semibold">{viewDoc.gr_number}</p>
              </div>
              <div>
                <p className="text-xs text-gray-500">{t('gr.receivedDate')}</p>
                <p className="font-semibold">{new Date(viewDoc.received_date).toLocaleDateString('id-ID')}</p>
              </div>
              {viewDoc.purchase_invoices && (
                <div>
                  <p className="text-xs text-gray-500">{t('gr.fromPI')}</p>
                  <p className="font-semibold">{viewDoc.purchase_invoices.pi_number}</p>
                </div>
              )}
              <div>
                <p className="text-xs text-gray-500">{t('gr.status')}</p>
                <Badge color={viewDoc.status === 'CONFIRMED' ? 'green' : 'yellow'}>{viewDoc.status}</Badge>
              </div>
              {viewDoc.notes && (
                <div className="col-span-2">
                  <p className="text-xs text-gray-500">{t('gr.notes')}</p>
                  <p className="text-sm">{viewDoc.notes}</p>
                </div>
              )}
            </div>
            {viewItems.length > 0 && (
              <div>
                <h4 className="font-semibold mb-2">{t('gr.items')}</h4>
                <table className="w-full text-sm">
                  <thead className="bg-gray-50">
                    <tr>
                      <th className="text-left p-2">{t('dashboard.item')}</th>
                      <th className="text-right p-2">{t('gr.piQty')}</th>
                      <th className="text-right p-2">{t('gr.receivedQty')}</th>
                    </tr>
                  </thead>
                  <tbody>
                    {viewItems.map((item, idx) => (
                      <tr key={idx} className="border-b">
                        <td className="p-2"><span className="font-mono text-xs">{item.items?.code}</span> - {item.items?.name}</td>
                        <td className="p-2 text-right">{formatNumber(item.pi_item_qty)}</td>
                        <td className="p-2 text-right font-medium">{formatNumber(item.received_qty)}</td>
                      </tr>
                    ))}
                  </tbody>
                </table>
              </div>
            )}
          </div>
          <div className="flex justify-end gap-3 mt-6 pt-4 border-t">
            <Button variant="secondary" onClick={() => setViewDoc(null)}>{t('common.close')}</Button>
          </div>
        </Modal>
      )}
    </div>
  );
}

// ============================================================
// REPORTS PAGE
// ============================================================
function ReportsPage() {
  const { selectedOrg } = useApp();
  const { t } = useTranslation();
  const [reportType, setReportType] = useState('valuation');
  const [data, setData] = useState([]);
  const [loading, setLoading] = useState(false);
  const [categories, setCategories] = useState([]);
  const [departments, setDepartments] = useState([]);
  const [filterCat, setFilterCat] = useState('');
  const [filterDept, setFilterDept] = useState('');
  const [dateFrom, setDateFrom] = useState('');
  const [dateTo, setDateTo] = useState('');

  useEffect(() => {
    if (selectedOrg) {
      Promise.all([
        supabase.from('item_categories').select('id, code, name').order('code'),
        supabase.from('departments').select('id, code, name').eq('organization_id', selectedOrg.id).eq('is_active', true).order('name'),
      ]).then(([catRes, deptRes]) => {
        setCategories(catRes.data || []);
        setDepartments(deptRes.data || []);
      });
    }
  }, [selectedOrg]);

  useEffect(() => {
    setData(reportType === 'purchase' ? { pos: [], pis: [] } : []);
    if (selectedOrg) generateReport();
  }, [selectedOrg, reportType]);

  async function generateReport() {
    if (!selectedOrg) return;
    setLoading(true);
    setData(reportType === 'purchase' ? { pos: [], pis: [] } : []);
    try {
      if (reportType === 'valuation') {
        let q = supabase.from('stock_balance').select('*, items(code, name, brand, size, category_id, item_categories(name, code)), departments(name, code)').eq('organization_id', selectedOrg.id);
        if (filterDept) q = q.eq('department_id', filterDept);
        const { data: res } = await q.order('total_value', { ascending: false });
        let filtered = res || [];
        if (filterCat) filtered = filtered.filter(r => r.items?.category_id === filterCat);
        setData(filtered);
      } else if (reportType === 'movement') {
        let q = supabase.from('stock_movements').select('*, items(code, name), departments(name, code)').eq('organization_id', selectedOrg.id);
        if (filterDept) q = q.eq('department_id', filterDept);
        if (dateFrom) q = q.gte('created_at', dateFrom);
        if (dateTo) q = q.lte('created_at', dateTo + 'T23:59:59');
        const { data: res } = await q.order('created_at', { ascending: false }).limit(500);
        setData(res || []);
      } else if (reportType === 'purchase') {
        const [poRes, piRes] = await Promise.all([
          supabase.from('purchase_orders').select('*, vendors(name, code)').eq('organization_id', selectedOrg.id).order('order_date', { ascending: false }),
          supabase.from('purchase_invoices').select('*, vendors(name, code), purchase_orders(po_number)').eq('organization_id', selectedOrg.id).order('invoice_date', { ascending: false }),
        ]);
        let poData = poRes.data || [];
        let piData = piRes.data || [];
        if (dateFrom) { poData = poData.filter(r => r.order_date >= dateFrom); piData = piData.filter(r => r.invoice_date >= dateFrom); }
        if (dateTo) { poData = poData.filter(r => r.order_date <= dateTo); piData = piData.filter(r => r.invoice_date <= dateTo); }
        setData({ pos: poData, pis: piData });
      } else if (reportType === 'lowstock') {
        const { data: balances } = await supabase.from('stock_balance').select('*, items(code, name, min_stock, brand, category_id, item_categories(name, code)), departments(name, code)').eq('organization_id', selectedOrg.id);
        let filtered = (balances || []).filter(b => b.items?.min_stock > 0 && b.quantity <= b.items.min_stock);
        if (filterCat) filtered = filtered.filter(r => r.items?.category_id === filterCat);
        setData(filtered);
      } else if (reportType === 'opname') {
        let q = supabase.from('stock_opname').select('*, departments(name, code)').eq('organization_id', selectedOrg.id);
        if (filterDept) q = q.eq('department_id', filterDept);
        if (dateFrom) q = q.gte('opname_date', dateFrom);
        if (dateTo) q = q.lte('opname_date', dateTo);
