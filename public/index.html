function DirectPurchasePage() {
  const { t } = useTranslation();
  const { selectedOrg, showNotification } = useApp();
  const [purchases, setPurchases] = useState([]);
  const [loading, setLoading] = useState(true);
  const [items, setItems] = useState([]);
  const [warehouses, setWarehouses] = useState([]);
  const [showModal, setShowModal] = useState(false);
  const [viewing, setViewing] = useState(null);
  const [saving, setSaving] = useState(false);
  const [search, setSearch] = useState('');
  const [filterStatus, setFilterStatus] = useState('');

  // Form state
  const [purchaseDate, setPurchaseDate] = useState(new Date().toISOString().split('T')[0]);
  const [purchaseLocation, setPurchaseLocation] = useState('');
  const [purchaseItems, setPurchaseItems] = useState([]);
  const [notes, setNotes] = useState('');
  const [viewDoc, setViewDoc] = useState(null);
  const [viewItems, setViewItems] = useState([]);

  useEffect(() => { if (selectedOrg) loadAll(); }, [selectedOrg]);

  async function loadAll() {
    setLoading(true);
    const [dpRes, itemRes, whRes] = await Promise.all([
      supabase.from('direct_purchases')
        .select('*, direct_purchase_items(*, items(code, name, brand, units:unit_id(abbreviation)))')
        .eq('organization_id', selectedOrg.id)
        .order('created_at', { ascending: false }),
      supabase.from('items').select('id, code, name, brand, default_warehouse_id').eq('is_active', true).order('name'),
      supabase.from('warehouses').select('id, code, name').eq('organization_id', selectedOrg.id).eq('is_active', true).order('code'),
    ]);
    setPurchases(dpRes.data || []);
    setItems(itemRes.data || []);
    setWarehouses(whRes.data || []);
    setLoading(false);
  }

  async function generateNumber() {
    const code = selectedOrg.code || 'ORG';
    const { data } = await supabase.from('direct_purchases').select('purchase_number')
      .eq('organization_id', selectedOrg.id).like('purchase_number', `DP-${code}-%`)
      .order('created_at', { ascending: false }).limit(1);
    let next = 1;
    if (data && data.length > 0) {
      const last = parseInt(data[0].purchase_number.split('-').pop()) || 0;
      next = last + 1;
    }
    return `DP-${code}-${String(next).padStart(4, '0')}`;
  }

  function addItem() {
    setPurchaseItems(prev => [...prev, { item_id: '', quantity: 0, unit_price: 0, warehouse_id: '', notes: '' }]);
  }

  function removeItem(idx) {
    setPurchaseItems(prev => prev.filter((_, i) => i !== idx));
  }

  function updateItem(idx, field, value) {
    setPurchaseItems(prev => prev.map((item, i) => i === idx ? { ...item, [field]: value } : item));
  }

  function openNew() {
    setViewing(null);
    setPurchaseDate(new Date().toISOString().split('T')[0]);
    setPurchaseLocation('');
    setPurchaseItems([{ item_id: '', quantity: 0, unit_price: 0, warehouse_id: '', notes: '' }]);
    setNotes('');
    setShowModal(true);
  }

  function openView(dp) {
    setViewing(dp);
    setViewDoc(dp);
    setViewItems(dp.direct_purchase_items || []);
    setShowModal(true);
  }

  async function handleSave() {
    if (!purchaseLocation.trim()) {
      showNotification(t('dp.locationRequired'), 'error'); return;
    }
    const validItems = purchaseItems.filter(i => i.item_id && parseFloat(i.quantity) > 0);
    if (validItems.length === 0) {
      showNotification(t('dp.addItems'), 'error'); return;
    }
    // Validate warehouse for every item
    for (const item of validItems) {
      if (!item.warehouse_id) {
        const it = items.find(i => i.id === item.item_id);
        showNotification(t('dp.selectWarehouse') + `: ${it?.code || ''}`, 'error'); return;
      }
    }

    setSaving(true);
    try {
      // Validate purchase date
      const inputDate = new Date(purchaseDate);
      const today = new Date();
      const maxBackdateDays = selectedOrg.max_backdate_days || 3;
      const daysDiff = Math.floor((today - inputDate) / (1000 * 60 * 60 * 24));
      if (daysDiff > maxBackdateDays) {
        showNotification('Purchase date exceeds maximum backdate limit (' + maxBackdateDays + ' days)', 'error');
        setSaving(false);
        return;
      }

      // Check if period is locked
      const periodMonth = inputDate.getMonth() + 1;
      const periodYear = inputDate.getFullYear();
      const { data: locks } = await supabase.from('period_locks')
        .select('*')
        .eq('organization_id', selectedOrg.id)
        .eq('period_month', periodMonth)
        .eq('period_year', periodYear)
        .eq('is_locked', true)
        .single();
      if (locks) {
        showNotification('Period is locked', 'error');
        setSaving(false);
        return;
      }

      const dpNumber = await generateNumber();
      const totalAmount = validItems.reduce((sum, i) => sum + (parseFloat(i.quantity) * parseFloat(i.unit_price)), 0);

      const { data: dp, error: dpErr } = await supabase.from('direct_purchases').insert({
        organization_id: selectedOrg.id,
        purchase_number: dpNumber,
        purchase_date: purchaseDate,
        purchase_location: purchaseLocation.trim(),
        status: 'DRAFT',
        total_amount: totalAmount,
        notes: notes || null,
      }).select().single();
      if (dpErr) throw dpErr;

      const payload = validItems.map(i => ({
        direct_purchase_id: dp.id,
        item_id: i.item_id,
        quantity: parseFloat(i.quantity),
        unit_price: parseFloat(i.unit_price),
        total_price: parseFloat(i.quantity) * parseFloat(i.unit_price),
        warehouse_id: i.warehouse_id,
        notes: i.notes || null,
      }));
      const { error: iErr } = await supabase.from('direct_purchase_items').insert(payload);
      if (iErr) throw iErr;

      showNotification(t('dp.successSave'));
      setShowModal(false);
      loadAll();
    } catch (err) { showNotification(t('dp.errorSave') + ': ' + err.message, 'error'); }
    setSaving(false);
  }

  async function confirmPurchase(dp) {
    if (!confirm(t('dp.confirmMsg'))) return;
    setSaving(true);
    try {
      const dpItems = dp.direct_purchase_items || [];
      if (dpItems.length === 0) throw new Error('No items');

      for (const item of dpItems) {
        const qty = parseFloat(item.quantity);
        if (qty <= 0) continue;
        const unitPrice = parseFloat(item.unit_price) || 0;
        const totalCost = qty * unitPrice;

        // Create stock movement IN
        const { error: smErr } = await supabase.from('stock_movements').insert({
          organization_id: selectedOrg.id,
          item_id: item.item_id,
          movement_type: 'IN',
          quantity: qty,
          unit_cost: unitPrice,
          total_cost: totalCost,
          reference_type: 'DIRECT_PURCHASE',
          reference_number: dp.purchase_number,
          warehouse_id: item.warehouse_id || null,
          notes: 'Direct purchase from ' + dp.purchase_location,
        });
        if (smErr) throw new Error('Stock movement error: ' + smErr.message);

        // Update stock_balance
        const { data: existing } = await supabase.from('stock_balance')
          .select('id, quantity, avg_cost, total_value')
          .eq('organization_id', selectedOrg.id)
          .eq('item_id', item.item_id)
          .maybeSingle();

        if (existing) {
          const newQty = parseFloat(existing.quantity) + qty;
          const newTotalValue = parseFloat(existing.total_value) + totalCost;
          const newAvgCost = newQty > 0 ? newTotalValue / newQty : 0;
          await supabase.from('stock_balance').update({
            quantity: newQty,
            avg_cost: newAvgCost,
            total_value: newTotalValue,
            last_movement_at: new Date().toISOString(),
            updated_at: new Date().toISOString(),
          }).eq('id', existing.id);
        } else {
          await supabase.from('stock_balance').insert({
            organization_id: selectedOrg.id,
            item_id: item.item_id,
            quantity: qty,
            avg_cost: unitPrice,
            total_value: totalCost,
            last_movement_at: new Date().toISOString(),
            updated_at: new Date().toISOString(),
          });
        }
      }

      await supabase.from('direct_purchases').update({
        status: 'CONFIRMED',
        updated_at: new Date().toISOString(),
      }).eq('id', dp.id);

      showNotification(t('dp.successConfirm'));
      setShowModal(false);
      loadAll();
    } catch (err) { showNotification('Error: ' + err.message, 'error'); }
    setSaving(false);
  }

  async function handleDelete(dp) {
    if (dp.status !== 'DRAFT') { showNotification('Cannot delete — status is ' + dp.status, 'error'); return; }
    if (!confirm(t('dp.confirmDelete'))) return;
    try {
      await supabase.from('direct_purchase_items').delete().eq('direct_purchase_id', dp.id);
      const { error } = await supabase.from('direct_purchases').delete().eq('id', dp.id);
      if (error) throw error;
      showNotification(t('dp.successDelete'));
      loadAll();
    } catch (err) { showNotification('Error: ' + err.message, 'error'); }
  }

  const filtered = purchases.filter(dp => {
    if (filterStatus && dp.status !== filterStatus) return false;
    if (search) {
      const s = search.toLowerCase();
      return dp.purchase_number?.toLowerCase().includes(s) || dp.purchase_location?.toLowerCase().includes(s);
    }
    return true;
  });

  const isView = !!viewing;
  const isDraft = viewing && viewing.status === 'DRAFT';

  // Auto-set warehouse when selecting item
  function handleItemSelect(idx, itemId) {
    const it = items.find(i => i.id === itemId);
    setPurchaseItems(prev => prev.map((item, i) => i === idx ? {
      ...item,
      item_id: itemId,
      warehouse_id: it?.default_warehouse_id || item.warehouse_id,
    } : item));
  }

  return (
    <div>
      <PageHeader title={t('dp.title')} subtitle={`${t('dp.subtitle')} ${selectedOrg?.name}`}
        actions={<Button onClick={openNew}>{t('dp.create')}</Button>} />

      <div className="bg-white rounded-xl shadow-sm border border-gray-100">
        <div className="p-4 border-b border-gray-100 flex flex-wrap gap-3 items-center">
          <input type="text" placeholder={t('dp.searchPlaceholder')} value={search} onChange={e => setSearch(e.target.value)}
            className="w-full sm:w-64 px-4 py-2 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-primary-500" />
          <select value={filterStatus} onChange={e => setFilterStatus(e.target.value)}
            className="px-3 py-2 border border-gray-300 rounded-lg text-sm">
            <option value="">{t('common.all')}</option>
            <option value="DRAFT">{t('status.draft')}</option>
            <option value="CONFIRMED">{t('status.confirmed')}</option>
          </select>
        </div>
        <DataTable loading={loading} columns={[
          { header: t('dp.number'), render: r => <span className="font-medium text-primary-700">{r.purchase_number}</span> },
          { header: t('dp.date'), render: r => new Date(r.purchase_date).toLocaleDateString('id-ID') },
          { header: t('dp.location'), render: r => r.purchase_location || '-' },
          { header: t('common.status'), render: r => <StatusBadge status={r.status} /> },
          { header: t('dp.grandTotal'), render: r => 'Rp ' + formatNumber(r.total_amount) },
          { header: t('dp.items'), render: r => r.direct_purchase_items?.length || 0 },
          { header: t('common.actions'), render: r => (
            <div className="flex gap-2">
              <Button size="sm" variant="ghost" onClick={() => openView(r)}>{t('common.view')}</Button>
              {r.status === 'DRAFT' && <Button size="sm" variant="primary" onClick={() => confirmPurchase(r)} disabled={saving}>{t('dp.confirm')}</Button>}
              {r.status === 'DRAFT' && <button onClick={e => { e.stopPropagation(); handleDelete(r); }} className="p-1.5 hover:bg-red-50 rounded-lg text-red-400"><Icons.Trash /></button>}
            </div>
          )},
        ]} data={filtered} />
        {filtered.length === 0 && !loading && (
          <div className="p-8 text-center text-gray-500"><p>{t('dp.empty')}</p></div>
        )}
      </div>

      <Modal open={showModal} onClose={() => setShowModal(false)} title={isView ? viewing.purchase_number : t('dp.create')} size="xl">
        {!isView ? (
          <>
            <div className="grid grid-cols-1 sm:grid-cols-3 gap-4 mb-6">
              <FormField label={t('dp.date')} required>
                <Input type="date" value={purchaseDate} onChange={e => setPurchaseDate(e.target.value)} />
              </FormField>
              <FormField label={t('dp.location')} required>
                <Input value={purchaseLocation} onChange={e => setPurchaseLocation(e.target.value)} placeholder={t('dp.locationPlaceholder')} />
              </FormField>
              <FormField label={t('dp.notes')}>
                <Input value={notes} onChange={e => setNotes(e.target.value)} placeholder={t('dp.notes')} />
              </FormField>
            </div>

            <div className="mb-4 flex items-center justify-between">
              <h4 className="text-sm font-semibold text-gray-700">{t('dp.items')}</h4>
              <Button size="sm" variant="secondary" onClick={addItem}>+ {t('dp.addItem')}</Button>
            </div>
            <div className="overflow-x-auto border border-gray-200 rounded-lg mb-4">
              <table className="w-full text-sm">
                <thead className="bg-gray-50">
                  <tr>
                    <th className="text-left px-3 py-2 font-medium text-gray-600">{t('dp.selectItem')}</th>
                    <th className="text-center px-3 py-2 font-medium text-gray-600 w-24">{t('dp.qty')}</th>
                    <th className="text-center px-3 py-2 font-medium text-gray-600 w-32">{t('dp.unitPrice')}</th>
                    <th className="text-right px-3 py-2 font-medium text-gray-600 w-32">{t('dp.totalPrice')}</th>
                    <th className="text-left px-3 py-2 font-medium text-gray-600 w-40">{t('dp.warehouse')}</th>
                    <th className="text-center px-3 py-2 font-medium text-gray-600 w-16"></th>
                  </tr>
                </thead>
                <tbody>
                  {purchaseItems.map((pi, idx) => {
                    const lineTotal = (parseFloat(pi.quantity) || 0) * (parseFloat(pi.unit_price) || 0);
                    return (
                      <tr key={idx} className="border-t border-gray-100">
                        <td className="px-3 py-2">
                          <select value={pi.item_id} onChange={e => handleItemSelect(idx, e.target.value)}
                            className="w-full border border-gray-300 rounded px-2 py-1 text-sm">
                            <option value="">{t('dp.selectItem')}</option>
                            {items.map(it => <option key={it.id} value={it.id}>{it.code} - {it.name}{it.brand ? ` (${it.brand})` : ''}</option>)}
                          </select>
                        </td>
                        <td className="px-3 py-2 text-center">
                          <input type="number" value={pi.quantity} min="0" onChange={e => updateItem(idx, 'quantity', e.target.value)}
                            className="w-24 border border-gray-300 rounded px-2 py-1 text-sm text-center" />
                        </td>
                        <td className="px-3 py-2 text-center">
                          <input type="number" value={pi.unit_price} min="0" onChange={e => updateItem(idx, 'unit_price', e.target.value)}
                            className="w-32 border border-gray-300 rounded px-2 py-1 text-sm text-right" />
                        </td>
                        <td className="px-3 py-2 text-right font-medium text-gray-700">
                          Rp {formatNumber(lineTotal)}
                        </td>
                        <td className="px-3 py-2">
                          <select value={pi.warehouse_id} onChange={e => updateItem(idx, 'warehouse_id', e.target.value)}
                            className="w-full border border-gray-300 rounded px-2 py-1 text-sm">
                            <option value="">{t('dp.selectWarehouse')}</option>
                            {warehouses.map(w => <option key={w.id} value={w.id}>{w.code} - {w.name}</option>)}
                          </select>
                        </td>
                        <td className="px-3 py-2 text-center">
                          <button onClick={() => removeItem(idx)} className="text-red-500 hover:text-red-700 text-xs">✕</button>
                        </td>
                      </tr>
                    );
                  })}
                </tbody>
                <tfoot className="bg-gray-50">
                  <tr>
                    <td colSpan="3" className="px-3 py-2 text-right font-semibold text-gray-700">{t('dp.grandTotal')}</td>
                    <td className="px-3 py-2 text-right font-bold text-primary-700">
                      Rp {formatNumber(purchaseItems.reduce((sum, i) => sum + ((parseFloat(i.quantity) || 0) * (parseFloat(i.unit_price) || 0)), 0))}
                    </td>
                    <td colSpan="2"></td>
                  </tr>
                </tfoot>
              </table>
            </div>
          </>
        ) : (
          <>
            <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4 mb-6 bg-gray-50 rounded-lg p-4">
              <div><p className="text-xs text-gray-500">{t('dp.date')}</p><p className="font-medium">{new Date(viewing.purchase_date).toLocaleDateString('id-ID')}</p></div>
              <div><p className="text-xs text-gray-500">{t('dp.location')}</p><p className="font-medium">{viewing.purchase_location}</p></div>
              <div><p className="text-xs text-gray-500">{t('common.status')}</p><StatusBadge status={viewing.status} /></div>
              <div><p className="text-xs text-gray-500">{t('dp.grandTotal')}</p><p className="font-bold text-primary-700">Rp {formatNumber(viewing.total_amount)}</p></div>
            </div>
            <div className="overflow-x-auto border border-gray-200 rounded-lg mb-4">
              <table className="w-full text-sm">
                <thead className="bg-gray-50">
                  <tr>
                    <th className="text-left px-3 py-2 font-medium text-gray-600">{t('dp.selectItem')}</th>
                    <th className="text-center px-3 py-2 font-medium text-gray-600">{t('dp.qty')}</th>
                    <th className="text-right px-3 py-2 font-medium text-gray-600">{t('dp.unitPrice')}</th>
                    <th className="text-right px-3 py-2 font-medium text-gray-600">{t('dp.totalPrice')}</th>
                    <th className="text-left px-3 py-2 font-medium text-gray-600">{t('dp.warehouse')}</th>
                  </tr>
                </thead>
                <tbody>
                  {(viewing.direct_purchase_items || []).map((di, idx) => (
                    <tr key={idx} className="border-t border-gray-100">
                      <td className="px-3 py-2">
                        <span className="font-medium">{di.items?.name}</span>
                        {di.items?.brand && <span className="text-xs text-gray-400 ml-1">({di.items.brand})</span>}
                        <br/><span className="text-xs text-gray-400">{di.items?.code}</span>
                      </td>
                      <td className="px-3 py-2 text-center font-semibold">{formatNumber(di.quantity)} {di.items?.units?.abbreviation}</td>
                      <td className="px-3 py-2 text-right">Rp {formatNumber(di.unit_price)}</td>
                      <td className="px-3 py-2 text-right font-medium">Rp {formatNumber(di.total_price)}</td>
                      <td className="px-3 py-2 text-sm">{warehouses.find(w => w.id === di.warehouse_id)?.code || '-'}</td>
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>
            {viewing.notes && <div className="bg-gray-50 rounded-lg p-3 mb-4"><p className="text-xs text-gray-500 mb-1">{t('dp.notes')}</p><p className="text-sm">{viewing.notes}</p></div>}
          </>
        )}

        <div className="flex justify-end gap-3 mt-4 pt-4 border-t border-gray-200">
          <Button variant="secondary" onClick={() => setShowModal(false)}>{isView ? t('common.close') : t('common.cancel')}</Button>
          {!isView && <Button onClick={handleSave} disabled={saving}>{saving ? t('common.saving') : t('dp.saveDraft')}</Button>}
          {isDraft && <Button variant="primary" onClick={() => confirmPurchase(viewing)} disabled={saving}>{t('dp.confirm')}</Button>}
        </div>
      </Modal>
    </div>
  );
}

// ============================================================
// IN-USE WAREHOUSE PAGE
// ============================================================
function InUseWarehousePage() {
  const { t } = useTranslation();
  const { selectedOrg, showNotification } = useApp();
  const [items, setItems] = useState([]);
  const [categories, setCategories] = useState([]);
  const [loading, setLoading] = useState(true);
  const [search, setSearch] = useState('');
  const [filterCategory, setFilterCategory] = useState('');
  const [inUseWarehouse, setInUseWarehouse] = useState(null);

  useEffect(() => { if (selectedOrg) loadAll(); }, [selectedOrg]);

  async function loadAll() {
    setLoading(true);
    try {
      // Find the in-use warehouse for this hotel
      const { data: whData } = await supabase.from('warehouses').select('*').eq('organization_id', selectedOrg.id).eq('warehouse_type', 'in_use').single();
      setInUseWarehouse(whData);

      if (!whData) { setItems([]); setLoading(false); return; }

      // Get stock balance for this warehouse with qty > 0
      const { data: stockData } = await supabase.from('stock_balance').select('*, items:item_id(id, code, name, brand, category_id, item_categories:category_id(id, name))').eq('warehouse_id', whData.id).gt('quantity', 0);

      setItems(stockData || []);

      // Get categories for filter
      const { data: catData } = await supabase.from('item_categories').select('id, name').eq('organization_id', selectedOrg.id).eq('is_active', true).order('name');
      setCategories(catData || []);
    } catch (e) { console.error(e); }
    setLoading(false);
  }

  async function markDepleted(item) {
    if (!confirm(t('iu.depletedConfirm'))) return;
    try {
      // Stock movement OUT - DEPLETED
      await supabase.from('stock_movements').insert({
        organization_id: selectedOrg.id,
        item_id: item.item_id,
        warehouse_id: inUseWarehouse.id,
        movement_type: 'OUT',
        quantity: item.quantity,
        reference_type: 'DEPLETED',
        reference_id: item.item_id,
        notes: `Depleted from In-Use Warehouse: ${item.items?.name || ''}`,
        created_by: 'system',
      });

      // Update stock balance to 0
      await supabase.from('stock_balance').update({ quantity: 0, updated_at: new Date().toISOString() }).eq('item_id', item.item_id).eq('warehouse_id', inUseWarehouse.id);

      showNotification(t('iu.depletedSuccess'), 'success');
      loadAll();
    } catch (e) {
      console.error(e);
      showNotification(t('iu.depletedError') + ': ' + e.message, 'error');
    }
  }

  const filtered = items.filter(item => {
    const txt = search.toLowerCase();
    const matchSearch = !txt || item.items?.name?.toLowerCase().includes(txt) || item.items?.code?.toLowerCase().includes(txt) || item.items?.brand?.toLowerCase().includes(txt);
    const matchCat = !filterCategory || item.items?.category_id === filterCategory;
    return matchSearch && matchCat;
  });

  return (
    <div className="fade-in">
      <PageHeader title={t('iu.title')} subtitle={`${t('iu.subtitle')} ${selectedOrg?.name || ''}`} />

      {inUseWarehouse && (
        <div className="mb-4 p-3 bg-blue-50 border border-blue-200 rounded-lg text-sm text-blue-700">
          {t('iu.warehouse')}: <strong>{inUseWarehouse.code} - {inUseWarehouse.name}</strong>
        </div>
      )}

      <div className="mb-4 flex gap-3">
        <div className="flex-1">
          <Input placeholder={t('iu.searchPlaceholder')} value={search} onChange={e => setSearch(e.target.value)} />
        </div>
        <div className="w-64">
          <Select value={filterCategory} onChange={e => setFilterCategory(e.target.value)}>
            <option value="">{t('iu.allCategories')}</option>
            {categories.map(c => <option key={c.id} value={c.id}>{c.name}</option>)}
          </Select>
        </div>
      </div>

      {loading ? <div className="flex justify-center py-12"><div className="spinner"></div></div> :
       !inUseWarehouse ? <div className="text-center py-12 text-gray-500">No In-Use warehouse configured for this hotel.</div> :
       filtered.length === 0 ? <div className="text-center py-12 text-gray-500">{t('iu.empty')}</div> :
       <div className="bg-white rounded-lg shadow overflow-hidden">
         <table className="min-w-full divide-y divide-gray-200">
           <thead className="bg-gray-50">
             <tr>
               <th className="px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase">{t('iu.item')}</th>
               <th className="px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase">{t('iu.category')}</th>
               <th className="px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase">{t('iu.qty')}</th>
               <th className="px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase">{t('iu.status')}</th>
               <th className="px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase">{t('iu.lastUpdated')}</th>
               <th className="px-4 py-3 text-center text-xs font-medium text-gray-500 uppercase"></th>
             </tr>
           </thead>
           <tbody className="divide-y divide-gray-200">
             {filtered.map(item => (
               <tr key={item.item_id} className="hover:bg-gray-50">
                 <td className="px-4 py-3 text-sm">
                   <div className="font-medium">{item.items?.code} - {item.items?.name}</div>
                   {item.items?.brand && <div className="text-gray-500 text-xs">{item.items.brand}</div>}
                 </td>
                 <td className="px-4 py-3 text-sm text-gray-600">{item.items?.categories?.name || '-'}</td>
                 <td className="px-4 py-3 text-sm font-medium">{item.quantity}</td>
                 <td className="px-4 py-3"><Badge color="green">{t('iu.inUse')}</Badge></td>
                 <td className="px-4 py-3 text-sm text-gray-500">{item.updated_at ? new Date(item.updated_at).toLocaleDateString() : '-'}</td>
                 <td className="px-4 py-3 text-center">
                   <button onClick={() => markDepleted(item)} className="px-3 py-1 text-xs bg-red-100 text-red-700 rounded hover:bg-red-200 transition-colors">
                     {t('iu.markDepleted')}
                   </button>
                 </td>
               </tr>
             ))}
           </tbody>
         </table>
       </div>
      }
    </div>
  );
}

// ============================================================
// SINGLE ITEM USAGE PAGE
// ============================================================
function SingleItemUsagePage() {
  const { t } = useTranslation();
  const { selectedOrg, showNotification } = useApp();
  const [records, setRecords] = useState([]);
  const [loading, setLoading] = useState(true);
  const [items, setItems] = useState([]);
  const [warehouses, setWarehouses] = useState([]);
  const [departments, setDepartments] = useState([]);
  const [showModal, setShowModal] = useState(false);
  const [search, setSearch] = useState('');
  const [form, setForm] = useState({ usage_date: new Date().toISOString().split('T')[0], item_id: '', warehouse_id: '', department_id: '', quantity: 1, notes: '' });
  const [saving, setSaving] = useState(false);

  useEffect(() => { if (selectedOrg) loadAll(); }, [selectedOrg]);

  async function loadAll() {
    setLoading(true);
    try {
      const [recRes, itemRes, whRes, deptRes] = await Promise.all([
        supabase.from('single_item_usage').select('*, items:item_id(code, name, brand), warehouses:warehouse_id(code, name), departments:department_id(code, name)').eq('organization_id', selectedOrg.id).order('created_at', { ascending: false }),
        supabase.from('items').select('id, code, name, brand').eq('is_active', true).order('name'),
        supabase.from('warehouses').select('id, code, name, warehouse_type').eq('organization_id', selectedOrg.id).eq('is_active', true).order('name'),
        supabase.from('departments').select('id, code, name').eq('is_active', true).order('name'),
      ]);
      setRecords(recRes.data || []);
      setItems(itemRes.data || []);
      setWarehouses((whRes.data || []).filter(w => w.warehouse_type !== 'damage'));
      setDepartments(deptRes.data || []);
    } catch (e) { console.error(e); }
    setLoading(false);
  }

  async function generateNumber() {
    const { count } = await supabase.from('single_item_usage').select('*', { count: 'exact', head: true }).eq('organization_id', selectedOrg.id);
    const seq = String((count || 0) + 1).padStart(4, '0');
    return `SIU-${selectedOrg.code}-${seq}`;
  }

  function openCreate() {
    setForm({ usage_date: new Date().toISOString().split('T')[0], item_id: '', warehouse_id: '', department_id: '', quantity: 1, notes: '' });
    setShowModal(true);
  }

  async function handleConfirm() {
    if (!form.item_id) return showNotification(t('siu.itemRequired'), 'error');
    if (!form.warehouse_id) return showNotification(t('siu.warehouseRequired'), 'error');
    if (!form.department_id) return showNotification(t('siu.departmentRequired'), 'error');
    if (parseFloat(form.quantity) <= 0 || parseFloat(form.quantity) > 1) return showNotification(t('siu.qtyMax1'), 'error');

    if (!confirm(t('siu.confirmMsg'))) return;
    setSaving(true);
    try {
      // Validate usage date
      const inputDate = new Date(form.usage_date);
      const today = new Date();
      const maxBackdateDays = selectedOrg.max_backdate_days || 3;
      const daysDiff = Math.floor((today - inputDate) / (1000 * 60 * 60 * 24));
      if (daysDiff > maxBackdateDays) {
        showNotification('Usage date exceeds maximum backdate limit (' + maxBackdateDays + ' days)', 'error');
        setSaving(false);
        return;
      }

      // Check if period is locked
      const periodMonth = inputDate.getMonth() + 1;
      const periodYear = inputDate.getFullYear();
      const { data: locks } = await supabase.from('period_locks')
        .select('*')
        .eq('organization_id', selectedOrg.id)
        .eq('period_month', periodMonth)
        .eq('period_year', periodYear)
        .eq('is_locked', true)
        .single();
      if (locks) {
        showNotification('Period is locked', 'error');
        setSaving(false);
        return;
      }

      // Check stock
      const { data: stockData } = await supabase.from('stock_balance').select('quantity').eq('item_id', form.item_id).eq('warehouse_id', form.warehouse_id).single();
      if (!stockData || stockData.quantity < parseFloat(form.quantity)) {
        showNotification(t('siu.noStock'), 'error');
        setSaving(false);
        return;
      }

      const usageNumber = await generateNumber();
      const qty = parseFloat(form.quantity);

      // Insert usage record
      const { data: usage, error: usageErr } = await supabase.from('single_item_usage').insert({
        organization_id: selectedOrg.id,
        usage_number: usageNumber,
        usage_date: form.usage_date,
        item_id: form.item_id,
        quantity: qty,
        warehouse_id: form.warehouse_id,
        department_id: form.department_id,
        notes: form.notes || null,
        created_by: 'system',
      }).select().single();
      if (usageErr) throw usageErr;

      // Stock movement OUT
      await supabase.from('stock_movements').insert({
        organization_id: selectedOrg.id,
        item_id: form.item_id,
        warehouse_id: form.warehouse_id,
        movement_type: 'OUT',
        quantity: qty,
        reference_type: 'USAGE',
        reference_id: usage.id,
        notes: `Single usage: ${usageNumber} - Dept: ${departments.find(d => d.id === form.department_id)?.name || ''}`,
        created_by: 'system',
      });

      // Update stock balance
      const newQty = stockData.quantity - qty;
      await supabase.from('stock_balance').update({ quantity: newQty, updated_at: new Date().toISOString() }).eq('item_id', form.item_id).eq('warehouse_id', form.warehouse_id);

      showNotification(t('siu.successConfirm'), 'success');
      setShowModal(false);
      loadAll();
    } catch (e) {
      console.error(e);
      showNotification(t('siu.errorSave') + ': ' + e.message, 'error');
    }
    setSaving(false);
  }

  const filtered = records.filter(r => {
    const txt = search.toLowerCase();
    return !txt || r.usage_number?.toLowerCase().includes(txt) || r.items?.name?.toLowerCase().includes(txt) || r.departments?.name?.toLowerCase().includes(txt);
  });

  return (
    <div className="fade-in">
      <PageHeader title={t('siu.title')} subtitle={`${t('siu.subtitle')} ${selectedOrg?.name || ''}`} actions={
        <Button onClick={openCreate}><Icons.Plus /> {t('siu.create')}</Button>
      } />

      <div className="mb-4">
        <Input placeholder={t('siu.searchPlaceholder')} value={search} onChange={e => setSearch(e.target.value)} />
      </div>

      {loading ? <div className="flex justify-center py-12"><div className="spinner"></div></div> :
       filtered.length === 0 ? <div className="text-center py-12 text-gray-500">{t('siu.empty')}</div> :
       <div className="bg-white rounded-lg shadow overflow-hidden">
         <table className="min-w-full divide-y divide-gray-200">
           <thead className="bg-gray-50">
             <tr>
               <th className="px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase">{t('siu.number')}</th>
               <th className="px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase">{t('siu.date')}</th>
               <th className="px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase">{t('siu.item')}</th>
               <th className="px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase">{t('siu.qty')}</th>
               <th className="px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase">{t('siu.warehouse')}</th>
               <th className="px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase">{t('siu.department')}</th>
               <th className="px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase">{t('siu.notes')}</th>
             </tr>
           </thead>
           <tbody className="divide-y divide-gray-200">
             {filtered.map(r => (
               <tr key={r.id} className="hover:bg-gray-50">
                 <td className="px-4 py-3 text-sm font-medium text-blue-600">{r.usage_number}</td>
                 <td className="px-4 py-3 text-sm text-gray-600">{r.usage_date}</td>
                 <td className="px-4 py-3 text-sm">{r.items?.name} {r.items?.brand ? `(${r.items.brand})` : ''}</td>
                 <td className="px-4 py-3 text-sm">{r.quantity}</td>
                 <td className="px-4 py-3 text-sm">{r.warehouses?.name || '-'}</td>
                 <td className="px-4 py-3 text-sm">{r.departments?.name || '-'}</td>
                 <td className="px-4 py-3 text-sm text-gray-500">{r.notes || '-'}</td>
               </tr>
             ))}
           </tbody>
         </table>
       </div>
      }

      <Modal open={showModal} onClose={() => setShowModal(false)} title={t('siu.create')} size="md">
        <div className="space-y-4">
          <FormField label={t('siu.date')} required>
            <Input type="date" value={form.usage_date} onChange={e => setForm({...form, usage_date: e.target.value})} />
          </FormField>
          <FormField label={t('siu.department')} required>
            <Select value={form.department_id} onChange={e => setForm({...form, department_id: e.target.value})}>
              <option value="">{t('siu.selectDepartment')}</option>
              {departments.map(d => <option key={d.id} value={d.id}>{d.code} - {d.name}</option>)}
            </Select>
          </FormField>
          <FormField label={t('siu.warehouse')} required>
            <Select value={form.warehouse_id} onChange={e => setForm({...form, warehouse_id: e.target.value})}>
              <option value="">{t('siu.selectWarehouse')}</option>
              {warehouses.map(w => <option key={w.id} value={w.id}>{w.code} - {w.name}</option>)}
            </Select>
          </FormField>
          <FormField label={t('siu.item')} required>
            <Select value={form.item_id} onChange={e => setForm({...form, item_id: e.target.value})}>
              <option value="">{t('siu.selectItem')}</option>
              {items.map(i => <option key={i.id} value={i.id}>{i.code} - {i.name} {i.brand ? `(${i.brand})` : ''}</option>)}
            </Select>
          </FormField>
          <FormField label={`${t('siu.qty')} (max: 1)`} required>
            <Input type="number" min="0.01" max="1" step="0.01" value={form.quantity} onChange={e => setForm({...form, quantity: Math.min(1, Math.max(0, parseFloat(e.target.value) || 0))})} />
          </FormField>
          <FormField label={t('siu.notes')}>
            <Input value={form.notes} onChange={e => setForm({...form, notes: e.target.value})} placeholder={t('siu.notes')} />
          </FormField>
          <div className="flex justify-end gap-2 pt-4 border-t">
            <Button variant="secondary" onClick={() => setShowModal(false)}>{t('common.cancel')}</Button>
            <Button onClick={handleConfirm} disabled={saving}>{saving ? t('common.saving') : t('siu.confirm')}</Button>
          </div>
        </div>
      </Modal>
    </div>
  );
}

// ============================================================
// TRANSFER PAGE
// ============================================================
function TransferPage() {
  const { t } = useTranslation();
  const { selectedOrg, showNotification } = useApp();
  const [transfers, setTransfers] = useState([]);
  const [loading, setLoading] = useState(true);
  const [warehouses, setWarehouses] = useState([]);
  const [items, setItems] = useState([]);
  const [showModal, setShowModal] = useState(false);
  const [viewing, setViewing] = useState(null);
  const [saving, setSaving] = useState(false);
  const [search, setSearch] = useState('');
  const [filterStatus, setFilterStatus] = useState('');

  // Form state
  const [fromWarehouse, setFromWarehouse] = useState('');
  const [toWarehouse, setToWarehouse] = useState('');
  const [transferDate, setTransferDate] = useState(new Date().toISOString().split('T')[0]);
  const [transferItems, setTransferItems] = useState([]);
  const [notes, setNotes] = useState('');

  useEffect(() => { if (selectedOrg) loadAll(); }, [selectedOrg]);

  async function loadAll() {
    setLoading(true);
    const [trRes, whRes, itemRes] = await Promise.all([
      supabase.from('transfers')
        .select('*, transfer_items(*, items(code, name, brand, units:unit_id(abbreviation)))')
        .eq('organization_id', selectedOrg.id)
        .order('created_at', { ascending: false }),
      supabase.from('warehouses').select('id, code, name').eq('organization_id', selectedOrg.id).eq('is_active', true).order('code'),
      supabase.from('items').select('id, code, name, brand').eq('is_active', true).order('name'),
    ]);
    setTransfers(trRes.data || []);
    setWarehouses(whRes.data || []);
    setItems(itemRes.data || []);
    setLoading(false);
  }

  async function generateNumber() {
    const code = selectedOrg.code || 'ORG';
    const { data } = await supabase.from('transfers').select('transfer_number')
      .eq('organization_id', selectedOrg.id).like('transfer_number', `TR-${code}-%`)
      .order('created_at', { ascending: false }).limit(1);
    let next = 1;
    if (data && data.length > 0) {
      const last = parseInt(data[0].transfer_number.split('-').pop()) || 0;
      next = last + 1;
    }
    return `TR-${code}-${String(next).padStart(4, '0')}`;
  }

  function addItem() {
    setTransferItems(prev => [...prev, { item_id: '', quantity: 0, notes: '' }]);
  }

  function removeItem(idx) {
    setTransferItems(prev => prev.filter((_, i) => i !== idx));
  }

  function updateTransferItem(idx, field, value) {
    setTransferItems(prev => prev.map((item, i) => i === idx ? { ...item, [field]: value } : item));
  }

  function openNew() {
    setViewing(null);
    setFromWarehouse('');
    setToWarehouse('');
    setTransferDate(new Date().toISOString().split('T')[0]);
    setTransferItems([{ item_id: '', quantity: 0, notes: '' }]);
    setNotes('');
    setShowModal(true);
  }

  function openView(tr) {
    setViewing(tr);
    setShowModal(true);
  }

  async function handleSave() {
    if (!fromWarehouse || !toWarehouse) {
      showNotification(t('transfer.selectWarehouses'), 'error'); return;
    }
    if (fromWarehouse === toWarehouse) {
      showNotification(t('transfer.sameWarehouse'), 'error'); return;
    }
    const validItems = transferItems.filter(i => i.item_id && parseFloat(i.quantity) > 0);
    if (validItems.length === 0) {
      showNotification(t('transfer.addItems'), 'error'); return;
    }
    setSaving(true);
    try {
      // Validate transfer date
      const inputDate = new Date(transferDate);
      const today = new Date();
      const maxBackdateDays = selectedOrg.max_backdate_days || 3;
      const daysDiff = Math.floor((today - inputDate) / (1000 * 60 * 60 * 24));
      if (daysDiff > maxBackdateDays) {
        showNotification('Transfer date exceeds maximum backdate limit (' + maxBackdateDays + ' days)', 'error');
        setSaving(false);
        return;
      }

      // Check if period is locked
      const periodMonth = inputDate.getMonth() + 1;
      const periodYear = inputDate.getFullYear();
      const { data: locks } = await supabase.from('period_locks')
        .select('*')
        .eq('organization_id', selectedOrg.id)
        .eq('period_month', periodMonth)
        .eq('period_year', periodYear)
        .eq('is_locked', true)
        .single();
      if (locks) {
        showNotification('Period is locked', 'error');
        setSaving(false);
        return;
      }

      const trNumber = await generateNumber();
      const { data: tr, error: trErr } = await supabase.from('transfers').insert({
        organization_id: selectedOrg.id,
        transfer_number: trNumber,
        transfer_date: transferDate,
        from_warehouse_id: fromWarehouse,
        to_warehouse_id: toWarehouse,
        status: 'DRAFT',
        notes,
      }).select().single();
      if (trErr) throw trErr;

      const payload = validItems.map(i => ({
        transfer_id: tr.id,
        item_id: i.item_id,
        quantity: parseFloat(i.quantity),
        notes: i.notes,
      }));
      const { error: iErr } = await supabase.from('transfer_items').insert(payload);
      if (iErr) throw iErr;

      showNotification(t('transfer.successSave'));
      setShowModal(false);
      loadAll();
    } catch (err) { showNotification(t('transfer.errorSave') + ': ' + err.message, 'error'); }
    setSaving(false);
  }

  async function confirmTransfer(tr) {
    if (!confirm(t('transfer.confirmMsg'))) return;
    setSaving(true);
    try {
      const trItems = tr.transfer_items || [];
      if (trItems.length === 0) throw new Error('No items');

      for (const item of trItems) {
        const qty = parseFloat(item.quantity);
        if (qty <= 0) continue;

        // Get avg_cost from stock_balance
        const { data: sb } = await supabase.from('stock_balance')
          .select('id, quantity, avg_cost, total_value')
          .eq('organization_id', selectedOrg.id)
          .eq('item_id', item.item_id)
          .maybeSingle();

        const unitCost = sb ? parseFloat(sb.avg_cost) || 0 : 0;
        const totalCost = qty * unitCost;

        // OUT from source warehouse
        const { error: outErr } = await supabase.from('stock_movements').insert({
          organization_id: selectedOrg.id,
          item_id: item.item_id,
          movement_type: 'OUT',
          quantity: qty,
          unit_cost: unitCost,
          total_cost: totalCost,
          reference_type: 'TRANSFER',
          reference_number: tr.transfer_number,
          warehouse_id: tr.from_warehouse_id,
          notes: `Transfer to ${warehouses.find(w => w.id === tr.to_warehouse_id)?.code || 'warehouse'}`,
        });
        if (outErr) throw new Error('OUT movement: ' + outErr.message);

        // IN to destination warehouse
        const { error: inErr } = await supabase.from('stock_movements').insert({
          organization_id: selectedOrg.id,
          item_id: item.item_id,
          movement_type: 'IN',
          quantity: qty,
          unit_cost: unitCost,
          total_cost: totalCost,
          reference_type: 'TRANSFER',
          reference_number: tr.transfer_number,
          warehouse_id: tr.to_warehouse_id,
          notes: `Transfer from ${warehouses.find(w => w.id === tr.from_warehouse_id)?.code || 'warehouse'}`,
        });
        if (inErr) throw new Error('IN movement: ' + inErr.message);

        // Note: stock_balance is per org+item (not per warehouse), so net effect is 0 — no update needed
      }

      await supabase.from('transfers').update({
        status: 'CONFIRMED',
        updated_at: new Date().toISOString(),
      }).eq('id', tr.id);

      showNotification(t('transfer.successConfirm'));
      setShowModal(false);
      loadAll();
    } catch (err) { showNotification('Error: ' + err.message, 'error'); }
    setSaving(false);
  }

  const filtered = transfers.filter(tr => {
    if (filterStatus && tr.status !== filterStatus) return false;
    if (search) {
      const s = search.toLowerCase();
      return tr.transfer_number?.toLowerCase().includes(s);
    }
    return true;
  });

  const isView = !!viewing;
  const isDraft = viewing && viewing.status === 'DRAFT';

  return (
    <div>
      <PageHeader title={t('transfer.title')} subtitle={`${t('transfer.subtitle')} ${selectedOrg?.name}`}
        actions={<Button onClick={openNew}>{t('transfer.newTransfer')}</Button>} />

      <div className="bg-white rounded-xl shadow-sm border border-gray-100">
        <div className="p-4 border-b border-gray-100 flex flex-wrap gap-3 items-center">
          <input type="text" placeholder={t('transfer.searchPlaceholder')} value={search} onChange={e => setSearch(e.target.value)}
            className="w-full sm:w-64 px-4 py-2 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-primary-500" />
          <select value={filterStatus} onChange={e => setFilterStatus(e.target.value)}
            className="px-3 py-2 border border-gray-300 rounded-lg text-sm">
            <option value="">{t('common.all')}</option>
            <option value="DRAFT">{t('status.draft')}</option>
            <option value="CONFIRMED">Confirmed</option>
          </select>
        </div>
        <DataTable loading={loading} columns={[
          { header: t('transfer.number'), render: r => <span className="font-medium text-primary-700">{r.transfer_number}</span> },
          { header: t('common.date'), render: r => new Date(r.transfer_date).toLocaleDateString('id-ID') },
          { header: t('transfer.from'), render: r => <Badge color="red">{warehouses.find(w => w.id === r.from_warehouse_id)?.code || '-'}</Badge> },
          { header: t('transfer.to'), render: r => <Badge color="green">{warehouses.find(w => w.id === r.to_warehouse_id)?.code || '-'}</Badge> },
          { header: t('common.status'), render: r => <StatusBadge status={r.status} /> },
          { header: t('makeup.itemCount'), render: r => r.transfer_items?.length || 0 },
          { header: t('common.actions'), render: r => (
            <div className="flex gap-2">
              <Button size="sm" variant="ghost" onClick={() => openView(r)}>View</Button>
              {r.status === 'DRAFT' && <Button size="sm" variant="primary" onClick={() => confirmTransfer(r)} disabled={saving}>{t('transfer.confirm')}</Button>}
            </div>
          )},
        ]} data={filtered} />
      </div>

      <Modal open={showModal} onClose={() => setShowModal(false)} title={isView ? viewing.transfer_number : t('transfer.newTransfer')} size="xl">
        {!isView ? (
          <>
            <div className="grid grid-cols-1 sm:grid-cols-3 gap-4 mb-6">
              <FormField label={t('transfer.from')} required>
                <Select value={fromWarehouse} onChange={e => setFromWarehouse(e.target.value)}>
                  <option value="">{t('transfer.selectWarehouse')}</option>
                  {warehouses.map(w => <option key={w.id} value={w.id}>{w.code} - {w.name}</option>)}
                </Select>
              </FormField>
              <FormField label={t('transfer.to')} required>
                <Select value={toWarehouse} onChange={e => setToWarehouse(e.target.value)}>
                  <option value="">{t('transfer.selectWarehouse')}</option>
                  {warehouses.filter(w => w.id !== fromWarehouse).map(w => <option key={w.id} value={w.id}>{w.code} - {w.name}</option>)}
                </Select>
              </FormField>
              <FormField label={t('common.date')} required>
                <Input type="date" value={transferDate} onChange={e => setTransferDate(e.target.value)} />
              </FormField>
            </div>

            <div className="mb-4 flex items-center justify-between">
              <h4 className="text-sm font-semibold text-gray-700">{t('transfer.items')}</h4>
              <Button size="sm" variant="secondary" onClick={addItem}>+ {t('transfer.addItem')}</Button>
            </div>
            <div className="overflow-x-auto border border-gray-200 rounded-lg mb-4">
              <table className="w-full text-sm">
                <thead className="bg-gray-50">
                  <tr>
                    <th className="text-left px-3 py-2 font-medium text-gray-600">{t('dashboard.item')}</th>
                    <th className="text-center px-3 py-2 font-medium text-gray-600 w-28">{t('dashboard.qty')}</th>
                    <th className="text-center px-3 py-2 font-medium text-gray-600 w-16"></th>
                  </tr>
                </thead>
                <tbody>
                  {transferItems.map((ti, idx) => (
                    <tr key={idx} className="border-t border-gray-100">
                      <td className="px-3 py-2">
                        <select value={ti.item_id} onChange={e => updateTransferItem(idx, 'item_id', e.target.value)}
                          className="w-full border border-gray-300 rounded px-2 py-1 text-sm">
                          <option value="">{t('transfer.selectItem')}</option>
                          {items.map(it => <option key={it.id} value={it.id}>{it.code} - {it.name}{it.brand ? ` (${it.brand})` : ''}</option>)}
                        </select>
                      </td>
                      <td className="px-3 py-2 text-center">
                        <input type="number" value={ti.quantity} min="0" onChange={e => updateTransferItem(idx, 'quantity', e.target.value)}
                          className="w-24 border border-gray-300 rounded px-2 py-1 text-sm text-center" />
                      </td>
                      <td className="px-3 py-2 text-center">
                        <button onClick={() => removeItem(idx)} className="text-red-500 hover:text-red-700 text-xs">✕</button>
                      </td>
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>

            <FormField label={t('transfer.notes')}>
              <textarea value={notes} onChange={e => setNotes(e.target.value)} rows={2}
                className="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm" />
            </FormField>
          </>
        ) : (
          <>
            <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4 mb-6 bg-gray-50 rounded-lg p-4">
              <div><p className="text-xs text-gray-500">{t('common.date')}</p><p className="font-medium">{new Date(viewing.transfer_date).toLocaleDateString('id-ID')}</p></div>
              <div><p className="text-xs text-gray-500">{t('transfer.from')}</p><Badge color="red">{warehouses.find(w => w.id === viewing.from_warehouse_id)?.code}</Badge></div>
              <div><p className="text-xs text-gray-500">{t('transfer.to')}</p><Badge color="green">{warehouses.find(w => w.id === viewing.to_warehouse_id)?.code}</Badge></div>
              <div><p className="text-xs text-gray-500">{t('common.status')}</p><StatusBadge status={viewing.status} /></div>
            </div>
            <div className="overflow-x-auto border border-gray-200 rounded-lg mb-4">
              <table className="w-full text-sm">
                <thead className="bg-gray-50">
                  <tr>
                    <th className="text-left px-3 py-2 font-medium text-gray-600">{t('dashboard.item')}</th>
                    <th className="text-center px-3 py-2 font-medium text-gray-600">{t('dashboard.qty')}</th>
                  </tr>
                </thead>
                <tbody>
                  {(viewing.transfer_items || []).map((ti, idx) => (
                    <tr key={idx} className="border-t border-gray-100">
                      <td className="px-3 py-2">
                        <span className="font-medium">{ti.items?.name}</span>
                        {ti.items?.brand && <span className="text-xs text-gray-400 ml-1">({ti.items.brand})</span>}
                        <br/><span className="text-xs text-gray-400">{ti.items?.code}</span>
                      </td>
                      <td className="px-3 py-2 text-center font-semibold">{formatNumber(ti.quantity)} {ti.items?.units?.abbreviation}</td>
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>
            {viewing.notes && <div className="bg-gray-50 rounded-lg p-3 mb-4"><p className="text-xs text-gray-500 mb-1">{t('transfer.notes')}</p><p className="text-sm">{viewing.notes}</p></div>}
          </>
        )}

        <div className="flex justify-end gap-3 mt-4 pt-4 border-t border-gray-200">
          <Button variant="secondary" onClick={() => setShowModal(false)}>{isView ? t('common.close') : t('common.cancel')}</Button>
          {!isView && <Button onClick={handleSave} disabled={saving}>{saving ? 'Saving...' : t('transfer.saveDraft')}</Button>}
          {isDraft && <Button variant="primary" onClick={() => confirmTransfer(viewing)} disabled={saving}>{t('transfer.confirm')}</Button>}
        </div>
      </Modal>
    </div>
  );
}

// ============================================================
// RENDER
// ============================================================
const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<LanguageProvider><App /></LanguageProvider>);
  </script>
</body>
</html>
