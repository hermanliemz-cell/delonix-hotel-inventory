// Category config: which status fields each category type needs
const CATEGORY_STATUS_CONFIG = {
  LIN: {
    statuses: ['in_stock', 'in_use', 'dirty', 'in_laundry', 'damaged'],
    labels: { in_stock: 'ob.inStock', in_use: 'ob.inUse', dirty: 'ob.dirty', in_laundry: 'ob.inLaundry', damaged: 'ob.damaged' }
  },
  FA: {
    statuses: ['good', 'fair', 'poor', 'damaged'],
    labels: { good: 'ob.good', fair: 'ob.fair', poor: 'ob.poor', damaged: 'ob.damaged' }
  },
  MCH: {
    statuses: ['operational', 'maintenance', 'broken'],
    labels: { operational: 'ob.operational', maintenance: 'ob.maintenance', broken: 'ob.broken' }
  },
  DEFAULT: {
    statuses: ['on_hand'],
    labels: { on_hand: 'ob.qtyOnHand' }
  }
};

function getCategoryConfig(categoryCode) {
  return CATEGORY_STATUS_CONFIG[categoryCode] || CATEGORY_STATUS_CONFIG.DEFAULT;
}

function OpeningBalancePage() {
  const { t } = useTranslation();
  const { selectedOrg, showNotification } = useApp();
  const [selectedCategory, setSelectedCategory] = useState(null);
  const [categories, setCategories] = useState([]);
  const [items, setItems] = useState([]);
  const [units, setUnits] = useState([]);
  const [locks, setLocks] = useState({});
  const [details, setDetails] = useState({});
  const [loading, setLoading] = useState(true);
  const [saving, setSaving] = useState(false);
  const [search, setSearch] = useState('');
  const [defaultDepartment, setDefaultDepartment] = useState(null);

  useEffect(() => {
    if (selectedOrg) loadOverview();
  }, [selectedOrg]);

  // Load category overview data
  async function loadOverview() {
    setLoading(true);
    try {
      const [catsRes, itemsRes, locksRes, detailsRes, deptRes, unitsRes] = await Promise.all([
        supabase.from('item_categories').select('*').order('name'),
        supabase.from('items').select('*').eq('is_active', true).order('code'),
        supabase.from('opening_balance_locks').select('*').eq('organization_id', selectedOrg.id),
        supabase.from('opening_balance_details').select('*').eq('organization_id', selectedOrg.id),
        supabase.from('departments').select('*').eq('organization_id', selectedOrg.id).order('name'),
        supabase.from('units').select('*').order('name')
      ]);
      setCategories(catsRes.data || []);
      setItems(itemsRes.data || []);
      setUnits(unitsRes.data || []);
      const depts = deptRes.data || [];
      setDefaultDepartment(depts.find(d => d.name === 'General Store') || depts[0]);

      // Map locks by category_id
      const lockMap = {};
      (locksRes.data || []).forEach(l => { lockMap[l.category_id] = l; });
      setLocks(lockMap);

      // Map details by item_id+status_type and reconstruct purchase_cost
      const itemMap = {};
      (itemsRes.data || []).forEach(i => { itemMap[i.id] = i; });
      const detMap = {};
      (detailsRes.data || []).forEach(d => {
        if (!detMap[d.item_id]) detMap[d.item_id] = {};
        detMap[d.item_id][d.status_type] = { quantity: d.quantity || 0, unit_cost: d.unit_cost || 0 };
        // Reconstruct purchase_cost from unit_cost * conversion_rate
        if ((d.unit_cost || 0) > 0 && !detMap[d.item_id]._purchase_cost) {
          const convRate = parseFloat(itemMap[d.item_id]?.conversion_rate) || 1;
          detMap[d.item_id]._purchase_cost = Math.round((d.unit_cost || 0) * convRate);
        }
      });
      setDetails(detMap);
    } catch (err) {
      console.error('Error loading opening balance:', err);
    }
    setLoading(false);
  }

  function getItemsForCategory(catId) {
    return items.filter(i => i.category_id === catId);
  }

  function getCategoryStats(cat) {
    const catItems = getItemsForCategory(cat.id);
    const lock = locks[cat.id];
    const counted = catItems.filter(i => {
      const d = details[i.id];
      if (!d) return false;
      return Object.values(d).some(v => v.quantity > 0);
    }).length;
    const totalValue = catItems.reduce((sum, i) => {
      const d = details[i.id];
      if (!d) return sum;
      const convRate = parseFloat(i.conversion_rate) || 1;
      const purchaseCost = parseFloat(d._purchase_cost) || 0;
      const costPerUsage = convRate > 0 ? purchaseCost / convRate : 0;
      const qty = Object.entries(d).filter(([k]) => k !== '_purchase_cost').reduce((s, [, v]) => s + (parseFloat(v.quantity) || 0), 0);
      return sum + (qty * costPerUsage);
    }, 0);
    const status = lock?.is_locked ? 'locked' : counted > 0 ? 'in_progress' : 'draft';
    return { total: catItems.length, counted, totalValue, status, lock };
  }

  function getUnitName(unitId) {
    const unit = units.find(u => u.id === unitId);
    return unit ? unit.abbreviation || unit.name : '-';
  }

  // ---- CATEGORY DETAIL (OPNAME) VIEW ----
  function updateDetail(itemId, statusType, field, value) {
    setDetails(prev => ({
      ...prev,
      [itemId]: {
        ...(prev[itemId] || {}),
        [statusType]: {
          ...(prev[itemId]?.[statusType] || { quantity: 0, unit_cost: 0 }),
          [field]: value
        }
      }
    }));
  }

  async function handleSaveCategory() {
    if (!selectedCategory || !defaultDepartment) return;
    setSaving(true);
    try {
      const catItems = getItemsForCategory(selectedCategory.id);
      const config = getCategoryConfig(selectedCategory.code);
      const detailUpserts = [];
      const balanceUpserts = [];
      const fifoEntries = [];

      for (const item of catItems) {
        const itemDetails = details[item.id] || {};
        let totalQty = 0;

        // Calculate cost per usage unit from purchase cost / conversion
        const convRate = parseFloat(item.conversion_rate) || 1;
        const purchaseCost = parseFloat(itemDetails._purchase_cost) || 0;
        const unitCost = convRate > 0 ? purchaseCost / convRate : 0;

        for (const st of config.statuses) {
          const d = itemDetails[st] || { quantity: 0, unit_cost: 0 };
          const qty = parseFloat(d.quantity) || 0;
          totalQty += qty;

          if (qty > 0 || unitCost > 0) {
            detailUpserts.push({
              organization_id: selectedOrg.id,
              item_id: item.id,
              status_type: st,
              quantity: qty,
              unit_cost: unitCost,
              updated_at: new Date().toISOString()
            });
          }
        }

        if (totalQty > 0) {
          const totalValue = totalQty * unitCost;
          balanceUpserts.push({
            organization_id: selectedOrg.id,
            department_id: defaultDepartment.id,
            item_id: item.id,
            quantity: totalQty,
            avg_cost: unitCost,
            total_value: totalValue,
            last_updated: new Date().toISOString()
          });
          fifoEntries.push({
            organization_id: selectedOrg.id,
            department_id: defaultDepartment.id,
            item_id: item.id,
            reference_type: 'OPENING_BALANCE',
            reference_id: selectedOrg.id,
            quantity_received: totalQty,
            quantity_remaining: totalQty,
            unit_cost: unitCost,
            received_date: new Date().toISOString()
          });
        }
      }

      // Upsert details
      if (detailUpserts.length > 0) {
        const { error } = await supabase.from('opening_balance_details')
          .upsert(detailUpserts, { onConflict: 'organization_id,item_id,status_type' });
        if (error) throw error;
      }

      // Upsert stock_balance
      if (balanceUpserts.length > 0) {
        const { error } = await supabase.from('stock_balance')
          .upsert(balanceUpserts, { onConflict: 'organization_id,item_id' });
        if (error) throw error;
      }

      // Delete old FIFO entries for these items then re-insert
      const itemIds = fifoEntries.map(f => f.item_id);
      if (itemIds.length > 0) {
        await supabase.from('stock_fifo_queue')
          .delete()
          .eq('organization_id', selectedOrg.id)
          .eq('reference_type', 'OPENING_BALANCE')
          .in('item_id', itemIds);
        const { error: fifoErr } = await supabase.from('stock_fifo_queue').insert(fifoEntries);
        if (fifoErr) console.warn('FIFO warning:', fifoErr.message);
      }

      // Update lock record (items_counted, total_value)
      const counted = catItems.filter(i => {
        const d = details[i.id];
        return d && Object.values(d).some(v => (parseFloat(v.quantity) || 0) > 0);
      }).length;
      const totalVal = balanceUpserts.reduce((s, b) => s + b.total_value, 0);

      await supabase.from('opening_balance_locks').upsert({
        organization_id: selectedOrg.id,
        category_id: selectedCategory.id,
        items_counted: counted,
        total_items: catItems.length,
        total_value: totalVal,
        updated_at: new Date().toISOString()
      }, { onConflict: 'organization_id,category_id' });

      showNotification(t('ob.successSave'));
      await loadOverview();
    } catch (err) {
      showNotification(t('ob.errorSave') + ': ' + err.message, 'error');
      console.error(err);
    }
    setSaving(false);
  }

  async function handleLockCategory() {
    if (!selectedCategory) return;
    if (!confirm(t('ob.lockConfirm'))) return;
    try {
      await supabase.from('opening_balance_locks').upsert({
        organization_id: selectedOrg.id,
        category_id: selectedCategory.id,
        is_locked: true,
        locked_at: new Date().toISOString(),
        updated_at: new Date().toISOString()
      }, { onConflict: 'organization_id,category_id' });
      showNotification(t('ob.locked'));
      await loadOverview();
    } catch (err) {
      showNotification('Error: ' + err.message, 'error');
    }
  }

  // ---- RENDER ----
  if (loading) return <div className="p-12 flex justify-center"><div className="spinner"></div></div>;

  // LEVEL 2: Category detail (opname form)
  if (selectedCategory) {
    const catItems = getItemsForCategory(selectedCategory.id);
    const config = getCategoryConfig(selectedCategory.code);
    const isMultiStatus = config.statuses.length > 1;
    const lock = locks[selectedCategory.id];
    const isLocked = lock?.is_locked || false;

    const filteredItems = catItems.filter(item =>
      !search || item.name.toLowerCase().includes(search.toLowerCase()) || item.code.toLowerCase().includes(search.toLowerCase())
    );

    const catTotalValue = catItems.reduce((sum, i) => {
      const d = details[i.id] || {};
      const convRate = parseFloat(i.conversion_rate) || 1;
      const purchaseCost = parseFloat(d._purchase_cost) || 0;
      const costPerUsage = convRate > 0 ? purchaseCost / convRate : 0;
      const qty = Object.entries(d).filter(([k]) => k !== '_purchase_cost').reduce((s, [, v]) => s + (parseFloat(v.quantity) || 0), 0);
      return sum + (qty * costPerUsage);
    }, 0);
    const catCounted = catItems.filter(i => {
      const d = details[i.id];
      return d && Object.values(d).some(v => (parseFloat(v.quantity) || 0) > 0);
    }).length;

    return (
      <div>
        <PageHeader
          title={selectedCategory.name}
          subtitle={`${t('ob.title')} — ${catItems.length} ${t('ob.items')}`}
          actions={
            <div className="flex items-center gap-2">
              <Button variant="secondary" onClick={() => { setSelectedCategory(null); setSearch(''); }}>
                <Icons.ArrowLeft /> {t('ob.backToCategories')}
              </Button>
              {isLocked ? (
                <span className="flex items-center gap-1 px-3 py-2 bg-red-50 text-red-700 rounded-lg text-sm font-medium">
                  <Icons.Lock /> {t('ob.lockedStatus')}
                </span>
              ) : (
                <>
                  <Button variant="secondary" onClick={handleLockCategory} disabled={catCounted === 0}>
                    <Icons.Lock /> {t('ob.lockBtn')}
                  </Button>
                  <Button onClick={handleSaveCategory} disabled={saving}>
                    {saving ? t('ob.saving') : t('ob.save')}
                  </Button>
                </>
              )}
            </div>
          }
        />

        {/* Summary */}
        <div className="grid grid-cols-1 md:grid-cols-3 gap-4 mb-6">
          <StatCard title={t('ob.totalItems')} value={catItems.length} icon={Icons.Package} color="blue" />
          <StatCard title={t('ob.itemsCounted')} value={catCounted} icon={Icons.Check} color="green" />
          <StatCard title={t('ob.totalStockValue')} value={`Rp ${catTotalValue.toLocaleString('id-ID')}`} icon={Icons.Database} color="purple" />
        </div>

        {/* Lock Warning */}
        {!isLocked && catCounted > 0 && (
          <div className="mb-4 p-3 bg-amber-50 border border-amber-200 rounded-lg flex items-start gap-2">
            <Icons.AlertTriangle className="w-5 h-5 text-amber-600 mt-0.5 flex-shrink-0" />
            <p className="text-sm text-amber-700">{t('ob.lockWarning')}</p>
          </div>
        )}

        {/* Search */}
        <div className="bg-white rounded-xl shadow-sm border border-gray-100 mb-4">
          <div className="p-4">
            <div className="relative">
              <Icons.Search className="absolute left-3 top-1/2 -translate-y-1/2 text-gray-400" />
              <input type="text" value={search} onChange={e => setSearch(e.target.value)}
                placeholder={t('ob.searchPlaceholder')}
                className="w-full pl-10 pr-4 py-2 border border-gray-200 rounded-lg text-sm focus:ring-2 focus:ring-primary-500 focus:border-transparent" />
            </div>
          </div>
        </div>

        {/* Items Table */}
        <div className="bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden">
          {catItems.length === 0 ? (
            <div className="p-12 text-center text-gray-500">{t('ob.noItems')}</div>
          ) : (
            <div className="overflow-x-auto">
              <table className="w-full">
                <thead>
                  <tr className="bg-gray-50 border-b border-gray-100">
                    <th className="text-left text-xs font-medium text-gray-500 uppercase tracking-wider px-4 py-3 w-24">{t('ob.itemCode')}</th>
                    <th className="text-left text-xs font-medium text-gray-500 uppercase tracking-wider px-4 py-3">{t('ob.itemName')}</th>
                    {config.statuses.map(st => (
                      <th key={st} className="text-center text-xs font-medium text-gray-500 uppercase tracking-wider px-2 py-3 w-24">
                        {t(config.labels[st])}
                      </th>
                    ))}
                    {isMultiStatus && (
                      <th className="text-center text-xs font-medium text-gray-500 uppercase tracking-wider px-2 py-3 w-20 bg-blue-50">{t('ob.totalPcs')}</th>
                    )}
                    <th className="text-center text-xs font-medium text-gray-500 uppercase tracking-wider px-2 py-3 w-20">Purchase Unit</th>
                    <th className="text-center text-xs font-medium text-gray-500 uppercase tracking-wider px-2 py-3 w-32">Cost/Purchase Unit</th>
                    <th className="text-center text-xs font-medium text-gray-500 uppercase tracking-wider px-2 py-3 w-20">Usage Unit</th>
                    <th className="text-center text-xs font-medium text-gray-500 uppercase tracking-wider px-2 py-3 w-20">Conversion</th>
                    <th className="text-center text-xs font-medium text-gray-500 uppercase tracking-wider px-2 py-3 w-32">Cost/Usage Unit</th>
                    <th className="text-right text-xs font-medium text-gray-500 uppercase tracking-wider px-4 py-3 w-36">{t('ob.totalValue')}</th>
                  </tr>
                </thead>
                <tbody className="divide-y divide-gray-50">
                  {filteredItems.map(item => {
                    const itemD = details[item.id] || {};
                    let totalQty = 0;
                    config.statuses.forEach(st => {
                      const d = itemD[st] || {};
                      totalQty += parseFloat(d.quantity) || 0;
                    });

                    const purchaseUnitName = getUnitName(item.purchase_unit_id || item.unit_id);
                    const usageUnitName = getUnitName(item.usage_unit_id || item.unit_id);
                    const conversionRate = parseFloat(item.conversion_rate) || 1;

                    // Cost per purchase unit is stored in detail as 'purchase_cost'
                    const purchaseCost = parseFloat(itemD._purchase_cost) || 0;
                    const costPerUsage = conversionRate > 0 ? purchaseCost / conversionRate : 0;
                    const totalValue = totalQty * costPerUsage;
                    const hasData = totalQty > 0;

                    return (
                      <tr key={item.id} className={`hover:bg-gray-50 transition-colors ${hasData ? 'bg-green-50/30' : ''}`}>
                        <td className="px-4 py-2">
                          <span className="font-mono text-xs bg-gray-100 px-2 py-0.5 rounded">{item.code}</span>
                        </td>
                        <td className="px-4 py-2">
                          <span className="font-medium text-sm text-gray-800">{item.name}</span>
                        </td>
                        {config.statuses.map(st => {
                          const d = itemD[st] || {};
                          return (
                            <td key={st} className="px-2 py-2">
                              <input type="number" min="0" step="1"
                                value={d.quantity || ''}
                                onChange={e => updateDetail(item.id, st, 'quantity', e.target.value)}
                                disabled={isLocked} placeholder="0"
                                className={`w-full text-center text-sm border rounded-lg px-1 py-1.5 focus:ring-2 focus:ring-primary-500
                                  ${isLocked ? 'bg-gray-100 cursor-not-allowed' : 'border-gray-200'}
                                  ${(parseFloat(d.quantity) || 0) > 0 ? 'border-green-300 bg-green-50' : ''}`}
                              />
                            </td>
                          );
                        })}
                        {isMultiStatus && (
                          <td className="px-2 py-2 text-center bg-blue-50/50">
                            <span className={`text-sm font-bold ${totalQty > 0 ? 'text-blue-700' : 'text-gray-400'}`}>{totalQty || '-'}</span>
                          </td>
                        )}
                        <td className="px-2 py-2 text-center text-sm text-gray-600">{purchaseUnitName}</td>
                        <td className="px-2 py-2">
                          <input type="number" min="0" step="1"
                            value={purchaseCost || ''}
                            onChange={e => {
                              const val = e.target.value;
                              setDetails(prev => ({
                                ...prev,
                                [item.id]: {
                                  ...(prev[item.id] || {}),
                                  _purchase_cost: val
                                }
                              }));
                              // Auto-calculate and store cost per usage unit in all statuses
                              const cpuu = conversionRate > 0 ? (parseFloat(val) || 0) / conversionRate : 0;
                              config.statuses.forEach(st => updateDetail(item.id, st, 'unit_cost', cpuu));
                            }}
                            disabled={isLocked} placeholder="0"
                            className={`w-full text-center text-sm border rounded-lg px-1 py-1.5 focus:ring-2 focus:ring-primary-500
                              ${isLocked ? 'bg-gray-100 cursor-not-allowed' : 'border-gray-200'}
                              ${purchaseCost > 0 ? 'border-green-300 bg-green-50' : ''}`}
                          />
                        </td>
                        <td className="px-2 py-2 text-center text-sm text-gray-600">{usageUnitName}</td>
                        <td className="px-2 py-2 text-center">
                          <span className="text-sm text-gray-500 bg-gray-100 px-2 py-1 rounded">{conversionRate}</span>
                        </td>
                        <td className="px-2 py-2 text-center">
                          <span className={`text-sm font-medium ${costPerUsage > 0 ? 'text-primary-700' : 'text-gray-400'}`}>
                            {costPerUsage > 0 ? formatCurrency(Math.round(costPerUsage)) : '-'}
                          </span>
                        </td>
                        <td className="px-4 py-2 text-right">
                          <span className={`text-sm font-medium ${totalValue > 0 ? 'text-green-700' : 'text-gray-400'}`}>
                            {totalValue > 0 ? formatCurrency(Math.round(totalValue)) : '-'}
                          </span>
                        </td>
                      </tr>
                    );
                  })}
                </tbody>
                <tfoot>
                  <tr className="bg-gray-50 border-t-2 border-gray-200">
                    <td colSpan={2 + config.statuses.length + (isMultiStatus ? 1 : 0) + 5} className="px-4 py-3 text-right font-semibold text-sm text-gray-700">
                      {t('common.total')}:
                    </td>
                    <td className="px-4 py-3 text-right font-bold text-sm text-green-700">
                      Rp {catTotalValue.toLocaleString('id-ID')}
                    </td>
                  </tr>
                </tfoot>
              </table>
            </div>
          )}
        </div>

        {/* Sticky bottom bar */}
        {!isLocked && catItems.length > 0 && (
          <div className="sticky bottom-0 mt-4 p-4 bg-white border-t border-gray-200 shadow-lg rounded-xl flex items-center justify-between">
            <div className="text-sm text-gray-600">
              {catCounted} / {catItems.length} {t('ob.itemsCounted').toLowerCase()}
              <span className="mx-2">|</span>
              <span className="font-semibold text-green-700">Rp {catTotalValue.toLocaleString('id-ID')}</span>
            </div>
            <Button onClick={handleSaveCategory} disabled={saving}>
              {saving ? t('ob.saving') : t('ob.save')}
            </Button>
          </div>
        )}
      </div>
    );
  }

  // LEVEL 1: Category overview
  const totalCats = categories.filter(c => getItemsForCategory(c.id).length > 0).length;
  const lockedCats = Object.values(locks).filter(l => l.is_locked).length;
  const grandTotal = items.reduce((sum, i) => {
    const d = details[i.id] || {};
    return sum + Object.values(d).reduce((s, v) => s + (parseFloat(v.quantity) || 0) * (parseFloat(v.unit_cost) || 0), 0);
  }, 0);

  return (
    <div>
      <PageHeader title={t('ob.title')} subtitle={t('ob.subtitle')} />

      {/* Summary */}
      <div className="grid grid-cols-1 md:grid-cols-3 gap-4 mb-6">
        <StatCard title={t('ob.allCategories')} value={`${lockedCats} / ${totalCats}`} icon={Icons.Check} color="blue" />
        <StatCard title={t('ob.categoriesLocked')} value={lockedCats} icon={Icons.Lock} color="green" />
        <StatCard title={t('ob.totalStockValue')} value={`Rp ${grandTotal.toLocaleString('id-ID')}`} icon={Icons.Database} color="purple" />
      </div>

      <p className="text-sm text-gray-500 mb-4">{t('ob.selectCategory')}</p>

      {/* Category Cards */}
      <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
        {categories.map(cat => {
          const stats = getCategoryStats(cat);
          if (stats.total === 0) return null; // Skip empty categories
          const config = getCategoryConfig(cat.code);
          const isMulti = config.statuses.length > 1;

          const statusColor = stats.status === 'locked' ? 'bg-green-100 text-green-800' :
            stats.status === 'in_progress' ? 'bg-amber-100 text-amber-800' : 'bg-gray-100 text-gray-600';
          const statusLabel = stats.status === 'locked' ? t('ob.locked') :
            stats.status === 'in_progress' ? `${stats.counted}/${stats.total}` : t('ob.draft');
          const borderColor = stats.status === 'locked' ? 'border-green-200' :
            stats.status === 'in_progress' ? 'border-amber-200' : 'border-gray-100';

          return (
            <div key={cat.id} className={`bg-white rounded-xl shadow-sm border-2 ${borderColor} p-5 hover:shadow-md transition-all cursor-pointer group`}
              onClick={() => setSelectedCategory(cat)}>
              <div className="flex items-start justify-between mb-3">
                <div>
                  <h3 className="font-semibold text-gray-900 group-hover:text-primary-600 transition-colors">{cat.name}</h3>
                  <p className="text-xs text-gray-500 mt-0.5">{cat.code} — {stats.total} {t('ob.items')}</p>
                </div>
                <span className={`text-xs font-medium px-2 py-1 rounded-full ${statusColor}`}>
                  {stats.status === 'locked' && <span className="mr-1">&#x1f512;</span>}
                  {statusLabel}
                </span>
              </div>

              {/* Progress bar */}
              <div className="w-full bg-gray-100 rounded-full h-2 mb-3">
                <div className={`h-2 rounded-full transition-all ${stats.status === 'locked' ? 'bg-green-500' : 'bg-primary-500'}`}
                  style={{ width: `${stats.total > 0 ? (stats.counted / stats.total) * 100 : 0}%` }} />
              </div>

              <div className="flex items-center justify-between">
                <span className="text-xs text-gray-500">
                  {stats.totalValue > 0 ? `Rp ${stats.totalValue.toLocaleString('id-ID')}` : '-'}
                </span>
                {isMulti && (
                  <span className="text-xs bg-blue-50 text-blue-600 px-2 py-0.5 rounded-full">
                    {config.statuses.length} status
                  </span>
                )}
                <span className="text-xs font-medium text-primary-600 group-hover:text-primary-700">
                  {stats.status === 'locked' ? t('ob.view') : stats.status === 'in_progress' ? t('ob.continue') : t('ob.startCounting')} →
                </span>
              </div>
            </div>
          );
        })}
      </div>
    </div>
  );
}

// ============================================================
// ROOM MAKE UP PAGE
// ============================================================
function RoomMakeUpPage() {
  const { t } = useTranslation();
  const { selectedOrg, showNotification, currentUser } = useApp();
  const [makeups, setMakeups] = useState([]);
  const [loading, setLoading] = useState(true);
  const [rooms, setRooms] = useState([]);
  const [warehouses, setWarehouses] = useState([]);
  const [showModal, setShowModal] = useState(false);
  const [viewing, setViewing] = useState(null);
  const [selectedRoom, setSelectedRoom] = useState('');
  const [makeupDate, setMakeupDate] = useState(new Date().toISOString().split('T')[0]);
  const [makeupItems, setMakeupItems] = useState([]);
  const [notes, setNotes] = useState('');
  const [saving, setSaving] = useState(false);
  const [search, setSearch] = useState('');
  const [filterStatus, setFilterStatus] = useState('');
  const [lbItems, setLbItems] = useState([]);
  const [allItems, setAllItems] = useState([]);
  const [activityTemplates, setActivityTemplates] = useState([]);
  const [activityChecks, setActivityChecks] = useState([]);
  const [inuseItems, setInuseItems] = useState([]);
  const [inuseChecks, setInuseChecks] = useState([]);

  useEffect(() => { if (selectedOrg) loadAll(); }, [selectedOrg]);

  async function loadAll() {
    setLoading(true);
    const [muRes, roomRes, whRes, itemRes, atRes] = await Promise.all([
      supabase.from('room_makeups')
        .select('*, rooms!left(room_number, floor), room_makeup_items(*, items(code, name, brand, units:unit_id(abbreviation)))')
        .eq('organization_id', selectedOrg.id)
        .order('created_at', { ascending: false }),
      supabase.from('rooms').select('id, room_number, floor, warehouse_id, room_types(name)')
        .eq('organization_id', selectedOrg.id).order('room_number'),
      supabase.from('warehouses').select('id, code, name, warehouse_type').eq('organization_id', selectedOrg.id).eq('is_active', true).order('code'),
      supabase.from('items').select('id, code, name, brand').eq('is_active', true).order('name'),
      supabase.from('makeup_activity_templates').select('*')
        .eq('organization_id', selectedOrg.id).eq('is_active', true).order('sort_order'),
    ]);
    setMakeups(muRes.data || []);
    setRooms(roomRes.data || []);
    setWarehouses(whRes.data || []);
    setAllItems(itemRes.data || []);
    setActivityTemplates(atRes.data || []);
    // Load in-use warehouse items
    const iuWh = (whRes.data || []).find(w => w.warehouse_type === 'in_use');
    if (iuWh) {
      const { data: sbData } = await supabase.from('stock_balance')
        .select('id, item_id, quantity, items(id, code, name, brand, units:unit_id(abbreviation))')
        .eq('organization_id', selectedOrg.id).eq('warehouse_id', iuWh.id).gt('quantity', 0);
      setInuseItems(sbData || []);
    } else {
      setInuseItems([]);
    }
    setLoading(false);
  }

  async function generateNumber() {
    const code = selectedOrg.code || 'ORG';
    const { data } = await supabase.from('room_makeups').select('makeup_number')
      .eq('organization_id', selectedOrg.id).like('makeup_number', `MU-${code}-%`)
      .order('created_at', { ascending: false }).limit(1);
    let next = 1;
    if (data && data.length > 0) {
      const last = parseInt(data[0].makeup_number.split('-').pop()) || 0;
      next = last + 1;
    }
    return `MU-${code}-${String(next).padStart(4, '0')}`;
  }

  async function handleRoomSelect(roomId) {
    setSelectedRoom(roomId);
    if (!roomId) { setMakeupItems([]); setActivityChecks([]); setInuseChecks([]); return; }
    const room = rooms.find(r => r.id === roomId);
    const { data: riItems } = await supabase.from('room_items')
      .select('*, items(id, code, name, brand, units:unit_id(abbreviation))')
      .eq('room_id', roomId).order('type').order('created_at');
    const mapped = (riItems || []).map(ri => ({
      item_id: ri.item_id,
      items: ri.items,
      type: ri.type,
      default_qty: ri.default_qty || 0,
      actual_qty: ri.default_qty || 0,
      dirty_qty: ri.type === 'replace' ? (ri.default_qty || 0) : 0,
      warehouse_id: room?.warehouse_id || '',
      notes: '',
    }));
    setMakeupItems(mapped);
    // Load per-room activity checklist
    const { data: roomActivities } = await supabase.from('room_activity_checklist')
      .select('*').eq('room_id', roomId).eq('is_active', true).order('sort_order');
    const roomActs = roomActivities || [];
    // Use per-room activities if available, otherwise fall back to org-level templates
    if (roomActs.length > 0) {
      setActivityTemplates(roomActs.map(a => ({ id: a.id, name: a.name, description: a.description, _source: 'room' })));
      setActivityChecks(roomActs.map(a => ({ template_id: a.id, checklist_item_id: a.id, activity_name: a.name, is_checked: false, notes: '', _source: 'room' })));
    } else {
      // Fall back to org-level templates
      const { data: orgTemplates } = await supabase.from('makeup_activity_templates')
        .select('*').eq('organization_id', selectedOrg.id).eq('is_active', true).order('sort_order');
      setActivityTemplates((orgTemplates || []).map(a => ({ ...a, _source: 'template' })));
      setActivityChecks((orgTemplates || []).map(at => ({ template_id: at.id, checklist_item_id: null, activity_name: at.name, is_checked: false, notes: '', _source: 'template' })));
    }
    // Initialize in-use checks (expected qty from stock balance)
    setInuseChecks(inuseItems.map(item => ({ item_id: item.item_id, expected_qty: item.quantity || 0, actual_qty: item.quantity || 0, notes: '' })));
  }

  function updateItem(idx, field, value) {
    setMakeupItems(prev => prev.map((item, i) => {
      if (i !== idx) return item;
      const updated = { ...item, [field]: value };
      if (field === 'actual_qty' && item.type === 'replace') {
        updated.dirty_qty = value;
      }
      return updated;
    }));
  }

  function addLBItem() {
    setLbItems(prev => [...prev, { item_id: '', quantity: 1, reason: 'damaged', source_warehouse_id: '', notes: '' }]);
  }

  function removeLBItem(idx) {
    setLbItems(prev => prev.filter((_, i) => i !== idx));
  }

  function updateLBItem(idx, field, value) {
    setLbItems(prev => prev.map((item, i) => i === idx ? { ...item, [field]: value } : item));
  }

  function openNew() {
    setViewing(null);
    setSelectedRoom('');
    setMakeupDate(new Date().toISOString().split('T')[0]);
    setMakeupItems([]);
    setLbItems([]);
    setActivityChecks([]);
    setInuseChecks([]);
    setNotes('');
    setShowModal(true);
  }

  async function openView(mu) {
    setViewing(mu);
    setSelectedRoom(mu.room_id);
    setMakeupDate(mu.makeup_date);
    setNotes(mu.notes || '');
    const allMuItems = mu.room_makeup_items || [];
    setMakeupItems(allMuItems.filter(mi => mi.type === 'replace' || mi.type === 'refill').map(mi => ({
      item_id: mi.item_id,
      items: mi.items,
      type: mi.type,
      default_qty: mi.default_qty,
      actual_qty: mi.actual_qty,
      dirty_qty: mi.dirty_qty || 0,
      warehouse_id: mi.warehouse_id || '',
      notes: mi.notes || '',
    })));
    setLbItems(allMuItems.filter(mi => mi.type === 'lost_breakage').map(mi => ({
      item_id: mi.item_id,
      items: mi.items,
      quantity: mi.actual_qty,
      reason: mi.notes?.startsWith('Lost') ? 'lost' : 'damaged',
      source_warehouse_id: mi.warehouse_id || '',
      notes: mi.notes || '',
    })));
    // Load activity checks and in-use checks
    const [acRes, iuRes] = await Promise.all([
      supabase.from('makeup_activity_checks').select('*, makeup_activity_templates(name, description), room_activity_checklist(name, description)').eq('room_makeup_id', mu.id),
      supabase.from('makeup_inuse_checks').select('*, items(id, code, name, brand, units:unit_id(abbreviation))').eq('room_makeup_id', mu.id),
    ]);
    const viewChecks = (acRes.data || []).map(ac => ({
      ...ac,
      template_id: ac.template_id || ac.checklist_item_id || ac.id,
    }));
    // Build activity templates from the checks for view mode
    const viewTemplates = viewChecks.map(ac => ({
      id: ac.template_id,
      name: ac.activity_name || ac.makeup_activity_templates?.name || ac.room_activity_checklist?.name || 'Activity',
      description: ac.makeup_activity_templates?.description || ac.room_activity_checklist?.description || '',
    }));
    setActivityTemplates(viewTemplates);
    setActivityChecks(viewChecks);
    setInuseChecks(iuRes.data || []);
    setShowModal(true);
  }

  async function handleSave() {
    if (!selectedRoom || makeupItems.length === 0) {
      showNotification(t('makeup.selectRoom'), 'error'); return;
    }
    setSaving(true);
    try {
      const muNumber = await generateNumber();
      const { data: mu, error: muErr } = await supabase.from('room_makeups').insert({
        organization_id: selectedOrg.id,
        room_id: selectedRoom,
        makeup_number: muNumber,
        makeup_date: makeupDate,
        status: 'DRAFT',
        notes,
      }).select().single();
      if (muErr) throw muErr;

      const itemsPayload = makeupItems.map(mi => ({
        makeup_id: mu.id,
        item_id: mi.item_id,
        type: mi.type,
        default_qty: mi.default_qty,
        actual_qty: parseFloat(mi.actual_qty) || 0,
        dirty_qty: mi.type === 'replace' ? (parseFloat(mi.dirty_qty) || 0) : 0,
        warehouse_id: mi.warehouse_id || null,
        notes: mi.notes,
      }));
      // Add L&B items
      const lbPayload = lbItems.filter(lb => lb.item_id && parseFloat(lb.quantity) > 0).map(lb => ({
        makeup_id: mu.id,
        item_id: lb.item_id,
        type: 'lost_breakage',
        default_qty: 0,
        actual_qty: parseFloat(lb.quantity),
        dirty_qty: 0,
        warehouse_id: lb.source_warehouse_id || null,
        notes: (lb.reason === 'lost' ? 'Lost' : 'Damaged') + (lb.notes ? ': ' + lb.notes : ''),
      }));
      const allPayload = [...itemsPayload, ...lbPayload];
      const { error: iErr } = await supabase.from('room_makeup_items').insert(allPayload);
      if (iErr) throw iErr;

      // Save activity checks
      const actPayload = activityChecks.filter(ac => ac.is_checked).map(ac => ({
        room_makeup_id: mu.id,
        template_id: ac._source === 'template' ? ac.template_id : null,
        checklist_item_id: ac._source === 'room' ? ac.checklist_item_id : null,
        activity_name: ac.activity_name || null,
        is_checked: true,
        notes: ac.notes || null, checked_by: currentUser?.id, checked_at: new Date().toISOString(),
      }));
      if (actPayload.length > 0) {
        const { error: acErr } = await supabase.from('makeup_activity_checks').insert(actPayload);
        if (acErr) throw acErr;
      }

      // Save in-use checks
      const iuPayload = inuseChecks.map(ic => ({
        room_makeup_id: mu.id, item_id: ic.item_id, expected_qty: ic.expected_qty,
        actual_qty: parseInt(ic.actual_qty) || 0, notes: ic.notes || null,
        checked_by: currentUser?.id, checked_at: new Date().toISOString(),
      }));
      if (iuPayload.length > 0) {
        const { error: iuErr } = await supabase.from('makeup_inuse_checks').insert(iuPayload);
        if (iuErr) throw iuErr;
      }

      showNotification(t('makeup.successSave'));
      setShowModal(false);
      loadAll();
    } catch (err) { showNotification(t('makeup.errorSave') + ': ' + err.message, 'error'); }
    setSaving(false);
  }

  async function confirmMakeup(mu) {
    if (!confirm(t('makeup.confirmMsg'))) return;
    setSaving(true);
    try {
      const muItems = mu.room_makeup_items || [];
      if (muItems.length === 0) throw new Error('No items');

      const room = rooms.find(r => r.id === mu.room_id);
      const roomWarehouseId = room?.warehouse_id || null;
      const damageWarehouse = warehouses.find(w => w.warehouse_type === 'damage' && w.code?.includes(selectedOrg.code));

      // Process replace & refill items (stock OUT from source warehouse)
      for (const item of muItems.filter(i => i.type === 'replace' || i.type === 'refill')) {
        const qty = parseFloat(item.actual_qty);
        if (qty <= 0) continue;

        const { data: sb } = await supabase.from('stock_balance')
          .select('id, quantity, avg_cost, total_value')
          .eq('organization_id', selectedOrg.id)
          .eq('item_id', item.item_id)
          .maybeSingle();

        const unitCost = sb ? parseFloat(sb.avg_cost) || 0 : 0;
        const totalCost = qty * unitCost;

        const { error: smErr } = await supabase.from('stock_movements').insert({
          organization_id: selectedOrg.id,
          item_id: item.item_id,
          movement_type: 'OUT',
          quantity: qty,
          unit_cost: unitCost,
          total_cost: totalCost,
          reference_type: 'MAKEUP',
          reference_number: mu.makeup_number,
          warehouse_id: item.warehouse_id || null,
          notes: item.type === 'replace'
            ? `Room makeup replace. Dirty: ${item.dirty_qty || 0}`
            : 'Room makeup refill',
        });
        if (smErr) throw new Error('Stock movement: ' + smErr.message);

        if (sb) {
          const newQty = Math.max(0, parseFloat(sb.quantity) - qty);
          const newTotalValue = newQty * parseFloat(sb.avg_cost);
          await supabase.from('stock_balance').update({
            quantity: newQty,
            total_value: newTotalValue,
            last_movement_at: new Date().toISOString(),
            updated_at: new Date().toISOString(),
          }).eq('id', sb.id);
        }
      }

      // Process Lost & Breakage items
      for (const item of muItems.filter(i => i.type === 'lost_breakage')) {
        const qty = parseFloat(item.actual_qty);
        if (qty <= 0) continue;

        const { data: sb } = await supabase.from('stock_balance')
          .select('id, quantity, avg_cost, total_value')
          .eq('organization_id', selectedOrg.id)
          .eq('item_id', item.item_id)
          .maybeSingle();

        const unitCost = sb ? parseFloat(sb.avg_cost) || 0 : 0;
        const totalCost = qty * unitCost;

        // 1. OUT from room warehouse (item lost/damaged leaves the room)
        await supabase.from('stock_movements').insert({
          organization_id: selectedOrg.id,
          item_id: item.item_id,
          movement_type: 'OUT',
          quantity: qty,
          unit_cost: unitCost,
          total_cost: totalCost,
          reference_type: 'LOST_BREAKAGE',
          reference_number: mu.makeup_number,
          warehouse_id: roomWarehouseId,
          notes: `${item.notes || 'Lost/Damaged'} - OUT from room`,
        });

        // 2. IN to Damaged warehouse
        if (damageWarehouse) {
          await supabase.from('stock_movements').insert({
            organization_id: selectedOrg.id,
            item_id: item.item_id,
            movement_type: 'IN',
            quantity: qty,
            unit_cost: unitCost,
            total_cost: totalCost,
            reference_type: 'LOST_BREAKAGE',
            reference_number: mu.makeup_number,
            warehouse_id: damageWarehouse.id,
            notes: `${item.notes || 'Lost/Damaged'} - IN to damaged warehouse`,
          });
        }

        // 3. Replacement: OUT from source warehouse → IN to room warehouse
        if (item.warehouse_id) {
          await supabase.from('stock_movements').insert({
            organization_id: selectedOrg.id,
            item_id: item.item_id,
            movement_type: 'OUT',
            quantity: qty,
            unit_cost: unitCost,
            total_cost: totalCost,
            reference_type: 'REPLACEMENT',
            reference_number: mu.makeup_number,
            warehouse_id: item.warehouse_id,
            notes: `Replacement for ${item.notes || 'lost/damaged'} - OUT from warehouse`,
          });

          await supabase.from('stock_movements').insert({
            organization_id: selectedOrg.id,
            item_id: item.item_id,
            movement_type: 'IN',
            quantity: qty,
            unit_cost: unitCost,
            total_cost: totalCost,
            reference_type: 'REPLACEMENT',
            reference_number: mu.makeup_number,
            warehouse_id: roomWarehouseId,
            notes: `Replacement for ${item.notes || 'lost/damaged'} - IN to room`,
          });
        }

        // Net stock effect: item moves from source warehouse to damaged warehouse
        // stock_balance net = -qty (lost from source) if replacement provided
        // If no replacement, just record the movement
        if (sb && item.warehouse_id) {
          const newQty = Math.max(0, parseFloat(sb.quantity) - qty);
          const newTotalValue = newQty * parseFloat(sb.avg_cost);
          await supabase.from('stock_balance').update({
            quantity: newQty,
            total_value: newTotalValue,
            last_movement_at: new Date().toISOString(),
            updated_at: new Date().toISOString(),
          }).eq('id', sb.id);
        }
      }

      // Update makeup status
      await supabase.from('room_makeups').update({
        status: 'CONFIRMED',
        updated_at: new Date().toISOString(),
      }).eq('id', mu.id);

      showNotification(t('makeup.successConfirm'));
      setShowModal(false);
      loadAll();
    } catch (err) { showNotification('Error: ' + err.message, 'error'); }
    setSaving(false);
  }

  const filtered = makeups.filter(mu => {
    if (filterStatus && mu.status !== filterStatus) return false;
    if (search) {
      const s = search.toLowerCase();
      return mu.makeup_number?.toLowerCase().includes(s) || mu.rooms?.room_number?.toLowerCase().includes(s);
    }
    return true;
  });

  const replaceItems = makeupItems.filter(i => i.type === 'replace');
  const refillItems = makeupItems.filter(i => i.type === 'refill');
  const nonDamageWarehouses = warehouses.filter(w => w.warehouse_type !== 'damage');
  const isView = !!viewing;
  const isDraft = viewing && viewing.status === 'DRAFT';

  return (
    <div>

                    const diff = (ic.actual_qty || 0) - (ic.expected_qty || 0);
                    return (
                      <tr key={idx} className={`border-t border-purple-100 ${diff < 0 ? 'bg-red-50' : ''}`}>

                          {ic.items?.brand && <span className="text-xs text-gray-400 ml-1">({ic.items.brand})</span>}
                          <br/><span className="text-xs text-gray-400">{ic.items?.code}</span>

                        <td className="px-3 py-2 text-center">{ic.expected_qty}</td>
                        <td className="px-3 py-2 text-center font-semibold text-purple-600">{ic.actual_qty}</td>
                        <td className={`px-3 py-2 text-center font-semibold ${diff < 0 ? 'text-red-600' : diff > 0 ? 'text-green-600' : 'text-gray-500'}`}>

                        <td className="px-3 py-2 text-xs text-gray-500">{ic.notes || '-'}</td>

                  }) : inuseItems.map(item => {

                    const expectedQty = check?.expected_qty || item.quantity || 0;
                    const actualQty = check?.actual_qty ?? expectedQty;
                    const diff = actualQty - expectedQty;
                    return (
                      <tr key={item.item_id} className={`border-t border-purple-100 ${diff < 0 ? 'bg-red-50' : ''}`}>
                        <td className="px-3 py-2">

                        </td>

                    );

                </tbody>
              </table>
            </div>
            {!isView && inuseItems.length === 0 && <p className="text-xs text-gray-400 italic mt-2">{t('makeup.noInuseItems')}</p>}
          </div>
        )}

        {/* Notes */}
        {!isView && (
          <FormField label={t('makeup.notes')}>
            <textarea value={notes} onChange={e => setNotes(e.target.value)} rows={2}
              className="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm" placeholder={t('makeup.notesPlaceholder')} />
          </FormField>
        )}
        {isView && viewing.notes && (
          <div className="mb-4 bg-gray-50 rounded-lg p-3">
            <p className="text-xs text-gray-500 mb-1">{t('makeup.notes')}</p>
            <p className="text-sm">{viewing.notes}</p>
          </div>
        )}

        {/* Actions */}
        <div className="flex justify-end gap-3 mt-4 pt-4 border-t border-gray-200">
          <Button variant="secondary" onClick={() => setShowModal(false)}>{isView ? t('common.close') : t('common.cancel')}</Button>
          {!isView && <Button onClick={handleSave} disabled={saving || !selectedRoom || makeupItems.length === 0}>
            {saving ? t('common.saving') || 'Saving...' : t('makeup.saveDraft')}
          </Button>}
          {isDraft && <Button variant="primary" onClick={() => confirmMakeup(viewing)} disabled={saving}>{t('makeup.confirm')}</Button>}
        </div>
      </Modal>
    </div>
  );
}
