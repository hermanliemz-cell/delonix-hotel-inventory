function RoomActivityChecklistModal({ room, open, onClose, allRooms }) {
  const { t } = useTranslation();
  const { showNotification } = useApp();
  const [activities, setActivities] = useState([]);
  const [loading, setLoading] = useState(true);
  const [saving, setSaving] = useState(false);
  const [addForm, setAddForm] = useState({ name: '', description: '' });
  const [editingId, setEditingId] = useState(null);
  const [editForm, setEditForm] = useState({ name: '', description: '' });
  const [copyFromRoom, setCopyFromRoom] = useState('');

  useEffect(() => { if (open && room) loadActivities(); }, [open, room]);

  async function loadActivities() {
    setLoading(true);
    const { data, error } = await supabase.from('room_activity_checklist')
      .select('*').eq('room_id', room.id).order('sort_order').order('created_at');
    if (!error) setActivities(data || []);
    setLoading(false);
  }

  async function handleAdd() {
    if (!addForm.name.trim()) return;
    setSaving(true);
    try {
      const maxSort = activities.reduce((max, a) => Math.max(max, a.sort_order || 0), 0);
      const { error } = await supabase.from('room_activity_checklist').insert({
        room_id: room.id, name: addForm.name.trim(),
        description: addForm.description.trim() || null,
        sort_order: maxSort + 1, is_active: true
      });
      if (error) throw error;
      showNotification(t('roomChecklist.successAdd'));
      setAddForm({ name: '', description: '' });
      loadActivities();
    } catch (err) { showNotification(t('roomChecklist.errorSave') + ': ' + err.message, 'error'); }
    setSaving(false);
  }

  async function handleUpdate(id) {
    if (!editForm.name.trim()) return;
    setSaving(true);
    try {
      const { error } = await supabase.from('room_activity_checklist')
        .update({ name: editForm.name.trim(), description: editForm.description.trim() || null })
        .eq('id', id);
      if (error) throw error;
      showNotification(t('roomChecklist.successUpdate'));
      setEditingId(null);
      loadActivities();
    } catch (err) { showNotification(t('roomChecklist.errorSave') + ': ' + err.message, 'error'); }
    setSaving(false);
  }

  async function handleDelete(id) {
    try {
      const { error } = await supabase.from('room_activity_checklist').delete().eq('id', id);
      if (error) throw error;
      showNotification(t('roomChecklist.successDelete'));
      loadActivities();
    } catch (err) { showNotification(t('roomChecklist.errorSave') + ': ' + err.message, 'error'); }
  }

  async function handleToggleActive(activity) {
    try {
      const { error } = await supabase.from('room_activity_checklist')
        .update({ is_active: !activity.is_active }).eq('id', activity.id);
      if (error) throw error;
      loadActivities();
    } catch (err) { showNotification('Error: ' + err.message, 'error'); }
  }

  async function handleMoveUp(idx) {
    if (idx === 0) return;
    const items = [...activities];
    const prevOrder = items[idx - 1].sort_order;
    const curOrder = items[idx].sort_order;
    await Promise.all([
      supabase.from('room_activity_checklist').update({ sort_order: curOrder }).eq('id', items[idx - 1].id),
      supabase.from('room_activity_checklist').update({ sort_order: prevOrder }).eq('id', items[idx].id),
    ]);
    loadActivities();
  }

  async function handleMoveDown(idx) {
    if (idx >= activities.length - 1) return;
    const items = [...activities];
    const nextOrder = items[idx + 1].sort_order;
    const curOrder = items[idx].sort_order;
    await Promise.all([
      supabase.from('room_activity_checklist').update({ sort_order: curOrder }).eq('id', items[idx + 1].id),
      supabase.from('room_activity_checklist').update({ sort_order: nextOrder }).eq('id', items[idx].id),
    ]);
    loadActivities();
  }

  async function handleCopyFrom() {
    if (!copyFromRoom) return;
    setSaving(true);
    try {
      const { data: sourceActivities, error: fetchErr } = await supabase.from('room_activity_checklist')
        .select('*').eq('room_id', copyFromRoom).eq('is_active', true).order('sort_order');
      if (fetchErr) throw fetchErr;
      if (!sourceActivities || sourceActivities.length === 0) {
        showNotification('Source room has no activities', 'error');
        setSaving(false);
        return;
      }
      const maxSort = activities.reduce((max, a) => Math.max(max, a.sort_order || 0), 0);
      const payload = sourceActivities.map((a, i) => ({
        room_id: room.id, name: a.name, description: a.description,
        sort_order: maxSort + i + 1, is_active: true
      }));
      const { error } = await supabase.from('room_activity_checklist').insert(payload);
      if (error) throw error;
      showNotification(t('roomChecklist.copySuccess'));
      setCopyFromRoom('');
      loadActivities();
    } catch (err) { showNotification(t('roomChecklist.errorSave') + ': ' + err.message, 'error'); }
    setSaving(false);
  }

  if (!room) return null;

  const otherRooms = (allRooms || []).filter(r => r.id !== room.id);

  return (
    <Modal open={open} onClose={onClose} title={`${t('roomChecklist.title')} - ${room.room_number}`} size="lg">
      <p className="text-sm text-gray-500 mb-4">{t('roomChecklist.subtitle')} {room.room_number}</p>

      {/* Add new activity form */}
      <div className="bg-gray-50 rounded-lg p-4 mb-4">
        <h4 className="text-sm font-semibold text-gray-700 mb-3">{t('roomChecklist.addActivity')}</h4>
        <div className="grid grid-cols-1 sm:grid-cols-12 gap-3 items-end">
          <div className="sm:col-span-4">
            <label className="block text-xs font-medium text-gray-600 mb-1">{t('roomChecklist.name')}</label>
            <Input value={addForm.name} onChange={e => setAddForm({...addForm, name: e.target.value})} placeholder="e.g. Check AC" />
          </div>
          <div className="sm:col-span-6">
            <label className="block text-xs font-medium text-gray-600 mb-1">{t('roomChecklist.description')}</label>
            <Input value={addForm.description} onChange={e => setAddForm({...addForm, description: e.target.value})} placeholder="Optional description" />
          </div>
          <div className="sm:col-span-2">
            <Button onClick={handleAdd} disabled={saving || !addForm.name.trim()} className="w-full"><Icons.Plus /> Add</Button>
          </div>
        </div>
      </div>

      {/* Copy from another room */}
      {otherRooms.length > 0 && (
        <div className="bg-blue-50 rounded-lg p-3 mb-4">
          <div className="flex items-center gap-3">
            <label className="text-xs font-medium text-blue-700 whitespace-nowrap">{t('roomChecklist.copyFrom')}:</label>
            <Select value={copyFromRoom} onChange={e => setCopyFromRoom(e.target.value)} className="flex-1">
              <option value="">{t('roomChecklist.copyFromRoom')}</option>
              {otherRooms.map(r => <option key={r.id} value={r.id}>{r.room_number}{r.room_types?.name ? ` (${r.room_types.name})` : ''}</option>)}
            </Select>
            <Button variant="secondary" onClick={handleCopyFrom} disabled={!copyFromRoom || saving}>Copy</Button>
          </div>
        </div>
      )}

      {/* Activities list */}
      {loading ? <div className="text-center py-8 text-gray-400">Loading...</div> : activities.length === 0 ? (
        <div className="text-center py-8 text-gray-400">{t('roomChecklist.noActivities')}</div>
      ) : (
        <div className="bg-white border border-gray-200 rounded-lg overflow-hidden">
          <table className="w-full text-sm">
            <thead><tr className="bg-gray-50 text-gray-700">
              <th className="text-left px-3 py-2 font-medium w-8">#</th>
              <th className="text-left px-3 py-2 font-medium">{t('roomChecklist.name')}</th>
              <th className="text-left px-3 py-2 font-medium">{t('roomChecklist.description')}</th>
              <th className="text-center px-3 py-2 font-medium w-20">{t('common.status')}</th>
              <th className="w-32"></th>
            </tr></thead>
            <tbody>
              {activities.map((act, idx) => (
                <tr key={act.id} className="border-t border-gray-100 hover:bg-gray-50">
                  {editingId === act.id ? (
                    <>
                      <td className="px-3 py-2 text-gray-400">{idx + 1}</td>
                      <td className="px-3 py-2"><Input value={editForm.name} onChange={e => setEditForm({...editForm, name: e.target.value})} className="text-sm" /></td>
                      <td className="px-3 py-2"><Input value={editForm.description} onChange={e => setEditForm({...editForm, description: e.target.value})} className="text-sm" /></td>
                      <td></td>
                      <td className="px-2 py-2">
                        <div className="flex items-center gap-1">
                          <button onClick={() => handleUpdate(act.id)} className="p-1 hover:bg-green-100 rounded text-green-600" title="Save"><Icons.Save /></button>
                          <button onClick={() => setEditingId(null)} className="p-1 hover:bg-gray-100 rounded text-gray-400" title="Cancel"><Icons.X /></button>
                        </div>
                      </td>
                    </>
                  ) : (
                    <>
                      <td className="px-3 py-2 text-gray-400">{idx + 1}</td>
                      <td className="px-3 py-2 font-medium">{act.name}</td>
                      <td className="px-3 py-2 text-gray-500">{act.description || '-'}</td>
                      <td className="px-3 py-2 text-center">
                        <button onClick={() => handleToggleActive(act)} className={`text-xs px-2 py-0.5 rounded-full ${act.is_active ? 'bg-green-100 text-green-700' : 'bg-gray-100 text-gray-500'}`}>
                          {act.is_active ? t('common.active') : t('common.inactive')}
                        </button>
                      </td>
                      <td className="px-2 py-2">
                        <div className="flex items-center gap-1">
                          <button onClick={() => handleMoveUp(idx)} disabled={idx === 0} className="p-1 hover:bg-gray-100 rounded text-gray-400 disabled:opacity-30" title="Move up">▲</button>
                          <button onClick={() => handleMoveDown(idx)} disabled={idx === activities.length - 1} className="p-1 hover:bg-gray-100 rounded text-gray-400 disabled:opacity-30" title="Move down">▼</button>
                          <button onClick={() => { setEditingId(act.id); setEditForm({ name: act.name, description: act.description || '' }); }} className="p-1 hover:bg-gray-100 rounded text-gray-500" title="Edit"><Icons.Edit /></button>
                          <button onClick={() => handleDelete(act.id)} className="p-1 hover:bg-red-50 rounded text-red-400" title="Delete"><Icons.Trash /></button>
                        </div>
                      </td>
                    </>
                  )}
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      )}

      <div className="flex justify-end mt-6 pt-4 border-t">
        <Button variant="secondary" onClick={onClose}>{t('common.close') || 'Close'}</Button>
      </div>
    </Modal>
  );
}

function RoomsPage() {
  const { t } = useTranslation();
  const { selectedOrg, showNotification } = useApp();
  const [rooms, setRooms] = useState([]);
  const [roomTypes, setRoomTypes] = useState([]);
  const [bedFormations, setBedFormations] = useState([]);
  const [loading, setLoading] = useState(true);
  const [showModal, setShowModal] = useState(false);
  const [editing, setEditing] = useState(null);
  const [saving, setSaving] = useState(false);
  const [search, setSearch] = useState('');
  const [form, setForm] = useState({ room_number: '', floor: '', room_type_id: '', bed_formation_id: '', description: '', is_active: true });
  const [itemsRoom, setItemsRoom] = useState(null);
  const [checklistRoom, setChecklistRoom] = useState(null);

  useEffect(() => { if (selectedOrg) loadRooms(); }, [selectedOrg]);

  async function loadRooms() {
    setLoading(true);
    const [roomRes, rtRes, bfRes] = await Promise.all([
      supabase.from('rooms').select('*, warehouses(id, code, name), room_types(id, code, name), bed_formations(id, code, name)')
        .eq('organization_id', selectedOrg.id).order('room_number'),
      supabase.from('room_types').select('*').eq('is_active', true).order('name'),
      supabase.from('bed_formations').select('*').eq('is_active', true).order('name'),
    ]);
    setRooms(roomRes.data || []);
    setRoomTypes(rtRes.data || []);
    setBedFormations(bfRes.data || []);
    setLoading(false);
  }

  function openAdd() {
    setEditing(null);
    setForm({ room_number: '', floor: '', room_type_id: '', bed_formation_id: '', description: '', is_active: true });
    setShowModal(true);
  }

  function openEdit(room) {
    setEditing(room);
    setForm({ room_number: room.room_number, floor: room.floor || '', room_type_id: room.room_type_id || '', bed_formation_id: room.bed_formation_id || '', description: room.description || '', is_active: room.is_active });
    setShowModal(true);
  }

  async function handleSave() {
    if (!form.room_number.trim()) return;
    setSaving(true);
    try {
      const selectedRT = roomTypes.find(rt => rt.id === form.room_type_id);
      const payload = {
        organization_id: selectedOrg.id,
        room_number: form.room_number.trim(),
        floor: form.floor.trim() || null,
        room_type_id: form.room_type_id || null,
        room_type: selectedRT ? selectedRT.name.toLowerCase() : 'standard',
        bed_formation_id: form.bed_formation_id || null,
        description: form.description.trim() || null,
        is_active: form.is_active
      };
      if (editing) {
        const { error } = await supabase.from('rooms').update(payload).eq('id', editing.id);
        if (error) throw error;
      } else {
        const { data: newRoom, error } = await supabase.from('rooms').insert(payload).select().single();
        if (error) throw error;

        // Auto-create warehouse for new room
        if (newRoom) {
          const whCode = 'RM-' + (selectedOrg.code || '') + '-' + form.room_number.trim();
          const whName = 'Room ' + form.room_number.trim();
          const { data: wh, error: whErr } = await supabase.from('warehouses').insert({
            organization_id: selectedOrg.id,
            code: whCode,
            name: whName,
            warehouse_type: 'room',
            is_active: true
          }).select().single();
          if (whErr) throw whErr;

          // Update room with warehouse_id
          const { error: rmErr } = await supabase.from('rooms').update({ warehouse_id: wh.id }).eq('id', newRoom.id);
          if (rmErr) throw rmErr;

          showNotification('Room created with warehouse ' + whCode);
        }
      }
      showNotification(t('room.successSave'));
      setShowModal(false);
      loadRooms();
    } catch (err) { showNotification(t('room.errorSave') + ': ' + err.message, 'error'); }
    setSaving(false);
  }

  async function handleDelete(room) {
    // Check dependencies before delete
    const [riRes, muRes] = await Promise.all([
      supabase.from('room_items').select('id', { count: 'exact', head: true }).eq('room_id', room.id),
      supabase.from('room_makeups').select('id', { count: 'exact', head: true }).eq('room_id', room.id),
    ]);
    const deps = [];
    if (riRes.count > 0) deps.push(`${riRes.count} room item(s)`);
    if (muRes.count > 0) deps.push(`${muRes.count} room makeup(s)`);
    if (deps.length > 0) {
      const msg = `Cannot delete Room "${room.room_number}" — it has linked data: ${deps.join(', ')}. Deactivate instead?`;
      if (confirm(msg)) {
        await supabase.from('rooms').update({ is_active: false }).eq('id', room.id);
        loadRooms();
      }
      return;
    }
    if (!confirm(t('room.confirmDelete'))) return;
    try {
      if (room.warehouse_id) {
        await supabase.from('warehouses').update({ is_active: false }).eq('id', room.warehouse_id);
      }
      const { error } = await supabase.from('rooms').delete().eq('id', room.id);
      if (error) throw error;
      showNotification(t('room.successDelete'));
      loadRooms();
    } catch (err) { showNotification('Error: ' + err.message, 'error'); }
  }

  async function toggleWarehouse(room) {
    try {
      if (room.warehouse_id) {
        // Disable warehouse: delete warehouse record, clear warehouse_id
        await supabase.from('warehouses').update({ is_active: false }).eq('id', room.warehouse_id);
        await supabase.from('rooms').update({ warehouse_id: null }).eq('id', room.id);
        showNotification(t('room.warehouseDisabled'));
      } else {
        // Enable warehouse: create warehouse record, set warehouse_id
        const whCode = 'RM-' + (selectedOrg.code || '') + '-' + room.room_number;
        const whName = 'Room ' + room.room_number;
        const { data: wh, error: whErr } = await supabase.from('warehouses').insert({
          organization_id: selectedOrg.id, code: whCode, name: whName,
          warehouse_type: 'room', description: 'Warehouse for room ' + room.room_number, is_active: true
        }).select().single();
        if (whErr) throw whErr;
        const { error: rmErr } = await supabase.from('rooms').update({ warehouse_id: wh.id }).eq('id', room.id);
        if (rmErr) throw rmErr;
        showNotification(t('room.warehouseEnabled'));
      }
      loadRooms();
    } catch (err) { showNotification('Error: ' + err.message, 'error'); }
  }

  const typeColors = { STD: 'gray', SUP: 'blue', DLX: 'purple', STE: 'amber', CON: 'teal' };

  const filtered = rooms.filter(r =>
    r.room_number.toLowerCase().includes(search.toLowerCase()) ||
    (r.room_types?.name || r.room_type || '').toLowerCase().includes(search.toLowerCase()) ||
    (r.floor && r.floor.toLowerCase().includes(search.toLowerCase()))
  );

  return (
    <div>
      <PageHeader title={t('room.title')} subtitle={`${rooms.length} ${t('menu.rooms')}`}
        actions={<Button onClick={openAdd}><Icons.Plus /> {t('room.addNew')}</Button>} />

      <div className="bg-white rounded-xl shadow-sm border border-gray-100">
        <div className="p-4 border-b border-gray-100">
          <div className="relative">
            <Icons.Search />
            <input type="text" placeholder={t('items.searchPlaceholder')} value={search} onChange={e => setSearch(e.target.value)}
              className="w-full sm:w-80 pl-10 pr-4 py-2 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-primary-500" style={{paddingLeft: '2.5rem'}} />
          </div>
        </div>
        <DataTable
          loading={loading}
          columns={[
            { header: t('room.roomNumber'), key: 'room_number', render: r => <span className="font-mono text-sm font-bold">{r.room_number}</span> },
            { header: t('room.floor'), render: r => r.floor || '-' },
            { header: t('room.roomType'), render: r => r.room_types ? <Badge color={typeColors[r.room_types.code] || 'gray'}>{r.room_types.name}</Badge> : <span className="text-gray-400">{r.room_type || '-'}</span> },
            { header: t('room.bedFormation'), render: r => r.bed_formations ? <span className="text-sm">{r.bed_formations.name}</span> : <span className="text-gray-400">-</span> },
            { header: t('room.warehouse'), render: r => r.warehouse_id
              ? <span className="inline-flex items-center gap-1 text-xs bg-green-50 text-green-700 px-2 py-1 rounded-full"><Icons.Link /> {r.warehouses?.code || 'RM-' + r.room_number}</span>
              : <span className="text-gray-400 text-xs">{t('room.warehouseInactive')}</span>
            },
            { header: t('common.status'), render: r => <Badge color={r.is_active ? 'green' : 'red'}>{r.is_active ? t('common.active') : t('common.inactive')}</Badge> },
          ]}
          data={filtered}
          actions={(row) => (
            <div className="flex items-center gap-1">
              <button onClick={(e) => { e.stopPropagation(); toggleWarehouse(row); }}
                className={`p-1.5 rounded-lg text-xs font-medium ${row.warehouse_id ? 'bg-red-50 text-red-600 hover:bg-red-100' : 'bg-green-50 text-green-600 hover:bg-green-100'}`}
                title={row.warehouse_id ? t('room.disableWarehouse') : t('room.enableWarehouse')}>
                <Icons.Warehouse />
              </button>
              <button onClick={(e) => { e.stopPropagation(); setItemsRoom(row); }}
                className="p-1.5 rounded-lg bg-purple-50 text-purple-600 hover:bg-purple-100" title={t('room.manageItems')}>
                <Icons.ClipboardList />
              </button>
              <button onClick={(e) => { e.stopPropagation(); setChecklistRoom(row); }}
                className="p-1.5 rounded-lg bg-teal-50 text-teal-600 hover:bg-teal-100" title={t('roomChecklist.title')}>
                <Icons.CheckSquare />
              </button>
              <button onClick={(e) => { e.stopPropagation(); openEdit(row); }} className="p-1.5 hover:bg-gray-100 rounded-lg text-gray-500"><Icons.Edit /></button>
              <button onClick={(e) => { e.stopPropagation(); handleDelete(row); }} className="p-1.5 hover:bg-red-50 rounded-lg text-red-400"><Icons.Trash /></button>
            </div>
          )}
        />
      </div>

      <Modal open={showModal} onClose={() => setShowModal(false)} title={editing ? t('room.editTitle') : t('room.addNew')} size="md">
        <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
          <FormField label={t('room.roomNumber')} required>
            <Input value={form.room_number} onChange={e => setForm({...form, room_number: e.target.value})} placeholder="101" />
          </FormField>
          <FormField label={t('room.floor')}>
            <Input value={form.floor} onChange={e => setForm({...form, floor: e.target.value})} placeholder="1" />
          </FormField>
          <FormField label={t('room.roomType')}>
            <Select value={form.room_type_id} onChange={e => setForm({...form, room_type_id: e.target.value})}>
              <option value="">-- Select Room Type --</option>
              {roomTypes.map(rt => <option key={rt.id} value={rt.id}>{rt.name} ({rt.code})</option>)}
            </Select>
          </FormField>
          <FormField label={t('room.bedFormation')}>
            <Select value={form.bed_formation_id} onChange={e => setForm({...form, bed_formation_id: e.target.value})}>
              <option value="">-- Select Bed Formation --</option>
              {bedFormations.map(bf => <option key={bf.id} value={bf.id}>{bf.name} ({bf.code})</option>)}
            </Select>
          </FormField>
          <FormField label={t('common.status')}>
            <Select value={form.is_active} onChange={e => setForm({...form, is_active: e.target.value === 'true'})}>
              <option value="true">{t('common.active')}</option>
              <option value="false">{t('common.inactive')}</option>
            </Select>
          </FormField>
          <div className="sm:col-span-2">
            <FormField label={t('common.description')}>
              <Input value={form.description} onChange={e => setForm({...form, description: e.target.value})} placeholder={t('common.description')} />
            </FormField>
          </div>
        </div>
        <div className="flex justify-end gap-3 mt-6 pt-4 border-t">
          <Button variant="secondary" onClick={() => setShowModal(false)}>{t('common.cancel')}</Button>
          <Button onClick={handleSave} disabled={saving}>{editing ? t('common.update') : t('common.save')}</Button>
        </div>
      </Modal>

      <RoomItemsModal room={itemsRoom} open={!!itemsRoom} onClose={() => setItemsRoom(null)} />
      <RoomActivityChecklistModal room={checklistRoom} open={!!checklistRoom} onClose={() => setChecklistRoom(null)} allRooms={rooms} />
    </div>
  );
}

// STOCK BALANCE PAGE

function StockBalancePage() {
  const { selectedOrg } = useApp();
  const { t } = useTranslation();
  const [stock, setStock] = useState([]);
  const [categories, setCategories] = useState([]);
  const [warehouses, setWarehouses] = useState([]);
  const [loading, setLoading] = useState(true);
  const [search, setSearch] = useState('');
  const [filterCategory, setFilterCategory] = useState('');
  const [filterWarehouse, setFilterWarehouse] = useState('');

  useEffect(() => { if(selectedOrg) loadStock(); }, [selectedOrg]);

  async function loadStock() {
    setLoading(true);
    const [stockRes, catRes, whRes] = await Promise.all([
      supabase.from('stock_balance')
        .select('*, items(code, name, brand, size, min_stock, reorder_point, category_id, units:unit_id(abbreviation), item_categories(id, code, name)), departments!left(name, code)')
        .eq('organization_id', selectedOrg.id)
        .order('updated_at', { ascending: false }),
      supabase.from('item_categories').select('id, code, name').eq('is_active', true).order('name'),
      supabase.from('warehouses').select('id, code, name').eq('organization_id', selectedOrg.id).eq('is_active', true).order('code'),
    ]);
    setStock(stockRes.data || []);
    setCategories(catRes.data || []);
    setWarehouses(whRes.data || []);
    setLoading(false);
  }

  const filtered = stock.filter(s => {
    const term = search.toLowerCase();
    const matchSearch = !term || (s.items?.name?.toLowerCase().includes(term) || s.items?.code?.toLowerCase().includes(term) || s.departments?.name?.toLowerCase().includes(term) || s.items?.brand?.toLowerCase().includes(term));
    const matchCat = !filterCategory || s.items?.item_categories?.id === filterCategory;
    return matchSearch && matchCat;
  });

  const totalValue = filtered.reduce((sum, s) => sum + (s.total_value || 0), 0);
  const totalItems = filtered.length;
  const lowStockItems = filtered.filter(s => s.items?.reorder_point && s.quantity <= s.items.reorder_point).length;

  return (
    <div>
      <PageHeader title={t('stock.title')} subtitle={`${t('stock.subtitle')} ${selectedOrg?.name}`} />

      <div className="grid grid-cols-1 sm:grid-cols-3 gap-4 mb-6">
        <div className="bg-white rounded-xl shadow-sm border border-gray-100 p-4">
          <p className="text-xs text-gray-500 uppercase">{t('stock.totalItems')}</p>
          <p className="text-2xl font-bold text-gray-900 mt-1">{formatNumber(totalItems)}</p>
        </div>
        <div className="bg-white rounded-xl shadow-sm border border-gray-100 p-4">
          <p className="text-xs text-gray-500 uppercase">{t('stock.totalValue')}</p>
          <p className="text-2xl font-bold text-primary-700 mt-1">{formatCurrency(totalValue)}</p>
        </div>
        <div className="bg-white rounded-xl shadow-sm border border-gray-100 p-4">
          <p className="text-xs text-gray-500 uppercase">{t('stock.lowStock')}</p>
          <p className={`text-2xl font-bold mt-1 ${lowStockItems > 0 ? 'text-red-600' : 'text-green-600'}`}>{lowStockItems}</p>
        </div>
      </div>

      <div className="bg-white rounded-xl shadow-sm border border-gray-100">
        <div className="p-4 border-b border-gray-100 flex flex-wrap gap-3 items-center">
          <input type="text" placeholder={t('stock.searchPlaceholder')} value={search} onChange={e=>setSearch(e.target.value)}
            className="w-full sm:w-64 px-4 py-2 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-primary-500"/>
          <select value={filterCategory} onChange={e=>setFilterCategory(e.target.value)}
            className="px-3 py-2 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-primary-500">
            <option value="">{t('stock.allCategories')}</option>
            {categories.map(c => <option key={c.id} value={c.id}>{c.name}</option>)}
          </select>
          {(filterCategory || search) && (
            <button onClick={() => { setFilterCategory(''); setSearch(''); }}
              className="px-3 py-2 text-sm text-gray-500 hover:text-red-600 hover:bg-red-50 rounded-lg">
              {t('common.clearFilters')}
            </button>
          )}
        </div>
        <DataTable loading={loading}
          columns={[
            { header: t('dashboard.item'), render: r => <div><span className="font-medium">{r.items?.name}</span>{r.items?.brand && <span className="text-xs text-gray-400 ml-1">({r.items.brand})</span>}<br/><span className="text-xs text-gray-400">{r.items?.code}</span>{r.items?.size && <span className="text-xs bg-blue-50 text-blue-600 px-1.5 py-0.5 rounded ml-1">{r.items.size}</span>}</div> },
            { header: t('items.category'), render: r => r.items?.item_categories ? <Badge color="purple">{r.items.item_categories.code}</Badge> : '-' },
            { header: t('stock.dept'), render: r => <Badge color="blue">{r.departments?.code}</Badge> },
            { header: t('dashboard.qty'), render: r => {
              const isLow = r.items?.reorder_point && r.quantity <= r.items.reorder_point;
              return <span className={`font-semibold ${isLow ? 'text-red-600' : ''}`}>{formatNumber(r.quantity)} {r.items?.units?.abbreviation}</span>;
            }},
            { header: t('stock.avgCost'), render: r => formatCurrency(r.avg_cost) },
            { header: t('stock.totalValue'), render: r => formatCurrency(r.total_value) },
            { header: t('stock.lastUpdate'), render: r => r.last_movement_at ? new Date(r.last_movement_at).toLocaleDateString('id-ID') : '-' },
          ]}
          data={filtered}
        />
      </div>
    </div>
  );
}

// ============================================================
function BinCardPage() {
  const { selectedOrg } = useApp();
  const { t } = useTranslation();
  const [movements, setMovements] = useState([]);
  const [allItems, setAllItems] = useState([]);
  const [warehouses, setWarehouses] = useState([]);
  const [categories, setCategories] = useState([]);
  const [loading, setLoading] = useState(true);
  const [filterWarehouse, setFilterWarehouse] = useState('');
  const [filterCategory, setFilterCategory] = useState('');
  const [filterItem, setFilterItem] = useState('');
  const [filterType, setFilterType] = useState('');
  const [periodPreset, setPeriodPreset] = useState('mtd');
  const [dateFrom, setDateFrom] = useState('');
  const [dateTo, setDateTo] = useState('');

  function getDateRange(preset) {
    const today = new Date();
    const yyyy = today.getFullYear();
    const mm = String(today.getMonth() + 1).padStart(2, '0');
    const dd = String(today.getDate()).padStart(2, '0');
    const todayStr = yyyy + '-' + mm + '-' + dd;

    const yesterday = new Date(today);
    yesterday.setDate(yesterday.getDate() - 1);
    const ydStr = yesterday.getFullYear() + '-' + String(yesterday.getMonth() + 1).padStart(2, '0') + '-' + String(yesterday.getDate()).padStart(2, '0');

    const lastMonthEnd = new Date(yyyy, today.getMonth(), 0);
    const lastMonthStart = new Date(lastMonthEnd.getFullYear(), lastMonthEnd.getMonth(), 1);
    const lmsStr = lastMonthStart.getFullYear() + '-' + String(lastMonthStart.getMonth() + 1).padStart(2, '0') + '-01';
    const lmeStr = lastMonthEnd.getFullYear() + '-' + String(lastMonthEnd.getMonth() + 1).padStart(2, '0') + '-' + String(lastMonthEnd.getDate()).padStart(2, '0');

    switch (preset) {
      case 'today': return { from: todayStr, to: todayStr };
      case 'yesterday': return { from: ydStr, to: ydStr };
      case 'mtd': return { from: yyyy + '-' + mm + '-01', to: todayStr };
      case 'lastmonth': return { from: lmsStr, to: lmeStr };
      case 'ytd': return { from: yyyy + '-01-01', to: todayStr };
      case 'custom': return { from: dateFrom, to: dateTo };
      default: return { from: '', to: '' };
    }
  }

  function handlePeriodChange(val) {
    setPeriodPreset(val);
    if (val !== 'custom') {
      const range = getDateRange(val);
      setDateFrom(range.from);
      setDateTo(range.to);
    }
  }

  // Initialize MTD dates on mount
  useEffect(() => {
    const range = getDateRange('mtd');
    setDateFrom(range.from);
    setDateTo(range.to);
  }, []);

  useEffect(() => { if(selectedOrg) loadData(); }, [selectedOrg]);

  async function loadData() {
    setLoading(true);
    const [movRes, itemRes, whRes, catRes] = await Promise.all([
      supabase.from('stock_movements')
        .select('*, items(code, name, category_id, units:unit_id(abbreviation)), departments!left(code)')
        .eq('organization_id', selectedOrg.id)
        .order('created_at', { ascending: false })
        .limit(1000),
      supabase.from('items').select('id, code, name, category_id, default_warehouse_id').eq('is_active', true).order('code'),
      supabase.from('warehouses').select('id, code, name').eq('organization_id', selectedOrg.id).eq('is_active', true).order('name'),
      supabase.from('item_categories').select('id, code, name').eq('is_active', true).order('name'),
    ]);
    setMovements(movRes.data || []);
    setAllItems(itemRes.data || []);
    setWarehouses(whRes.data || []);
    // Deduplicate categories by name
    const uniqueCats = [];
    const seenNames = new Set();
    (catRes.data || []).forEach(c => {
      if (!seenNames.has(c.name)) { seenNames.add(c.name); uniqueCats.push(c); }
    });
    setCategories(uniqueCats);
    setLoading(false);
  }

  // Cascading: filter items by selected category
  const filteredItems = allItems.filter(i => {
    if (filterCategory && i.category_id !== filterCategory) return false;
    return true;
  });

  // Reset item filter when warehouse or category changes
  useEffect(() => {
    if (filterCategory && filterItem) {
      const itemStillValid = filteredItems.some(i => i.id === filterItem);
      if (!itemStillValid) setFilterItem('');
    }
  }, [filterCategory]);

  const dateRange = periodPreset === 'custom' ? { from: dateFrom, to: dateTo } : getDateRange(periodPreset);

  const filtered = movements.filter(m => {
    if (filterWarehouse && m.warehouse_id !== filterWarehouse) return false;
    if (filterCategory && m.items?.category_id !== filterCategory) return false;
    if (filterItem && m.item_id !== filterItem) return false;
    if (filterType && m.movement_type !== filterType) return false;
    if (dateRange.from && m.created_at < dateRange.from) return false;
    if (dateRange.to && m.created_at > dateRange.to + 'T23:59:59') return false;
    return true;
  });

  const totalIn = filtered.filter(m => m.movement_type === 'IN').reduce((s, m) => s + (m.quantity || 0), 0);
  const totalOut = filtered.filter(m => m.movement_type === 'OUT').reduce((s, m) => s + (m.quantity || 0), 0);

  const periodOptions = [
    { value: 'today', label: 'Today' },
    { value: 'yesterday', label: 'Yesterday' },
    { value: 'mtd', label: 'Current Month (MTD)' },
    { value: 'lastmonth', label: 'Last Month' },
    { value: 'ytd', label: 'Current Year (YTD)' },
    { value: 'custom', label: 'Custom Period' },
  ];

  function handleClearFilters() {
    setFilterWarehouse('');
    setFilterCategory('');
    setFilterItem('');
    setFilterType('');
    setPeriodPreset('mtd');
    const range = getDateRange('mtd');
    setDateFrom(range.from);
    setDateTo(range.to);
  }

  const hasActiveFilters = filterWarehouse || filterCategory || filterItem || filterType || periodPreset !== 'mtd';

  // Get warehouse name for display
  const getWarehouseName = (whId) => {
    const wh = warehouses.find(w => w.id === whId);
    return wh ? wh.name : '';
  };

  return (
    <div>
      <PageHeader title={t('bincard.title')} subtitle={t('bincard.subtitle')} />

      <div className="grid grid-cols-1 sm:grid-cols-3 gap-4 mb-6">
        <div className="bg-white rounded-xl shadow-sm border border-gray-100 p-4">
          <p className="text-xs text-gray-500 uppercase">{t('bincard.totalMovements')}</p>
          <p className="text-2xl font-bold text-gray-900 mt-1">{formatNumber(filtered.length)}</p>
        </div>
        <div className="bg-white rounded-xl shadow-sm border border-gray-100 p-4">
          <p className="text-xs text-gray-500 uppercase">{t('bincard.totalIn')}</p>
          <p className="text-2xl font-bold text-green-600 mt-1">+{formatNumber(totalIn)}</p>
        </div>
        <div className="bg-white rounded-xl shadow-sm border border-gray-100 p-4">
          <p className="text-xs text-gray-500 uppercase">{t('bincard.totalOut')}</p>
          <p className="text-2xl font-bold text-red-600 mt-1">-{formatNumber(totalOut)}</p>
        </div>
      </div>

      <div className="bg-white rounded-xl shadow-sm border border-gray-100">
        <div className="p-4 border-b border-gray-100">
          {/* Row 1: Period filter */}
          <div className="flex flex-wrap gap-3 items-center mb-3">
            <label className="text-xs font-semibold text-gray-500 uppercase w-16">Period</label>
            <div className="flex flex-wrap gap-1">
              {periodOptions.map(opt => (
                <button key={opt.value} onClick={() => handlePeriodChange(opt.value)}
                  className={'px-3 py-1.5 rounded-lg text-xs font-medium transition-colors ' +
                    (periodPreset === opt.value
                      ? 'bg-primary-600 text-white shadow-sm'
                      : 'bg-gray-100 text-gray-600 hover:bg-gray-200')}>
                  {opt.label}
                </button>
              ))}
            </div>
            {periodPreset === 'custom' && (
              <div className="flex items-center gap-2">
                <input type="date" value={dateFrom} onChange={e => setDateFrom(e.target.value)}
                  className="px-3 py-1.5 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-primary-500" />
                <span className="text-gray-400">—</span>
                <input type="date" value={dateTo} onChange={e => setDateTo(e.target.value)}
                  className="px-3 py-1.5 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-primary-500" />
              </div>
            )}
          </div>
          {/* Row 2: Warehouse, Category, Item, Type filters */}
          <div className="flex flex-wrap gap-3 items-center">
            <select value={filterWarehouse} onChange={e => { setFilterWarehouse(e.target.value); }}
              className="px-3 py-2 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-primary-500 bg-white">
              <option value="">All Warehouses</option>
              {warehouses.map(w => <option key={w.id} value={w.id}>{w.code} - {w.name}</option>)}
            </select>
            <select value={filterCategory} onChange={e => { setFilterCategory(e.target.value); }}
              className="px-3 py-2 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-primary-500 bg-white">
              <option value="">All Categories</option>
              {categories.map(c => <option key={c.id} value={c.id}>{c.name}</option>)}
            </select>
            <select value={filterItem} onChange={e=>setFilterItem(e.target.value)}
              className="px-3 py-2 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-primary-500 bg-white" style={{maxWidth: '280px'}}>
              <option value="">{t('bincard.allItems')}</option>
              {filteredItems.map(i => <option key={i.id} value={i.id}>{i.code} - {i.name}</option>)}
            </select>
            <select value={filterType} onChange={e=>setFilterType(e.target.value)}
              className="px-3 py-2 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-primary-500 bg-white">
              <option value="">{t('bincard.allTypes')}</option>
              <option value="IN">IN</option>
              <option value="OUT">OUT</option>
              <option value="ADJ">ADJ</option>
            </select>
            {hasActiveFilters && (
              <button onClick={handleClearFilters}
                className="px-3 py-2 text-sm text-gray-500 hover:text-red-600 hover:bg-red-50 rounded-lg">{t('common.clearFilters')}</button>
            )}
          </div>
        </div>
        <DataTable loading={loading}
          columns={[
            { header: t('common.date'), render: r => new Date(r.created_at).toLocaleString('id-ID', {dateStyle:'short',timeStyle:'short'}) },
            { header: 'Warehouse', render: r => <span className="text-xs">{getWarehouseName(r.warehouse_id) || '-'}</span> },
            { header: t('dashboard.item'), render: r => <div><span className="font-medium">{r.items?.name}</span><br/><span className="text-xs text-gray-400">{r.items?.code}</span></div> },
            { header: t('stock.dept'), render: r => <Badge color="blue">{r.departments?.code}</Badge> },
            { header: t('dashboard.type'), render: r => <Badge color={r.movement_type==='IN'?'green':r.movement_type==='OUT'?'red':'blue'}>{r.movement_type}</Badge> },
            { header: t('dashboard.qty'), render: r => <span className={r.movement_type==='IN'?'text-green-600 font-semibold':'text-red-600 font-semibold'}>{r.movement_type==='IN'?'+':'-'}{formatNumber(r.quantity)} {r.items?.units?.abbreviation || ''}</span> },
            { header: t('bincard.cost'), render: r => formatCurrency(r.unit_cost) },
            { header: t('dashboard.balance'), render: r => <span className="font-semibold">{formatNumber(r.balance_after)}</span> },
            { header: t('bincard.ref'), render: r => <span className="text-xs">{r.reference_number || '-'}<br/><span className="text-gray-400">{r.reference_type || ''}</span></span> },

// ============================================================
// PURCHASE REQUEST PAGE
// ============================================================
function PurchaseRequestPage() {
  const { selectedOrg, showNotification } = useApp();
  const { t } = useTranslation();
  const [prs, setPrs] = useState([]);
  const [departments, setDepartments] = useState([]);
  const [items, setItems] = useState([]);
  const [units, setUnits] = useState([]);
  const [users, setUsers] = useState([]);
  const [loading, setLoading] = useState(true);
  const [showModal, setShowModal] = useState(false);
  const [editing, setEditing] = useState(null);
  const [saving, setSaving] = useState(false);
  const [form, setForm] = useState({ department_id: '', request_date: new Date().toISOString().split('T')[0], needed_date: '', priority: 'NORMAL', notes: '' });
  const [lineItems, setLineItems] = useState([]);
  const [viewDoc, setViewDoc] = useState(null);
  const [viewItems, setViewItems] = useState([]);

  useEffect(() => { if(selectedOrg) loadAll(); }, [selectedOrg]);

  async function loadAll() {
    setLoading(true);
    const [prRes, deptRes, itemRes, unitRes, userRes] = await Promise.all([
      supabase.from('purchase_requests').select('*, departments(name, code)').eq('organization_id', selectedOrg.id).order('created_at', { ascending: false }),
      supabase.from('departments').select('*').eq('organization_id', selectedOrg.id).eq('is_active', true).order('name'),
      supabase.from('items').select('id, code, name, unit_id').eq('is_active', true).order('code'),
      supabase.from('units').select('*').order('name'),
      supabase.from('users').select('id, full_name').order('full_name'),
    ]);
    setPrs(prRes.data || []);
    setDepartments(deptRes.data || []);
    setItems(itemRes.data || []);
    setUnits(unitRes.data || []);
    setUsers(userRes.data || []);
    setLoading(false);
  }

  function getUserName(userId) {
    if (!userId) return '-';
    const u = users.find(u => u.id === userId);
    return u ? u.full_name : '-';
  }

  async function openView(pr) {
    setViewDoc(pr);
    const { data } = await supabase.from('purchase_request_items').select('*, items(code, name)').eq('pr_id', pr.id);
    setViewItems(data || []);
  }

  function openCreate() {
    setEditing(null);
    setForm({ department_id: departments[0]?.id || '', request_date: new Date().toISOString().split('T')[0], needed_date: '', priority: 'NORMAL', notes: '' });
    setLineItems([{ item_id: '', quantity: 1, unit_id: '', estimated_price: 0 }]);
    setShowModal(true);
  }

  async function openEdit(pr) {
    setEditing(pr);
    setForm({ department_id: pr.department_id || '', request_date: pr.request_date, needed_date: pr.needed_date || '', priority: pr.priority, notes: pr.notes || '' });
    const { data: prItems } = await supabase.from('purchase_request_items').select('*').eq('pr_id', pr.id);
    setLineItems((prItems || []).map(i => ({ item_id: i.item_id, quantity: i.quantity, unit_id: i.unit_id || '', estimated_price: i.estimated_price || 0 })));
    if (!prItems || prItems.length === 0) setLineItems([{ item_id: '', quantity: 1, unit_id: '', estimated_price: 0 }]);
    setShowModal(true);
  }

  function addLine() { setLineItems([...lineItems, { item_id: '', quantity: 1, unit_id: '', estimated_price: 0 }]); }
  function removeLine(idx) { setLineItems(lineItems.filter((_, i) => i !== idx)); }
  function updateLine(idx, field, val) { const nl = [...lineItems]; nl[idx] = { ...nl[idx], [field]: val }; setLineItems(nl); }

  async function generatePRNumber() {
    const prefix = `PR-${selectedOrg.code}-`;
    const { data } = await supabase.from('purchase_requests').select('pr_number').eq('organization_id', selectedOrg.id).like('pr_number', prefix + '%').order('created_at', { ascending: false }).limit(1);
    let nextNum = 1;
    if (data && data.length > 0) {
      const lastNum = parseInt(data[0].pr_number.replace(prefix, ''), 10);
      if (!isNaN(lastNum)) nextNum = lastNum + 1;
    }
    return prefix + String(nextNum).padStart(4, '0');
  }

  async function handleSave() {
    if (!form.department_id || lineItems.filter(l => l.item_id).length === 0) return;
    setSaving(true);
    try {
      // Validate request date
      const inputDate = new Date(form.request_date);
      const today = new Date();
      const maxBackdateDays = selectedOrg.max_backdate_days || 3;
      const daysDiff = Math.floor((today - inputDate) / (1000 * 60 * 60 * 24));
      if (daysDiff > maxBackdateDays) {
        showNotification('Request date exceeds maximum backdate limit (' + maxBackdateDays + ' days)', 'error');
        setSaving(false);
        return;
      }

      // Check if period is locked
      const periodMonth = inputDate.getMonth() + 1;
      const periodYear = inputDate.getFullYear();
      const { data: locks } = await supabase.from('period_locks')
        .select('*')
        .eq('organization_id', selectedOrg.id)
        .eq('period_month', periodMonth)
        .eq('period_year', periodYear)
        .eq('is_locked', true)
        .single();
      if (locks) {
        showNotification('Period is locked', 'error');
        setSaving(false);
        return;
      }

      const validLines = lineItems.filter(l => l.item_id);
      const totalEst = validLines.reduce((s, l) => s + (l.quantity * l.estimated_price), 0);
      if (editing) {
        const { error } = await supabase.from('purchase_requests').update({
          department_id: form.department_id, request_date: form.request_date, needed_date: form.needed_date || null,
          priority: form.priority, notes: form.notes || null, total_estimated_amount: totalEst
        }).eq('id', editing.id);
        if (error) throw error;
        await supabase.from('purchase_request_items').delete().eq('pr_id', editing.id);
        const itemsPayload = validLines.map(l => ({
          pr_id: editing.id, item_id: l.item_id, quantity: l.quantity,
          unit_id: l.unit_id || null, estimated_price: l.estimated_price,
          estimated_total: l.quantity * l.estimated_price
        }));
        const { error: itemErr } = await supabase.from('purchase_request_items').insert(itemsPayload);
        if (itemErr) throw itemErr;
      } else {
        const prNumber = await generatePRNumber();
        const { data: newPR, error } = await supabase.from('purchase_requests').insert({
          pr_number: prNumber, organization_id: selectedOrg.id, department_id: form.department_id,
          request_date: form.request_date, needed_date: form.needed_date || null,
          priority: form.priority, status: 'DRAFT', total_estimated_amount: totalEst, notes: form.notes || null
        }).select().single();
        if (error) throw error;
        const itemsPayload = validLines.map(l => ({
          pr_id: newPR.id, item_id: l.item_id, quantity: l.quantity,
          unit_id: l.unit_id || null, estimated_price: l.estimated_price,
          estimated_total: l.quantity * l.estimated_price
        }));
        const { error: itemErr } = await supabase.from('purchase_request_items').insert(itemsPayload);
        if (itemErr) throw itemErr;
      }
      showNotification(t('pr.successSave'));
      setShowModal(false);
      loadAll();
    } catch (err) { showNotification('Error: ' + err.message, 'error'); }
    setSaving(false);
  }

  async function handleDelete(pr) {
    if (pr.status !== 'DRAFT') { showNotification('Cannot delete — status is ' + pr.status, 'error'); return; }
    if (!confirm(t('pr.confirmDelete'))) return;
    try {
      await supabase.from('purchase_request_items').delete().eq('pr_id', pr.id);
      const { error } = await supabase.from('purchase_requests').delete().eq('id', pr.id);
      if (error) throw error;
      showNotification(t('pr.successDelete'));
      loadAll();
    } catch (err) { showNotification('Error: ' + err.message, 'error'); }
  }

  async function submitForApproval(pr) {
    if (!confirm('Submit for approval?')) return;
    const upd = { status: 'PENDING', submitted_by: currentUser?.id, submitted_at: new Date().toISOString() };
    await supabase.from('purchase_requests').update(upd).eq('id', pr.id);
    await supabase.from('approval_logs').insert({
      organization_id: selectedOrg.id, document_type: 'PR', document_id: pr.id,
      document_number: pr.pr_number, action: 'SUBMITTED', action_by: currentUser?.id,
    });
    showNotification(t('pr.title') + ' submitted for approval', 'success');
    loadAll();
  }

  const lineTotal = lineItems.reduce((s, l) => s + (l.quantity * l.estimated_price), 0);

  return (
    <div>
      <PageHeader title={t('pr.title')} subtitle={t('pr.subtitle')}
        actions={<Button onClick={openCreate}><Icons.Plus /> {t('pr.create')}</Button>} />
      <div className="bg-white rounded-xl shadow-sm border border-gray-100">
        <DataTable loading={loading}
          columns={[
            { header: t('pr.number'), render: r => <button onClick={() => openView(r)} className="font-mono text-xs font-semibold text-primary-700 hover:underline cursor-pointer">{r.pr_number}</button> },
            { header: t('common.date'), render: r => new Date(r.request_date).toLocaleDateString('id-ID') },
            { header: t('stock.dept'), render: r => <Badge color="blue">{r.departments?.code}</Badge> },
            { header: t('pr.priority'), render: r => <Badge color={r.priority==='URGENT'?'red':r.priority==='HIGH'?'orange':'gray'}>{r.priority}</Badge> },
            { header: t('pr.estTotal'), render: r => formatCurrency(r.total_estimated_amount) },
            { header: t('common.status'), render: r => <StatusBadge status={r.status}/> },
            { header: t('approval.info'), render: r => r.approved_by ? (
              <div className="text-xs">
                <div className="font-medium text-green-700">{getUserName(r.approved_by)}</div>
                <div className="text-gray-400">{r.approved_at ? new Date(r.approved_at).toLocaleDateString('id-ID') : ''}</div>
              </div>
            ) : r.status === 'PENDING' ? <span className="text-xs text-yellow-600">{t('approval.notApproved')}</span> : <span className="text-xs text-gray-400">-</span> },
          ]}
          data={prs}
          actions={(row) => (
            <div className="flex items-center gap-1">
              {row.status === 'DRAFT' && <button onClick={e=>{e.stopPropagation();submitForApproval(row)}} className="p-1 text-xs bg-blue-50 text-blue-600 rounded hover:bg-blue-100">{t('pr.submit')}</button>}
              {row.status === 'DRAFT' && <button onClick={e=>{e.stopPropagation();openEdit(row)}} className="p-1.5 hover:bg-gray-100 rounded-lg text-gray-500"><Icons.Edit /></button>}
              {row.status === 'DRAFT' && <button onClick={e=>{e.stopPropagation();handleDelete(row)}} className="p-1.5 hover:bg-red-50 rounded-lg text-red-400"><Icons.Trash /></button>}
            </div>
          )}
        />
        {prs.length === 0 && !loading && (
          <div className="p-8 text-center text-gray-500"><Icons.ShoppingCart /><p className="mt-2">{t('pr.empty')}</p></div>
        )}
      </div>

      <Modal open={showModal} onClose={() => setShowModal(false)} title={editing ? 'Edit PR' : t('pr.create')} size="xl">
        <div className="grid grid-cols-1 sm:grid-cols-3 gap-4 mb-4">
          <FormField label={t('stock.dept')} required>
            <Select value={form.department_id} onChange={e => setForm({...form, department_id: e.target.value})}>
              <option value="">Select</option>
              {departments.map(d => <option key={d.id} value={d.id}>{d.code} - {d.name}</option>)}
            </Select>
          </FormField>
          <FormField label={t('common.date')} required>
            <Input type="date" value={form.request_date} onChange={e => setForm({...form, request_date: e.target.value})} />
          </FormField>
          <FormField label={t('pr.neededDate')}>
            <Input type="date" value={form.needed_date} onChange={e => setForm({...form, needed_date: e.target.value})} />
          </FormField>
          <FormField label={t('pr.priority')}>
            <Select value={form.priority} onChange={e => setForm({...form, priority: e.target.value})}>
              <option value="LOW">Low</option>
              <option value="NORMAL">Normal</option>
              <option value="HIGH">High</option>
              <option value="URGENT">Urgent</option>
            </Select>
          </FormField>
          <div className="sm:col-span-2">
            <FormField label={t('bincard.notes')}>
              <Input value={form.notes} onChange={e => setForm({...form, notes: e.target.value})} />
            </FormField>
          </div>
        </div>

        <div className="border-t pt-4">
          <div className="flex justify-between items-center mb-3">
            <h4 className="font-semibold text-sm">{t('pr.addItem')}</h4>
            <button onClick={addLine} className="text-xs text-primary-600 hover:text-primary-800 font-medium">+ {t('pr.addItem')}</button>
          </div>
          <table className="w-full text-sm">
            <thead><tr className="bg-gray-50">
              <th className="p-2 text-left">{t('dashboard.item')}</th>
              <th className="p-2 text-right w-20">{t('pr.qty')}</th>
              <th className="p-2 text-right w-32">{t('pr.estPrice')}</th>
              <th className="p-2 text-right w-32">{t('pr.total')}</th>
              <th className="p-2 w-10"></th>
            </tr></thead>
            <tbody>
              {lineItems.map((line, idx) => (
                <tr key={idx} className="border-b">
                  <td className="p-2">
                    <SearchableItemSelect items={items} value={line.item_id} onChange={v => updateLine(idx, 'item_id', v)} placeholder={t('pr.selectItem')} />
                  </td>
                  <td className="p-2"><input type="number" value={line.quantity} onChange={e => updateLine(idx, 'quantity', parseFloat(e.target.value)||0)}
                    className="w-full px-2 py-1 border rounded text-sm text-right" min="1" /></td>
                  <td className="p-2"><input type="number" value={line.estimated_price} onChange={e => updateLine(idx, 'estimated_price', parseFloat(e.target.value)||0)}
                    className="w-full px-2 py-1 border rounded text-sm text-right" min="0" /></td>
                  <td className="p-2 text-right font-medium">{formatCurrency(line.quantity * line.estimated_price)}</td>
                  <td className="p-2">{lineItems.length > 1 && <button onClick={() => removeLine(idx)} className="text-red-400 hover:text-red-600"><Icons.Trash /></button>}</td>
                </tr>
              ))}
            </tbody>
            <tfoot><tr className="bg-gray-50 font-semibold">
              <td colSpan="3" className="p-2 text-right">{t('pr.estTotal')}:</td>
              <td className="p-2 text-right">{formatCurrency(lineTotal)}</td>
              <td></td>
            </tr></tfoot>
          </table>
        </div>

        <div className="flex justify-end gap-3 mt-6 pt-4 border-t">
          <Button variant="secondary" onClick={() => setShowModal(false)}>{t('common.cancel')}</Button>
          <Button onClick={handleSave} disabled={saving}>{editing ? t('common.update') : t('common.save')}</Button>
        </div>
      </Modal>

      {viewDoc && (
        <Modal open={!!viewDoc} onClose={() => setViewDoc(null)} title={`PR Details: ${viewDoc.pr_number}`} size="lg">
          <div className="space-y-4">
            <div className="grid grid-cols-2 gap-4 bg-gray-50 p-4 rounded">
              <div>
                <p className="text-xs text-gray-500">{t('pr.number')}</p>
                <p className="font-semibold">{viewDoc.pr_number}</p>
              </div>
              <div>
                <p className="text-xs text-gray-500">{t('common.date')}</p>
                <p className="font-semibold">{new Date(viewDoc.request_date).toLocaleDateString('id-ID')}</p>
              </div>
              <div>
                <p className="text-xs text-gray-500">{t('stock.dept')}</p>
                <p className="font-semibold">{viewDoc.departments?.name}</p>
              </div>
              <div>
                <p className="text-xs text-gray-500">{t('pr.priority')}</p>
                <Badge color={viewDoc.priority==='URGENT'?'red':viewDoc.priority==='HIGH'?'orange':'gray'}>{viewDoc.priority}</Badge>
              </div>
              <div>
                <p className="text-xs text-gray-500">{t('common.status')}</p>
                <StatusBadge status={viewDoc.status} />
              </div>
              <div>
                <p className="text-xs text-gray-500">{t('approval.info')}</p>
                <p className="text-sm">{viewDoc.approved_by ? getUserName(viewDoc.approved_by) : '-'}</p>
              </div>
              {viewDoc.needed_date && (
                <div>
                  <p className="text-xs text-gray-500">{t('pr.neededDate')}</p>
                  <p className="font-semibold">{new Date(viewDoc.needed_date).toLocaleDateString('id-ID')}</p>
                </div>
              )}
              {viewDoc.notes && (
                <div className="col-span-2">
                  <p className="text-xs text-gray-500">{t('bincard.notes')}</p>
                  <p className="text-sm">{viewDoc.notes}</p>
                </div>
              )}
            </div>
            {viewItems.length > 0 && (
              <div>
                <h4 className="font-semibold mb-2">{t('pr.items')}</h4>
                <table className="w-full text-sm">
                  <thead className="bg-gray-50">
                    <tr>
                      <th className="text-left p-2">{t('dashboard.item')}</th>
                      <th className="text-right p-2">{t('pr.qty')}</th>
                      <th className="text-right p-2">{t('pr.estPrice')}</th>
                      <th className="text-right p-2">{t('pr.total')}</th>
                    </tr>
                  </thead>
                  <tbody>
                    {viewItems.map((item, idx) => (
                      <tr key={idx} className="border-b">
                        <td className="p-2"><span className="font-mono text-xs">{item.items?.code}</span> - {item.items?.name}</td>
                        <td className="p-2 text-right">{formatNumber(item.quantity)}</td>
                        <td className="p-2 text-right">{formatCurrency(item.estimated_price)}</td>
                        <td className="p-2 text-right font-medium">{formatCurrency(item.quantity * item.estimated_price)}</td>
                      </tr>
                    ))}
                  </tbody>
                </table>
              </div>
            )}
          </div>
          <div className="flex justify-end gap-3 mt-6 pt-4 border-t">
            <Button variant="secondary" onClick={() => setViewDoc(null)}>{t('common.close')}</Button>
          </div>
        </Modal>
      )}
    </div>
  );
}

    if (!form.vendor_id || lineItems.filter(l => l.item_id).length === 0) return;

    try {
      // Validate order date
      const inputDate = new Date(form.order_date);

      if (daysDiff > maxBackdateDays) {
        showNotification('Order date exceeds maximum backdate limit (' + maxBackdateDays + ' days)', 'error');
        setSaving(false);
        return;
      }

      // Check if period is locked
      const periodMonth = inputDate.getMonth() + 1;
      const periodYear = inputDate.getFullYear();
      const { data: locks } = await supabase.from('period_locks')
        .select('*')
        .eq('organization_id', selectedOrg.id)
        .eq('period_month', periodMonth)
        .eq('period_year', periodYear)
        .eq('is_locked', true)
        .single();
      if (locks) {
        showNotification('Period is locked', 'error');
        setSaving(false);
        return;
      }

      const validLines = lineItems.filter(l => l.item_id);
      const subtotal = validLines.reduce((s, l) => s + (l.quantity * l.unit_price), 0);
      const totalDiscount = validLines.reduce((s, l) => s + (l.quantity * l.unit_price * l.discount_percent / 100), 0);
      const afterDiscTotal = subtotal - totalDiscount;
      const totalTax = validLines.reduce((s, l) => {
        const base = l.quantity * l.unit_price;
        const disc = base * (l.discount_percent / 100);
        return s + ((base - disc) * l.tax_percent / 100);
      }, 0);
      const totalAmount = afterDiscTotal + totalTax;

      if (editing) {
        const { error } = await supabase.from('purchase_orders').update({
          vendor_id: form.vendor_id, order_date: form.order_date, expected_delivery: form.expected_delivery || null,
          payment_terms: form.payment_terms || null, notes: form.notes || null,
          subtotal, discount_amount: totalDiscount, tax_amount: totalTax, total_amount: totalAmount
        }).eq('id', editing.id);
        if (error) throw error;
        await supabase.from('purchase_order_items').delete().eq('po_id', editing.id);
        const itemsPayload = validLines.map(l => ({
          po_id: editing.id, item_id: l.item_id, quantity: l.quantity,
          unit_price: l.unit_price, discount_percent: l.discount_percent, tax_percent: l.tax_percent,
          total_price: calcLineTotal(l)
        }));
        const { error: itemErr } = await supabase.from('purchase_order_items').insert(itemsPayload);
        if (itemErr) throw itemErr;
      } else {
        const poNumber = await generatePONumber();
        const { data: newPO, error } = await supabase.from('purchase_orders').insert({
          po_number: poNumber, organization_id: selectedOrg.id, vendor_id: form.vendor_id,
          order_date: form.order_date, expected_delivery: form.expected_delivery || null,
          payment_terms: form.payment_terms || null, status: 'DRAFT', notes: form.notes || null,
          subtotal, discount_amount: totalDiscount, tax_amount: totalTax, total_amount: totalAmount
        }).select().single();
        if (error) throw error;
        const itemsPayload = validLines.map(l => ({
          po_id: newPO.id, item_id: l.item_id, quantity: l.quantity,
          unit_price: l.unit_price, discount_percent: l.discount_percent, tax_percent: l.tax_percent,
          total_price: calcLineTotal(l)
        }));
        const { error: itemErr } = await supabase.from('purchase_order_items').insert(itemsPayload);
        if (itemErr) throw itemErr;
      }
      showNotification(t('po.successSave'));
      setShowModal(false);
      loadAll();
    } catch (err) { showNotification('Error: ' + err.message, 'error'); }
    setSaving(false);
  }

  async function handleDelete(po) {
    if (po.status !== 'DRAFT') { showNotification('Cannot delete — status is ' + po.status, 'error'); return; }
    if (!confirm(t('po.confirmDelete'))) return;
    try {
      await supabase.from('purchase_order_items').delete().eq('po_id', po.id);
      const { error } = await supabase.from('purchase_orders').delete().eq('id', po.id);
      if (error) throw error;
      showNotification(t('po.successDelete'));
      loadAll();
    } catch (err) { showNotification('Error: ' + err.message, 'error'); }
  }

  async function submitForApproval(po) {
    if (!confirm('Submit for approval?')) return;
    const upd = { status: 'PENDING', submitted_by: currentUser?.id, submitted_at: new Date().toISOString() };
    await supabase.from('purchase_orders').update(upd).eq('id', po.id);
    await supabase.from('approval_logs').insert({
      organization_id: selectedOrg.id, document_type: 'PO', document_id: po.id,
      document_number: po.po_number, action: 'SUBMITTED', action_by: currentUser?.id,
    });
    showNotification(t('po.title') + ' submitted for approval', 'success');
    loadAll();
  }
  async function updateStatus(po, newStatus) {
    await supabase.from('purchase_orders').update({ status: newStatus }).eq('id', po.id);
    showNotification(t('po.title') + ' → ' + newStatus);
    loadAll();
  }

  const grandSubtotal = lineItems.reduce((s, l) => s + (l.quantity * l.unit_price), 0);
  const grandDiscount = lineItems.reduce((s, l) => s + (l.quantity * l.unit_price * l.discount_percent / 100), 0);
  const grandTax = lineItems.reduce((s, l) => { const b = l.quantity * l.unit_price; const d = b * (l.discount_percent/100); return s + ((b-d) * l.tax_percent / 100); }, 0);
  const grandTotal = grandSubtotal - grandDiscount + grandTax;

  return (
    <div>
      <PageHeader title={t('po.title')} subtitle={t('po.subtitle')}
        actions={<Button onClick={openCreate}><Icons.Plus /> {t('po.create')}</Button>} />
      <div className="bg-white rounded-xl shadow-sm border border-gray-100">
        <DataTable loading={loading}
          columns={[
            { header: t('po.number'), render: r => <button onClick={() => openView(r)} className="font-mono text-xs font-semibold text-primary-700 hover:underline cursor-pointer">{r.po_number}</button> },
            { header: t('po.orderDate'), render: r => new Date(r.order_date).toLocaleDateString('id-ID') },
            { header: t('po.vendor'), render: r => r.vendors?.name || '-' },
            { header: t('po.expectedDelivery'), render: r => r.expected_delivery ? new Date(r.expected_delivery).toLocaleDateString('id-ID') : '-' },
            { header: t('po.totalAmount'), render: r => formatCurrency(r.total_amount) },
            { header: t('common.status'), render: r => <StatusBadge status={r.status}/> },
            { header: t('approval.info'), render: r => r.approved_by ? (
              <div className="text-xs">
                <div className="font-medium text-green-700">{getUserName(r.approved_by)}</div>
                <div className="text-gray-400">{r.approved_at ? new Date(r.approved_at).toLocaleDateString('id-ID') : ''}</div>
              </div>
            ) : r.status === 'PENDING' ? <span className="text-xs text-yellow-600">{t('approval.notApproved')}</span> : <span className="text-xs text-gray-400">-</span> },
          ]}
          data={pos}
          actions={(row) => (
            <div className="flex items-center gap-1">
              {row.status === 'DRAFT' && <button onClick={e=>{e.stopPropagation();submitForApproval(row)}} className="p-1 text-xs bg-blue-50 text-blue-600 rounded hover:bg-blue-100">{t('po.submit')}</button>}
              {row.status === 'APPROVED' && <button onClick={e=>{e.stopPropagation();updateStatus(row,'SENT')}} className="p-1 text-xs bg-indigo-50 text-indigo-600 rounded hover:bg-indigo-100">{t('po.send')}</button>}
              {row.status === 'SENT' && <button onClick={e=>{e.stopPropagation();updateStatus(row,'RECEIVED')}} className="p-1 text-xs bg-emerald-50 text-emerald-600 rounded hover:bg-emerald-100">{t('po.receive')}</button>}
              {row.status === 'DRAFT' && <button onClick={e=>{e.stopPropagation();openEdit(row)}} className="p-1.5 hover:bg-gray-100 rounded-lg text-gray-500"><Icons.Edit /></button>}
              {row.status === 'DRAFT' && <button onClick={e=>{e.stopPropagation();handleDelete(row)}} className="p-1.5 hover:bg-red-50 rounded-lg text-red-400"><Icons.Trash /></button>}
            </div>
          )}
        />
        {pos.length === 0 && !loading && (
          <div className="p-8 text-center text-gray-500"><Icons.ShoppingCart /><p className="mt-2">{t('po.empty')}</p></div>
        )}
      </div>

      <Modal open={showModal} onClose={() => setShowModal(false)} title={editing ? 'Edit PO' : t('po.create')} size="xl">
        <div className="grid grid-cols-1 sm:grid-cols-3 gap-4 mb-4">
          <FormField label={t('po.vendor')} required>
            <Select value={form.vendor_id} onChange={e => setForm({...form, vendor_id: e.target.value})}>
              <option value="">{t('po.selectVendor')}</option>
              {vendors.map(v => <option key={v.id} value={v.id}>{v.code} - {v.name}</option>)}
            </Select>
          </FormField>
          <FormField label={t('po.orderDate')} required>
            <Input type="date" value={form.order_date} onChange={e => setForm({...form, order_date: e.target.value})} />
          </FormField>
          <FormField label={t('po.expectedDelivery')}>
            <Input type="date" value={form.expected_delivery} onChange={e => setForm({...form, expected_delivery: e.target.value})} />
          </FormField>
          <FormField label={t('po.paymentTerms')}>
            <Input value={form.payment_terms} onChange={e => setForm({...form, payment_terms: e.target.value})} placeholder="e.g. NET 30" />
          </FormField>
          <div className="sm:col-span-2">
            <FormField label={t('po.notes')}>
              <Input value={form.notes} onChange={e => setForm({...form, notes: e.target.value})} />
            </FormField>
          </div>
        </div>

        <div className="border-t pt-4">
          <div className="flex justify-between items-center mb-3">
            <h4 className="font-semibold text-sm">{t('po.addItem')}</h4>
            <button onClick={addLine} className="text-xs text-primary-600 hover:text-primary-800 font-medium">+ {t('po.addItem')}</button>
          </div>
          <div className="overflow-x-auto">
            <table className="w-full text-sm">
              <thead><tr className="bg-gray-50">
                <th className="p-2 text-left">{t('dashboard.item')}</th>
                <th className="p-2 text-right w-16">{t('po.qty')}</th>
                <th className="p-2 text-right w-28">{t('po.unitPrice')}</th>
                <th className="p-2 text-right w-16">{t('po.discount')}</th>
                <th className="p-2 text-right w-16">{t('po.tax')}</th>
                <th className="p-2 text-right w-28">{t('po.lineTotal')}</th>
                <th className="p-2 w-10"></th>
              </tr></thead>
              <tbody>
                {lineItems.map((line, idx) => (
                  <tr key={idx} className="border-b">
                    <td className="p-2">
                      <SearchableItemSelect items={items} value={line.item_id} onChange={v => updateLine(idx, 'item_id', v)} placeholder={t('pr.selectItem')} />
                    </td>
                    <td className="p-2"><input type="number" value={line.quantity} onChange={e => updateLine(idx, 'quantity', parseFloat(e.target.value)||0)}
                      className="w-full px-2 py-1 border rounded text-sm text-right" min="1" /></td>
                    <td className="p-2"><input type="number" value={line.unit_price} onChange={e => updateLine(idx, 'unit_price', parseFloat(e.target.value)||0)}
                      className="w-full px-2 py-1 border rounded text-sm text-right" min="0" /></td>
                    <td className="p-2"><input type="number" value={line.discount_percent} onChange={e => updateLine(idx, 'discount_percent', parseFloat(e.target.value)||0)}
                      className="w-full px-2 py-1 border rounded text-sm text-right" min="0" max="100" /></td>
                    <td className="p-2"><input type="number" value={line.tax_percent} onChange={e => updateLine(idx, 'tax_percent', parseFloat(e.target.value)||0)}
                      className="w-full px-2 py-1 border rounded text-sm text-right" min="0" max="100" /></td>
                    <td className="p-2 text-right font-medium">{formatCurrency(calcLineTotal(line))}</td>
                    <td className="p-2">{lineItems.length > 1 && <button onClick={() => removeLine(idx)} className="text-red-400 hover:text-red-600"><Icons.Trash /></button>}</td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
          <div className="mt-3 flex flex-col items-end gap-1 text-sm">
            <div className="flex gap-4"><span className="text-gray-500">{t('po.subtotal')}:</span><span className="w-28 text-right">{formatCurrency(grandSubtotal)}</span></div>
            <div className="flex gap-4"><span className="text-gray-500">{t('po.discountAmount')}:</span><span className="w-28 text-right text-red-500">-{formatCurrency(grandDiscount)}</span></div>
            <div className="flex gap-4"><span className="text-gray-500">{t('po.taxAmount')}:</span><span className="w-28 text-right">+{formatCurrency(grandTax)}</span></div>
            <div className="flex gap-4 font-bold text-base border-t pt-1"><span>{t('po.totalAmount')}:</span><span className="w-28 text-right">{formatCurrency(grandTotal)}</span></div>
          </div>
        </div>

        <div className="flex justify-end gap-3 mt-6 pt-4 border-t">
          <Button variant="secondary" onClick={() => setShowModal(false)}>{t('common.cancel')}</Button>
          <Button onClick={handleSave} disabled={saving}>{editing ? t('common.update') : t('common.save')}</Button>
        </div>
      </Modal>

      {viewDoc && (
        <Modal open={!!viewDoc} onClose={() => setViewDoc(null)} title={`PO Details: ${viewDoc.po_number}`} size="lg">
          <div className="space-y-4">
            <div className="grid grid-cols-2 gap-4 bg-gray-50 p-4 rounded">
              <div>
                <p className="text-xs text-gray-500">{t('po.number')}</p>
                <p className="font-semibold">{viewDoc.po_number}</p>
              </div>
              <div>
                <p className="text-xs text-gray-500">{t('po.orderDate')}</p>
                <p className="font-semibold">{new Date(viewDoc.order_date).toLocaleDateString('id-ID')}</p>
              </div>
              <div>
                <p className="text-xs text-gray-500">{t('po.vendor')}</p>
                <p className="font-semibold">{viewDoc.vendors?.name}</p>
              </div>
              <div>
                <p className="text-xs text-gray-500">{t('common.status')}</p>
                <StatusBadge status={viewDoc.status} />
              </div>
              {viewDoc.expected_delivery && (
                <div>
                  <p className="text-xs text-gray-500">{t('po.expectedDelivery')}</p>
                  <p className="font-semibold">{new Date(viewDoc.expected_delivery).toLocaleDateString('id-ID')}</p>
                </div>
              )}
              {viewDoc.payment_terms && (
                <div>
                  <p className="text-xs text-gray-500">{t('po.paymentTerms')}</p>
                  <p className="font-semibold">{viewDoc.payment_terms}</p>
                </div>
              )}
              {viewDoc.notes && (
                <div className="col-span-2">
                  <p className="text-xs text-gray-500">{t('po.notes')}</p>
                  <p className="text-sm">{viewDoc.notes}</p>
                </div>
              )}
            </div>
            {viewItems.length > 0 && (
              <div>
                <h4 className="font-semibold mb-2">{t('po.items')}</h4>
                <table className="w-full text-sm">
                  <thead className="bg-gray-50">
                    <tr>
                      <th className="text-left p-2">{t('dashboard.item')}</th>
                      <th className="text-right p-2">{t('po.qty')}</th>
                      <th className="text-right p-2">{t('po.unitPrice')}</th>
                      <th className="text-right p-2">{t('po.lineTotal')}</th>
                    </tr>
                  </thead>
                  <tbody>
                    {viewItems.map((item, idx) => (
                      <tr key={idx} className="border-b">
                        <td className="p-2"><span className="font-mono text-xs">{item.items?.code}</span> - {item.items?.name}</td>
                        <td className="p-2 text-right">{formatNumber(item.quantity)}</td>
                        <td className="p-2 text-right">{formatCurrency(item.unit_price)}</td>
                        <td className="p-2 text-right font-medium">{formatCurrency(item.total_price)}</td>
                      </tr>
                    ))}
                  </tbody>
                </table>
              </div>
            )}
          </div>
          <div className="flex justify-end gap-3 mt-6 pt-4 border-t">
            <Button variant="secondary" onClick={() => setViewDoc(null)}>{t('common.close')}</Button>
          </div>
        </Modal>
      )}
    </div>
  );
}

// ============================================================
// STOCK OPNAME PAGE
// ============================================================
function StockOpnamePage() {
  const { selectedOrg, currentUser, showNotification } = useApp();
  const { t } = useTranslation();
  const [opnames, setOpnames] = useState([]);
  const [categories, setCategories] = useState([]);
  const [items, setItems] = useState([]);
  const [users, setUsers] = useState([]);
  const [departments, setDepartments] = useState([]);
  const [loading, setLoading] = useState(true);
  const [showCreateModal, setShowCreateModal] = useState(false);
  const [showCountingModal, setShowCountingModal] = useState(false);
  const [countingOpname, setCountingOpname] = useState(null);
  const [countingDetails, setCountingDetails] = useState([]);
  const [saving, setSaving] = useState(false);

  // Create form state
  const [createForm, setCreateForm] = useState({
    category_id: '',
    assigned_to: '',
    opname_date: new Date().toISOString().split('T')[0],
    notes: ''
  });
  const [selectedItems, setSelectedItems] = useState([]);
  const [categoryItems, setCategoryItems] = useState([]);

  useEffect(() => { if(selectedOrg) loadAll(); }, [selectedOrg]);

  async function loadAll() {
    setLoading(true);
    try {
      const [opRes, catRes, itemRes, usrRes, deptRes] = await Promise.all([
        supabase.from('stock_opname').select('*').eq('organization_id', selectedOrg.id).order('created_at', { ascending: false }),
        supabase.from('item_categories').select('*').eq('is_active', true).order('name'),
        supabase.from('items').select('*').eq('is_active', true).order('code'),
        supabase.from('users').select('*, roles:role_id(code, name)').eq('is_active', true).order('full_name'),
        supabase.from('departments').select('*').eq('organization_id', selectedOrg.id).eq('is_active', true).order('name'),
      ]);
