// ============================================================
// PASSWORD HASHING (SHA-256)
// ============================================================
async function hashPassword(password) {
  const encoder = new TextEncoder();
  const data = encoder.encode(password + '_inventory_salt_2024');
  const hashBuffer = await crypto.subtle.digest('SHA-256', data);
  const hashArray = Array.from(new Uint8Array(hashBuffer));
  return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
}

function canAccessPage(roleCode, pageId, rolePermissions) {
  if (!roleCode) return false;
  // change-password is always accessible to any logged-in user
  if (pageId === 'change-password') return true;
  // If role has dynamic permissions from DB, use those
  if (rolePermissions) {
    // { all: true } means full access
    if (rolePermissions.all === true) return true;
    // Check menu_access
    if (rolePermissions.menu_access) {
      return !!rolePermissions.menu_access[pageId];
    }
    // If permissions object exists but no menu_access and not all:true, deny everything
    return false;
  }
  // Fallback to hardcoded ROLE_PAGE_ACCESS for roles without DB permissions
  const access = ROLE_PAGE_ACCESS[roleCode];
  if (!access) return false;
  if (access === '*') return true;
  return access.includes(pageId);
}

// LANGUAGE CONTEXT

const LanguageContext = React.createContext(null);

function LanguageProvider({ children }) {
  const [lang, setLang] = React.useState(() => localStorage.getItem('inventory_lang') || 'en');

  function t(key) {
    return translations[lang]?.[key] || translations['en']?.[key] || key;
  }

  function toggleLanguage() {
    const newLang = lang === 'en' ? 'zh' : 'en';
    setLang(newLang);
    localStorage.setItem('inventory_lang', newLang);
    document.documentElement.lang = newLang;
  }

  React.useEffect(() => {
    document.documentElement.lang = lang;
  }, [lang]);

  return React.createElement(LanguageContext.Provider, { value: { lang, setLang, t, toggleLanguage } }, children);
}

function useTranslation() { return React.useContext(LanguageContext); }

// ============================================================
// STATE MANAGEMENT
// ============================================================
const { useState, useEffect, useCallback, createContext, useContext, useRef } = React;

const AppContext = createContext(null);

function useApp() { return useContext(AppContext); }

// ============================================================
// MAIN APP COMPONENT
// ============================================================
function App() {
  const { t, lang, toggleLanguage } = useTranslation();
  const [currentPage, setCurrentPage] = useState('dashboard');
  const [sidebarOpen, setSidebarOpen] = useState(true);
  const [mobileSidebar, setMobileSidebar] = useState(false);
  const [selectedOrg, setSelectedOrg] = useState(null);
  const [organizations, setOrganizations] = useState([]);
  const [loading, setLoading] = useState(true);
  const [notification, setNotification] = useState(null);
  const [expandedGroups, setExpandedGroups] = useState(['Master', 'Rooms', 'Purchase Management', 'Stock Management', 'Settings', '主数据', '客房', '采购管理', '库存管理', '设置']);
  const [pendingApprovalCount, setPendingApprovalCount] = useState(0);

  // Auth state
  const [currentUser, setCurrentUser] = useState(() => {
    const saved = localStorage.getItem('inventory_user');
    return saved ? JSON.parse(saved) : null;
  });
  const [showForceChangePassword, setShowForceChangePassword] = useState(false);

  // Refresh role permissions from DB when app loads with saved user
  async function refreshRolePermissions(user) {
    if (!user?.role?.id) return;
    try {
      const { data: role } = await supabase.from('roles').select('permissions').eq('id', user.role.id).single();
      if (role && role.permissions !== undefined) {
        const updated = { ...user, role: { ...user.role, permissions: role.permissions } };
        setCurrentUser(updated);
        localStorage.setItem('inventory_user', JSON.stringify(updated));
      }
    } catch (err) { console.error('Error refreshing permissions:', err); }
  }

  useEffect(() => {
    if (currentUser) {
      loadOrganizations();
      refreshRolePermissions(currentUser);
      if (currentUser.must_change_password) setShowForceChangePassword(true);
    } else {
      setLoading(false);
    }
  }, [currentUser?.id]);

  async function handleLogin(username, password) {
    // Try default password check first
    const defaultCheck = 'default_' + password;
    const hashedPassword = await hashPassword(password);

    const { data: user, error } = await supabase.from('users').select('*, roles:role_id(id, code, name, permissions)').eq('username', username).eq('is_active', true).single();
    if (error || !user) return false;

    // Check password: either default format or hashed
    if (user.password_hash !== defaultCheck && user.password_hash !== hashedPassword) return false;

    // Update last_login
    await supabase.from('users').update({ last_login: new Date().toISOString() }).eq('id', user.id);

    // Load user's hotel access
    const { data: accessData } = await supabase.from('user_hotel_access').select('organization_id').eq('user_id', user.id);
    user.hotel_access = (accessData || []).map(a => a.organization_id);

    const userData = { id: user.id, username: user.username, full_name: user.full_name, role: { ...user.roles, permissions: user.roles?.permissions || null }, must_change_password: user.must_change_password, hotel_access: user.hotel_access, organization_id: user.organization_id };
    setCurrentUser(userData);
    localStorage.setItem('inventory_user', JSON.stringify(userData));
    if (user.must_change_password) setShowForceChangePassword(true);
    return true;
  }

  function handleLogout() {
    setCurrentUser(null);
    localStorage.removeItem('inventory_user');
    setCurrentPage('dashboard');
    setShowForceChangePassword(false);
    setLoading(false);
  }

  async function handleForceChangePassword(newPassword) {
    const hashed = await hashPassword(newPassword);
    const { error } = await supabase.from('users').update({ password_hash: hashed, must_change_password: false }).eq('id', currentUser.id);
    if (error) throw error;
    const updated = { ...currentUser, must_change_password: false };
    setCurrentUser(updated);
    localStorage.setItem('inventory_user', JSON.stringify(updated));
    setShowForceChangePassword(false);
  }

  async function loadOrganizations() {
    try {
      const { data, error } = await supabase.from('organizations').select('*').order('name');
      if (error) throw error;
      // Filter by user's hotel access if not superadmin
      let filteredOrgs = data || [];
      if (currentUser?.role?.code !== 'superadmin' && currentUser?.hotel_access?.length > 0) {
        filteredOrgs = filteredOrgs.filter(o => currentUser.hotel_access.includes(o.id));
      }
      setOrganizations(filteredOrgs);
      if (filteredOrgs.length > 0) setSelectedOrg(filteredOrgs[0]);
    } catch (err) {
      console.error('Error loading organizations:', err);
      showNotification('Error loading organizations: ' + err.message, 'error');
    } finally {
      setLoading(false);
    }
  }

  function showNotification(message, type = 'success') {
    setNotification({ message, type });
    setTimeout(() => setNotification(null), 4000);
  }

  // Fetch pending approval count
  async function loadPendingApprovalCount() {
    if (!selectedOrg) return;
    const userRole = currentUser?.role?.code;
    if (!['superadmin','gm','findir'].includes(userRole)) { setPendingApprovalCount(0); return; }
    try {
      const [prRes, poRes, piRes, woRes, opnRes] = await Promise.all([
        supabase.from('purchase_requests').select('id', { count: 'exact', head: true }).eq('organization_id', selectedOrg.id).eq('status', 'PENDING'),
        supabase.from('purchase_orders').select('id', { count: 'exact', head: true }).eq('organization_id', selectedOrg.id).eq('status', 'PENDING'),
        supabase.from('purchase_invoices').select('id', { count: 'exact', head: true }).eq('organization_id', selectedOrg.id).eq('status', 'PENDING'),
        supabase.from('write_offs').select('id', { count: 'exact', head: true }).eq('organization_id', selectedOrg.id).eq('status', 'PENDING'),
        supabase.from('stock_opname').select('id', { count: 'exact', head: true }).eq('organization_id', selectedOrg.id).eq('status', 'SUBMITTED'),
      ]);
      setPendingApprovalCount((prRes.count||0) + (poRes.count||0) + (piRes.count||0) + (woRes.count||0) + (opnRes.count||0));
    } catch(e) { console.error('Error counting pending approvals:', e); }
  }

  useEffect(() => { loadPendingApprovalCount(); }, [selectedOrg?.id, currentPage]);

  // Auto-lock previous period if past grace period
  useEffect(() => {
    if (selectedOrg) {
      const gracePeriodDays = selectedOrg.grace_period_days || 3;
      const autoLock = async () => {
        const today = new Date();
        const dayOfMonth = today.getDate();
        if (dayOfMonth > gracePeriodDays) {
          const prevDate = new Date(today);
          prevDate.setMonth(prevDate.getMonth() - 1);
          const prevMonth = prevDate.getMonth() + 1;
          const prevYear = prevDate.getFullYear();
          try {
            const { data: existing } = await supabase.from('period_locks')
              .select('id')
              .eq('organization_id', selectedOrg.id)
              .eq('period_month', prevMonth)
              .eq('period_year', prevYear)
              .single();
            if (!existing) {
              await supabase.from('period_locks').insert({
                organization_id: selectedOrg.id,
                period_month: prevMonth,
                period_year: prevYear,
                lock_type: 'AUTO',
                is_locked: true,
                locked_at: new Date().toISOString(),
                created_at: new Date().toISOString()
              });
            }
          } catch (err) {
            console.error('Auto-lock error:', err);
          }
        }
      };
      autoLock();
    }
  }, [selectedOrg?.id]);

  const contextValue = { supabase, selectedOrg, setSelectedOrg, organizations, showNotification, currentPage, setCurrentPage, currentUser, handleLogout };

  // Show login page if not authenticated
  if (!currentUser) {
    return <LoginPage onLogin={handleLogin} />;
  }

  // Show force change password if required
  if (showForceChangePassword) {
    return <ForceChangePasswordPage onChangePassword={handleForceChangePassword} onLogout={handleLogout} />;
  }

  if (loading) {
    return (
      <div className="h-full flex items-center justify-center bg-gray-50">
        <div className="text-center">
          <div className="spinner mx-auto mb-4"></div>
          <p className="text-gray-500">{t('app.loading')}</p>
        </div>
      </div>
    );
  }

  // Filter menu by role access
  const userRoleCode = currentUser?.role?.code || '';
  const userRolePermissions = currentUser?.role?.permissions || null;

  const menuGroups = [
    { type: 'item', id: 'dashboard', label: t('menu.dashboard'), icon: Icons.Dashboard },
    { type: 'group', label: t('menu.group.globalMaster'), icon: Icons.Package, children: [
      { id: 'hotels', label: t('menu.hotels'), icon: Icons.Building },
      { id: 'departments', label: t('menu.departments'), icon: Icons.Building },
      { id: 'items', label: t('menu.items'), icon: Icons.Package },
      { id: 'categories', label: t('menu.categories'), icon: Icons.Tag },
      { id: 'vendors', label: t('menu.vendors'), icon: Icons.Truck },
      { id: 'room-types', label: t('menu.roomTypes'), icon: Icons.Tag },
      { id: 'bed-formations', label: t('menu.bedFormations'), icon: Icons.Bed },
    ]},
    { type: 'group', label: t('menu.group.hotelMaster'), icon: Icons.Building, children: [
      { id: 'warehouses', label: t('menu.warehouses'), icon: Icons.Warehouse },
      { id: 'rooms', label: t('menu.rooms'), icon: Icons.Door },
    ]},
    { type: 'item', id: 'room-makeup', label: t('menu.roomMakeup'), icon: Icons.ClipboardList },
    { type: 'group', label: t('menu.group.purchase'), icon: Icons.ShoppingCart, children: [
      { id: 'pr', label: t('menu.pr'), icon: Icons.ShoppingCart },
      { id: 'po', label: t('menu.po'), icon: Icons.ShoppingCart },
      { id: 'pi', label: t('menu.pi'), icon: Icons.ClipboardList },
    ]},
    { type: 'group', label: t('menu.group.stockIn'), icon: Icons.Truck, children: [
      { id: 'gr', label: t('menu.gr'), icon: Icons.Truck },
      { id: 'direct-purchase', label: t('menu.directPurchase'), icon: Icons.ShoppingCart },
    ]},
    { type: 'group', label: t('menu.group.stockOut'), icon: Icons.Package, children: [
      { id: 'single-usage', label: t('menu.singleUsage'), icon: Icons.Package },
    ]},
    { type: 'group', label: t('menu.group.stock'), icon: Icons.Database, children: [
      { id: 'opening-balance', label: t('ob.menu'), icon: Icons.Scale },
      { id: 'stock', label: t('menu.stock'), icon: Icons.Database },
      { id: 'movements', label: t('menu.movements'), icon: Icons.ClipboardList },
      { id: 'opname', label: t('menu.opname'), icon: Icons.ClipboardList },
      { id: 'transfer', label: t('menu.transfer'), icon: Icons.Truck },
      { id: 'writeoff', label: t('menu.writeoff'), icon: Icons.Trash },
      { id: 'in-use-warehouse', label: t('menu.inUseWarehouse'), icon: Icons.Warehouse },
    ]},
    { type: 'item', id: 'approval', label: t('menu.approval'), icon: Icons.Shield, badge: pendingApprovalCount },
    { type: 'item', id: 'reports', label: t('menu.reports'), icon: Icons.BarChart },
    { type: 'group', label: t('menu.group.settings'), icon: Icons.Settings, children: [
      { id: 'user-mgmt', label: t('menu.userMgmt'), icon: Icons.Users },
      { id: 'role-mgmt', label: t('menu.roleMgmt'), icon: Icons.Shield },
      { id: 'change-password', label: t('menu.changePassword'), icon: Icons.Lock },
    ]},
  ];

  // Filter menu by role access (uses DB permissions if available, falls back to hardcoded)
  const filteredMenuGroups = menuGroups.map(g => {
    if (g.type === 'group') {
      const filteredChildren = g.children.filter(c => canAccessPage(userRoleCode, c.id, userRolePermissions));
      return filteredChildren.length > 0 ? { ...g, children: filteredChildren } : null;
    }
    return canAccessPage(userRoleCode, g.id, userRolePermissions) ? g : null;
  }).filter(Boolean);

  // Flat list for lookups (header title etc.)
  const allMenuItems = filteredMenuGroups.flatMap(g => g.type === 'group' ? g.children : [g]);

  function toggleGroup(label) {
    setExpandedGroups(prev => prev.includes(label) ? prev.filter(l => l !== label) : [...prev, label]);
  }

  return (
    <AppContext.Provider value={contextValue}>
      <div className="h-full flex overflow-hidden">
        {/* Mobile sidebar overlay */}
        {mobileSidebar && (
          <div className="fixed inset-0 bg-black bg-opacity-50 z-40 lg:hidden" onClick={() => setMobileSidebar(false)} />
        )}

        {/* Sidebar */}
        <aside className={`
          ${mobileSidebar ? 'translate-x-0' : '-translate-x-full'}
          lg:translate-x-0 fixed lg:static inset-y-0 left-0 z-50
          ${sidebarOpen ? 'w-64' : 'w-20'}
          bg-gray-900 text-white sidebar-transition flex flex-col
        `}>
          {/* Logo */}
          <div className="flex items-center justify-between p-4 border-b border-gray-700">
            {sidebarOpen && (
              <div className="flex items-center gap-2">
                <span className="text-2xl">📦</span>
                <div>
                  <h1 className="text-sm font-bold leading-tight">{t('app.title')}</h1>
                  <p className="text-xs text-gray-400">{t('app.subtitle')}</p>
                </div>
              </div>
            )}
            <button onClick={() => { setSidebarOpen(!sidebarOpen); setMobileSidebar(false); }} className="p-1 hover:bg-gray-700 rounded lg:block hidden">
              <Icons.Menu />
            </button>
            <button onClick={() => setMobileSidebar(false)} className="p-1 hover:bg-gray-700 rounded lg:hidden">
              <Icons.X />
            </button>
          </div>

          {/* Organization Selector */}
          {sidebarOpen && (
            <div className="p-3 border-b border-gray-700">
              <select
                value={selectedOrg?.id || ''}
                onChange={(e) => setSelectedOrg(organizations.find(o => o.id === e.target.value))}
                className="w-full bg-gray-800 text-sm text-white border border-gray-600 rounded-lg px-3 py-2 focus:ring-2 focus:ring-primary-500 focus:border-transparent"
              >
                {organizations.map(org => (
                  <option key={org.id} value={org.id}>{org.name}</option>
                ))}
              </select>
            </div>
          )}

          {/* Menu */}
          <nav className="flex-1 overflow-y-auto py-2">
            {filteredMenuGroups.map((group, gi) => {
              if (group.type === 'item') {
                const Icon = group.icon;
                const isActive = currentPage === group.id;
                return (
                  <button key={group.id}
                    onClick={() => { setCurrentPage(group.id); setMobileSidebar(false); }}
                    className={`w-full flex items-center gap-3 px-4 py-2.5 text-sm transition-colors
                      ${isActive ? 'bg-primary-600 text-white' : 'text-gray-300 hover:bg-gray-800 hover:text-white'}
                      ${!sidebarOpen ? 'justify-center px-2' : ''}
                    `}
                    title={!sidebarOpen ? group.label : ''}
                  >
                    <Icon />
                    {sidebarOpen && <span className="flex-1 text-left">{group.label}</span>}
                    {sidebarOpen && group.badge > 0 && <span className="bg-red-500 text-white text-xs font-bold rounded-full px-1.5 py-0.5 min-w-[20px] text-center">{group.badge}</span>}
                  </button>
                );
              }
              const GroupIcon = group.icon;
              const isExpanded = expandedGroups.includes(group.label);
              const hasActive = group.children.some(c => c.id === currentPage);
              return (
                <div key={gi}>
                  {sidebarOpen ? (
                    <button
                      onClick={() => toggleGroup(group.label)}
                      className={`w-full flex items-center justify-between px-4 py-2 text-xs font-semibold uppercase tracking-wider transition-colors
                        ${hasActive ? 'text-primary-400' : 'text-gray-500 hover:text-gray-300'}`}
                    >
                      <span className="flex items-center gap-2"><GroupIcon /> {group.label}</span>
                      <svg className={`w-3.5 h-3.5 transition-transform ${isExpanded ? 'rotate-0' : '-rotate-90'}`} fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M19 9l-7 7-7-7"/></svg>
                    </button>
                  ) : (
                    <div className="flex justify-center py-2 text-gray-600"><GroupIcon /></div>
                  )}
                  {(isExpanded || !sidebarOpen) && group.children.map(item => {
                    const Icon = item.icon;
                    const isActive = currentPage === item.id;
                    return (
                      <button key={item.id}
                        onClick={() => { setCurrentPage(item.id); setMobileSidebar(false); }}
                        className={`w-full flex items-center gap-3 text-sm transition-colors
                          ${isActive ? 'bg-primary-600 text-white' : 'text-gray-300 hover:bg-gray-800 hover:text-white'}
                          ${sidebarOpen ? 'pl-8 pr-4 py-2' : 'justify-center px-2 py-2.5'}
                        `}
                        title={!sidebarOpen ? item.label : ''}
                      >
                        <Icon />
                        {sidebarOpen && <span>{item.label}</span>}
                      </button>
                    );
                  })}
                </div>
              );
            })}
          </nav>

          {/* Footer */}
          {sidebarOpen && (
            <div className="p-3 border-t border-gray-700 text-xs text-gray-500">
              <p>Delonix Group</p>
              <p>{t('app.version')}</p>
            </div>
          )}
        </aside>

        {/* Main Content */}
        <div className="flex-1 flex flex-col overflow-hidden">
          {/* Top Bar */}

function ForceChangePasswordPage({ onChangePassword, onLogout }) {
  const { t } = useTranslation();
  const [newPassword, setNewPassword] = useState('');
  const [confirmPassword, setConfirmPassword] = useState('');
  const [error, setError] = useState('');
  const [loading, setLoading] = useState(false);

  async function handleSubmit(e) {
    e.preventDefault();
    setError('');
    if (newPassword.length < 6) return setError(t('login.passwordShort'));
    if (newPassword !== confirmPassword) return setError(t('login.passwordMismatch'));
    setLoading(true);
    try {
      await onChangePassword(newPassword);
    } catch (err) {
      setError(err.message);
    }
    setLoading(false);
  }

  return (
    <div className="h-full flex items-center justify-center bg-gradient-to-br from-gray-900 via-orange-900 to-gray-900 p-4">
      <div className="w-full max-w-md">
        <div className="text-center mb-8">

          <h1 className="text-xl sm:text-2xl font-bold text-white">{t('login.forceChange')}</h1>
        </div>
        <form onSubmit={handleSubmit} className="bg-white rounded-lg sm:rounded-xl shadow-2xl p-6 sm:p-8 space-y-5">
          {error && <div className="p-3 bg-red-50 border border-red-200 text-red-700 rounded-lg text-sm">{error}</div>}
          <div>
            <label className="block text-sm font-medium text-gray-700 mb-1">{t('login.newPassword')}</label>
            <input type="password" value={newPassword} onChange={e => setNewPassword(e.target.value)} className="w-full px-4 py-2.5 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none text-sm" placeholder={t('login.newPassword')} autoFocus required />
          </div>
          <div>
            <label className="block text-sm font-medium text-gray-700 mb-1">{t('login.confirmNewPassword')}</label>

            {t('login.logout')}

        </form>

function SearchableItemSelect({ items, value, onChange, placeholder }) {
  const [search, setSearch] = useState('');
  const [isOpen, setIsOpen] = useState(false);
  const ref = useRef(null);

  useEffect(() => {
    function handleClickOutside(e) {
      if (ref.current && !ref.current.contains(e.target)) setIsOpen(false);
    }
    document.addEventListener('mousedown', handleClickOutside);
    return () => document.removeEventListener('mousedown', handleClickOutside);
  }, []);

  const filtered = items.filter(i =>
    (i.code + ' ' + i.name).toLowerCase().includes(search.toLowerCase())
  );

  const selectedItem = items.find(i => i.id === value);

  return (
    <div ref={ref} className="relative">
      <input
        type="text"
        value={isOpen ? search : (selectedItem ? `${selectedItem.code} - ${selectedItem.name}` : '')}
        onChange={e => { setSearch(e.target.value); if (!isOpen) setIsOpen(true); }}
        onFocus={() => { setIsOpen(true); setSearch(''); }}
        placeholder={placeholder || 'Search item...'}
        className="w-full px-2 py-1 border rounded text-sm"
      />
      {value && !isOpen && (
        <button onClick={() => { onChange(''); setSearch(''); }}
          className="absolute right-2 top-1/2 -translate-y-1/2 text-gray-400 hover:text-red-500 text-xs">✕</button>
      )}
      {isOpen && (
        <div className="absolute z-50 w-full mt-1 bg-white border rounded-lg shadow-lg max-h-48 overflow-y-auto">
          {filtered.length === 0 ? (
            <div className="px-3 py-2 text-sm text-gray-400">No items found</div>
          ) : filtered.map(i => (
            <div key={i.id}
              onClick={() => { onChange(i.id); setIsOpen(false); setSearch(''); }}
              className={`px-3 py-2 text-sm cursor-pointer hover:bg-blue-50 ${i.id === value ? 'bg-blue-50 font-medium' : ''}`}>
              <span className="font-mono text-xs text-gray-500">{i.code}</span> — {i.name}
            </div>
          ))}
        </div>
      )}
    </div>
  );
}

// ============================================================
// DATE VALIDATION HELPER
// ============================================================
function useDateValidation() {
  const [periodLocks, setPeriodLocks] = useState([]);

  async function validateDate(dateString, orgId) {
    if (!dateString || !orgId) return { valid: true };

    try {
      // Get organization config
      const { data: org } = await supabase.from('organizations').select('max_backdate_days, grace_period_days').eq('id', orgId).single();
      if (!org) return { valid: true };

      const maxBackdateDays = org.max_backdate_days || 3;
      const inputDate = new Date(dateString);
      const today = new Date();

      // Check max backdate limit
      const daysDiff = Math.floor((today - inputDate) / (1000 * 60 * 60 * 24));
      if (daysDiff > maxBackdateDays) {
        return { valid: false, message: 'Date exceeds maximum backdate limit (' + maxBackdateDays + ' days)' };
      }

      // Check if period is locked
      const periodMonth = inputDate.getMonth() + 1;
      const periodYear = inputDate.getFullYear();
      const { data: locks } = await supabase.from('period_locks')
        .select('*')
        .eq('organization_id', orgId)
        .eq('period_month', periodMonth)
        .eq('period_year', periodYear)
        .eq('is_locked', true)
        .single();

      if (locks) {
        return { valid: false, message: 'Period is locked' };
      }

      return { valid: true };
    } catch (err) {
      console.error('Date validation error:', err);
      return { valid: true };
    }
  }

  async function loadPeriodLocks(orgId) {
    try {
      const { data } = await supabase.from('period_locks')
        .select('*')
        .eq('organization_id', orgId)
        .eq('is_locked', true)
        .order('period_year', { ascending: false })
        .order('period_month', { ascending: false });
      setPeriodLocks(data || []);
    } catch (err) {
      console.error('Error loading period locks:', err);
    }
  }

  async function reopenPeriod(lockId, userId) {
    try {
      const { error } = await supabase.from('period_locks')
        .update({ is_locked: false, reopened_at: new Date().toISOString(), reopened_by: userId })
        .eq('id', lockId);
      if (error) throw error;
      return { success: true };
    } catch (err) {
      console.error('Error reopening period:', err);
      return { success: false, error: err.message };
    }
  }

  async function checkAndAutoLockPreviousPeriod(orgId, gracePeriodDays) {
    try {
      const today = new Date();
      const dayOfMonth = today.getDate();

      // Only auto-lock if we're past the grace period
      if (dayOfMonth > gracePeriodDays) {
        const prevDate = new Date(today);
        prevDate.setMonth(prevDate.getMonth() - 1);
        const prevMonth = prevDate.getMonth() + 1;
        const prevYear = prevDate.getFullYear();

        // Check if already locked
        const { data: existing } = await supabase.from('period_locks')
          .select('id')
          .eq('organization_id', orgId)
          .eq('period_month', prevMonth)
          .eq('period_year', prevYear)
          .single();

        if (!existing) {
          // Auto-insert lock
          const { error } = await supabase.from('period_locks').insert({
            organization_id: orgId,
            period_month: prevMonth,
            period_year: prevYear,
            lock_type: 'AUTO',
            is_locked: true,
            locked_at: new Date().toISOString(),
            created_at: new Date().toISOString()
          });
          if (error) console.error('Auto-lock error:', error);
        }
      }
    } catch (err) {
      console.error('Error checking auto-lock:', err);
    }
  }

  return { validateDate, loadPeriodLocks, periodLocks, reopenPeriod, checkAndAutoLockPreviousPeriod };
}

    COUNTING: { color: 'orange', label: t('opname.statusCounting') || 'Counting' },
  };
  const s = map[status] || { color: 'gray', label: status };
  return <Badge color={s.color}>{s.label}</Badge>;
}

function formatCurrency(amount) {
  return new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', minimumFractionDigits: 0 }).format(amount || 0);
}

function formatNumber(num) {
  return new Intl.NumberFormat('id-ID').format(num || 0);
}

// ============================================================
// DASHBOARD PAGE
// ============================================================
function DashboardPage() {
  const { t } = useTranslation();
  const { selectedOrg } = useApp();
  const [stats, setStats] = useState({ items: 0, vendors: 0, lowStock: 0, pendingPR: 0 });
  const [recentMovements, setRecentMovements] = useState([]);
  const [loading, setLoading] = useState(true);

  useEffect(() => {
    if (selectedOrg) loadDashboard();
  }, [selectedOrg]);

  async function loadDashboard() {
    setLoading(true);
    try {
      const [itemsRes, vendorsRes, stockRes, prRes, movRes] = await Promise.all([
        supabase.from('items').select('id', { count: 'exact', head: true }).eq('is_active', true),
        supabase.from('vendors').select('id', { count: 'exact', head: true }).eq('is_active', true),
        supabase.from('stock_balance').select('*').eq('organization_id', selectedOrg.id),
        supabase.from('purchase_requests').select('id', { count: 'exact', head: true }).eq('organization_id', selectedOrg.id).eq('status', 'SUBMITTED'),
        supabase.from('stock_movements').select('*, items(name)').eq('organization_id', selectedOrg.id).order('created_at', { ascending: false }).limit(10),
      ]);

      const stockData = stockRes.data || [];
      const lowStockCount = stockData.filter(s => {
        return s.quantity <= 0;
      }).length;

      setStats({
        items: itemsRes.count || 0,
        vendors: vendorsRes.count || 0,
        lowStock: lowStockCount,
        pendingPR: prRes.count || 0,
      });
      setRecentMovements(movRes.data || []);
    } catch (err) {
      console.error('Dashboard error:', err);
    } finally {
      setLoading(false);
    }
  }

  if (loading) return <div className="flex justify-center py-12"><div className="spinner"></div></div>;

  return (
    <div>
      <PageHeader title={t('menu.dashboard')} subtitle={`${t('dashboard.overview')} ${selectedOrg?.name || ''}`} />

      <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4 mb-8">
        <StatCard title={t('dashboard.totalActiveItems')} value={formatNumber(stats.items)} icon={Icons.Package} color="blue" />
        <StatCard title={t('dashboard.activeVendors')} value={formatNumber(stats.vendors)} icon={Icons.Truck} color="green" />
        <StatCard title={t('dashboard.outOfStock')} value={formatNumber(stats.lowStock)} icon={Icons.AlertTriangle} color="red" />
        <StatCard title={t('dashboard.pendingPR')} value={formatNumber(stats.pendingPR)} icon={Icons.ShoppingCart} color="orange" />
      </div>

      <div className="bg-white rounded-xl shadow-sm border border-gray-100 p-5">
        <h3 className="text-sm font-semibold text-gray-800 mb-4">{t('dashboard.recentMovements')}</h3>
        <DataTable
          columns={[
            { header: t('common.date'), render: (r) => new Date(r.created_at).toLocaleDateString('id-ID') },
            { header: t('dashboard.item'), render: (r) => r.items?.name || '-' },
            { header: t('dashboard.type'), render: (r) => <Badge color={r.movement_type === 'IN' ? 'green' : r.movement_type === 'OUT' ? 'red' : 'blue'}>{r.movement_type}</Badge> },
            { header: t('dashboard.qty'), render: (r) => formatNumber(r.quantity) },
            { header: t('dashboard.balance'), render: (r) => formatNumber(r.balance_after) },
          ]}
          data={recentMovements}
        />
      </div>
    </div>
  );
}

// PERIOD LOCKS MANAGEMENT COMPONENT
// ============================================================
function PeriodLocksManagement({ hotels, canEdit, currentUser }) {
  const { t } = useTranslation();
  const { showNotification } = useApp();
  const [locks, setLocks] = useState([]);
  const [loading, setLoading] = useState(true);
  const [selectedHotel, setSelectedHotel] = useState(hotels.length > 0 ? hotels[0].id : null);

  const canReopen = ['superadmin', 'findir'].includes(currentUser?.role?.code);

  useEffect(() => {
    if (!selectedHotel && hotels.length > 0) {
      setSelectedHotel(hotels[0].id);
    }
  }, [hotels]);

  useEffect(() => {
    if (selectedHotel) loadLocks();
  }, [selectedHotel]);

  async function loadLocks() {
    setLoading(true);
    try {
      const { data } = await supabase.from('period_locks')
        .select('*')
        .eq('organization_id', selectedHotel)
        .order('period_year', { ascending: false })
        .order('period_month', { ascending: false });
      setLocks(data || []);
    } catch (err) {
      showNotification('Error loading period locks: ' + err.message, 'error');
    }
    setLoading(false);
  }

  async function handleReopen(lock) {
    if (!window.confirm('Reopen this period?')) return;
    try {
      const { error } = await supabase.from('period_locks')
        .update({ is_locked: false, reopened_at: new Date().toISOString(), reopened_by: currentUser.id })
        .eq('id', lock.id);
      if (error) throw error;
      showNotification('Period reopened', 'success');
      loadLocks();
    } catch (err) {
      showNotification('Error reopening period: ' + err.message, 'error');
    }
  }

  return (
    <div className="bg-white border border-gray-200 rounded-lg p-4">
      {hotels.length > 0 && (
        <div className="mb-4">
          <label className="block text-sm font-medium text-gray-700 mb-2">{t('hotels.title')}</label>
          <select
            value={selectedHotel}
            onChange={(e) => setSelectedHotel(e.target.value)}
            className="w-full max-w-xs bg-white text-sm text-gray-900 border border-gray-300 rounded-lg px-3 py-2 focus:ring-2 focus:ring-blue-500 focus:border-transparent"
          >
            {hotels.map(h => (
              <option key={h.id} value={h.id}>{h.name}</option>
            ))}
          </select>
        </div>
      )}

      {loading ? (
        <div className="text-center py-4 text-gray-500">Loading...</div>
      ) : locks.length === 0 ? (
        <div className="text-center py-4 text-gray-500">No locked periods</div>
      ) : (
        <div className="overflow-x-auto">
          <table className="w-full text-sm">
            <thead>
              <tr className="border-b border-gray-200">
                <th className="text-left py-2 px-3 font-semibold">Month/Year</th>
                <th className="text-left py-2 px-3 font-semibold">{t('backdate.lockPeriod')}</th>
                <th className="text-left py-2 px-3 font-semibold">Locked At</th>
                <th className="text-left py-2 px-3 font-semibold">{canReopen ? 'Action' : ''}</th>
              </tr>
            </thead>
            <tbody>
              {locks.map(lock => (
                <tr key={lock.id} className="border-b border-gray-100 hover:bg-gray-50">
                  <td className="py-2 px-3">{lock.period_month}/{lock.period_year}</td>
                  <td className="py-2 px-3">
                    <Badge color={lock.lock_type === 'AUTO' ? 'blue' : 'orange'}>
                      {lock.lock_type === 'AUTO' ? t('backdate.autoLocked') : t('backdate.manualLocked')}
                    </Badge>
                  </td>
                  <td className="py-2 px-3 text-xs text-gray-500">
                    {new Date(lock.locked_at).toLocaleDateString()}
                  </td>
                  <td className="py-2 px-3">
                    {canReopen && lock.is_locked && (
                      <button
                        onClick={() => handleReopen(lock)}
                        className="text-blue-600 hover:text-blue-800 text-xs font-medium"
                      >
                        {t('backdate.reopenPeriod')}
                      </button>
                    )}
                  </td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      )}
    </div>
  );
}

function ItemsPage() {
  const { t } = useTranslation();
  const { showNotification, selectedOrg } = useApp();
  const [items, setItems] = useState([]);
  const [categories, setCategories] = useState([]);
  const [units, setUnits] = useState([]);
  const [warehouses, setWarehouses] = useState([]);
  const [loading, setLoading] = useState(true);
  const [showModal, setShowModal] = useState(false);
  const [editItem, setEditItem] = useState(null);
  const [search, setSearch] = useState('');
  const [filterCategory, setFilterCategory] = useState('');
  const [filterWarehouse, setFilterWarehouse] = useState('');
  const [pageSize, setPageSize] = useState(10);
  const [currentPage, setCurrentPage] = useState(1);
  const [form, setForm] = useState({ code: '', name: '', description: '', category_id: '', unit_id: '', purchase_unit_id: '', usage_unit_id: '', conversion_rate: 1, brand: '', size: '', min_stock: 0, max_stock: 0, reorder_point: 0, default_warehouse_id: '' });

  useEffect(() => { loadData(); }, [selectedOrg]);

  async function loadData() {
    setLoading(true);
    const whQuery = selectedOrg
      ? supabase.from('warehouses').select('*').eq('organization_id', selectedOrg.id).eq('is_active', true).order('name')
      : supabase.from('warehouses').select('*').eq('is_active', true).order('name');
    const [itemsRes, catRes, unitRes, whRes] = await Promise.all([
      supabase.from('items').select('*, item_categories(name), units:units!items_unit_id_fkey(abbreviation), purchase_unit:units!items_purchase_unit_id_fkey(abbreviation, name), usage_unit:units!items_usage_unit_id_fkey(abbreviation, name), default_warehouse:warehouses!items_default_warehouse_id_fkey(id, code, name)').order('code'),
      supabase.from('item_categories').select('*').order('name'),
      supabase.from('units').select('*').order('name'),
      whQuery,
    ]);
    setItems(itemsRes.data || []);
    // Deduplicate categories by name (safety measure)
    const uniqueCats = [];
    const seenNames = new Set();
    (catRes.data || []).forEach(c => {
      if (!seenNames.has(c.name)) { seenNames.add(c.name); uniqueCats.push(c); }
    });
    setCategories(uniqueCats);
    setUnits(unitRes.data || []);
    setWarehouses(whRes.data || []);
    setLoading(false);
  }

  async function generateCode(categoryId) {
    if (!categoryId) return '';
    const cat = categories.find(c => c.id === categoryId);
    if (!cat) return '';
    const prefix = cat.code;
    // Find highest existing code number for this prefix
    const { data: existing } = await supabase
      .from('items')
      .select('code')
      .like('code', prefix + '-%')
      .order('code', { ascending: false })
      .limit(1);
    let nextNum = 1;
    if (existing && existing.length > 0) {
      const lastCode = existing[0].code;
      const numPart = parseInt(lastCode.split('-').pop(), 10);
      if (!isNaN(numPart)) nextNum = numPart + 1;
    }
    return prefix + '-' + String(nextNum).padStart(3, '0');
  }

  async function handleCategoryChange(categoryId) {
    if (!editItem) {
      const code = await generateCode(categoryId);
      setForm(f => ({...f, category_id: categoryId, code }));
    } else {
      setForm(f => ({...f, category_id: categoryId }));
    }
  }

  function openCreate() {
    setEditItem(null);
    setForm({ code: '', name: '', description: '', category_id: '', unit_id: '', purchase_unit_id: '', usage_unit_id: '', conversion_rate: 1, brand: '', size: '', min_stock: 0, max_stock: 0, reorder_point: 0, default_warehouse_id: '' });
    setShowModal(true);
  }

  function openEdit(item) {
    setEditItem(item);
    setForm({ code: item.code, name: item.name, description: item.description || '', category_id: item.category_id || '', unit_id: item.unit_id || '', purchase_unit_id: item.purchase_unit_id || '', usage_unit_id: item.usage_unit_id || '', conversion_rate: item.conversion_rate || 1, brand: item.brand || '', size: item.size || '', min_stock: item.min_stock, max_stock: item.max_stock, reorder_point: item.reorder_point, default_warehouse_id: item.default_warehouse_id || '' });
    setShowModal(true);
  }

  async function handleSave() {
    try {
      const payload = { ...form, default_warehouse_id: form.default_warehouse_id || null };
      if (editItem) {
        const { error } = await supabase.from('items').update(payload).eq('id', editItem.id);
        if (error) throw error;
        showNotification(t('items.successUpdate'));
      } else {
        const { error } = await supabase.from('items').insert(payload);
        if (error) throw error;
        showNotification(t('items.successAdd'));
      }
      setShowModal(false);
      loadData();
    } catch (err) {
      showNotification('Error: ' + err.message, 'error');
    }
  }

  const filtered = items.filter(i => {
    const matchSearch = !search || i.name.toLowerCase().includes(search.toLowerCase()) ||
      i.code.toLowerCase().includes(search.toLowerCase()) ||
      (i.brand && i.brand.toLowerCase().includes(search.toLowerCase()));
    const matchCategory = !filterCategory || i.category_id === filterCategory;
    const matchWarehouse = !filterWarehouse || i.default_warehouse_id === filterWarehouse;
    return matchSearch && matchCategory && matchWarehouse;
  });

  const totalPages = Math.ceil(filtered.length / pageSize);
  const safePage = Math.min(currentPage, totalPages || 1);
  const paginatedItems = filtered.slice((safePage - 1) * pageSize, safePage * pageSize);

  // Reset to page 1 when filters change
  useEffect(() => { setCurrentPage(1); }, [search, filterCategory, filterWarehouse, pageSize]);

  return (
    <div>
      <PageHeader title={t('items.title')} subtitle={`${items.length} ${t('items.registered')}`}
        actions={<Button onClick={openCreate}><Icons.Plus /> {t('items.addItem')}</Button>} />

      <div className="bg-white rounded-xl shadow-sm border border-gray-100">
        <div className="p-4 border-b border-gray-100">
          <div className="flex flex-wrap gap-3 items-center">
            <div className="relative">
              <Icons.Search />
              <input type="text" placeholder={t('items.searchPlaceholder')} value={search} onChange={e => setSearch(e.target.value)}
                className="w-full sm:w-64 pl-10 pr-4 py-2 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-primary-500" style={{paddingLeft: '2.5rem'}} />
            </div>
            <select value={filterCategory} onChange={e => setFilterCategory(e.target.value)}
              className="px-3 py-2 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-primary-500 bg-white">
              <option value="">All Categories</option>
              {categories.map(c => <option key={c.id} value={c.id}>{c.name}</option>)}
            </select>
            <select value={filterWarehouse} onChange={e => setFilterWarehouse(e.target.value)}
              className="px-3 py-2 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-primary-500 bg-white">
              <option value="">All Warehouses</option>
              {warehouses.map(w => <option key={w.id} value={w.id}>{w.name}</option>)}
            </select>
            {(filterCategory || filterWarehouse) && (
              <button onClick={() => { setFilterCategory(''); setFilterWarehouse(''); }} className="text-xs text-red-500 hover:text-red-700 px-2 py-1">
                Clear Filters
              </button>
            )}
          </div>
        </div>
        <DataTable
          loading={loading}
          columns={[
            { header: t('items.code'), key: 'code', render: r => <span className="font-mono text-xs bg-gray-100 px-2 py-0.5 rounded">{r.code}</span> },
            { header: t('items.name'), key: 'name', render: r => <span className="font-medium">{r.name}</span> },
            { header: t('items.brand'), render: r => r.brand || '-' },
            { header: t('items.size'), render: r => r.size ? <span className="text-xs bg-blue-50 text-blue-700 px-2 py-0.5 rounded">{r.size}</span> : '-' },
            { header: t('items.category'), render: r => r.item_categories?.name || '-' },
            { header: t('items.purchaseUnit'), render: r => r.purchase_unit?.abbreviation || r.units?.abbreviation || '-' },
            { header: t('items.usageUnit'), render: r => r.usage_unit?.abbreviation || r.units?.abbreviation || '-' },
            { header: t('items.conversionRate'), render: r => r.conversion_rate && r.conversion_rate !== 1 ? <span className="text-xs bg-purple-50 text-purple-700 px-2 py-0.5 rounded font-medium">1:{r.conversion_rate}</span> : <span className="text-gray-400">1:1</span> },
            { header: t('items.defaultWarehouse'), render: r => r.default_warehouse ? <span className="text-xs bg-green-50 text-green-700 px-2 py-0.5 rounded">{r.default_warehouse.name}</span> : <span className="text-gray-400">-</span> },
            { header: t('items.minStock'), render: r => formatNumber(r.min_stock) },
            { header: t('items.maxStock'), render: r => formatNumber(r.max_stock) },
            { header: 'ROP', render: r => formatNumber(r.reorder_point) },
            { header: t('common.status'), render: r => <Badge color={r.is_active ? 'green' : 'red'}>{r.is_active ? t('common.active') : t('common.inactive')}</Badge> },
          ]}
          data={paginatedItems}
          actions={(row) => (
            <>
              <button onClick={(e) => { e.stopPropagation(); openEdit(row); }} className="p-1.5 hover:bg-gray-100 rounded-lg text-gray-500"><Icons.Edit /></button>
            </>
          )}
        />
        {filtered.length > 0 && (
          <div className="flex flex-wrap items-center justify-between px-4 py-3 border-t border-gray-100 text-sm text-gray-600">
            <div>
              Showing {((safePage - 1) * pageSize) + 1}–{Math.min(safePage * pageSize, filtered.length)} of {filtered.length} items
            </div>
            <div className="flex items-center gap-3">
              <div className="flex items-center gap-1">
                <button onClick={() => setCurrentPage(1)} disabled={safePage <= 1}
                  className={`px-2 py-1 rounded ${safePage <= 1 ? 'text-gray-300 cursor-not-allowed' : 'hover:bg-gray-100 text-gray-600'}`}>«</button>
                <button onClick={() => setCurrentPage(p => Math.max(1, p - 1))} disabled={safePage <= 1}
                  className={`px-2 py-1 rounded ${safePage <= 1 ? 'text-gray-300 cursor-not-allowed' : 'hover:bg-gray-100 text-gray-600'}`}>‹</button>
                <span className="px-3 py-1 text-sm font-medium">{safePage} / {totalPages}</span>
                <button onClick={() => setCurrentPage(p => Math.min(totalPages, p + 1))} disabled={safePage >= totalPages}
                  className={`px-2 py-1 rounded ${safePage >= totalPages ? 'text-gray-300 cursor-not-allowed' : 'hover:bg-gray-100 text-gray-600'}`}>›</button>
                <button onClick={() => setCurrentPage(totalPages)} disabled={safePage >= totalPages}
                  className={`px-2 py-1 rounded ${safePage >= totalPages ? 'text-gray-300 cursor-not-allowed' : 'hover:bg-gray-100 text-gray-600'}`}>»</button>
              </div>
              <select value={pageSize} onChange={e => setPageSize(Number(e.target.value))}
                className="px-2 py-1 border border-gray-300 rounded text-sm bg-white focus:ring-2 focus:ring-primary-500">
                <option value={10}>10 / page</option>
                <option value={25}>25 / page</option>
                <option value={50}>50 / page</option>
                <option value={100}>100 / page</option>
              </select>
            </div>
          </div>
        )}
      </div>

      <Modal open={showModal} onClose={() => setShowModal(false)} title={editItem ? t('items.editItem') : t('items.addNew')} size="lg">
        <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
          <FormField label={t('items.category')} required>
            <Select value={form.category_id} onChange={e => handleCategoryChange(e.target.value)}>
              <option value="">{t('items.selectCategory')}</option>

// ============================================================
// CATEGORIES PAGE (CRUD)
// ============================================================
function CategoriesPage() {
  const { t } = useTranslation();
  const { showNotification } = useApp();
  const [categories, setCategories] = useState([]);
  const [loading, setLoading] = useState(true);
  const [showModal, setShowModal] = useState(false);
  const [editing, setEditing] = useState(null);
  const [saving, setSaving] = useState(false);
  const [itemCounts, setItemCounts] = useState({});
  const [form, setForm] = useState({ code: '', name: '', description: '', parent_id: '', is_active: true });

  useEffect(() => { loadCategories(); }, []);

  async function loadCategories() {
    setLoading(true);
    const { data } = await supabase.from('item_categories').select('*').order('code');
    setCategories(data || []);
    // Count items per category
    const { data: items } = await supabase.from('items').select('category_id');
    const counts = {};
    (items || []).forEach(i => { counts[i.category_id] = (counts[i.category_id] || 0) + 1; });
    setItemCounts(counts);
    setLoading(false);
  }

  function openAdd() {
    setEditing(null);
    setForm({ code: '', name: '', description: '', parent_id: '', is_active: true });
    setShowModal(true);
  }

  function openEdit(cat) {
    setEditing(cat);
    setForm({ code: cat.code, name: cat.name, description: cat.description || '', parent_id: cat.parent_id || '', is_active: cat.is_active });
    setShowModal(true);
  }

  async function handleSave() {
    if (!form.code.trim() || !form.name.trim()) return;
    setSaving(true);
    try {
      const payload = {
        code: form.code.trim().toUpperCase(), name: form.name.trim(),
        description: form.description.trim() || null,
        parent_id: form.parent_id || null, is_active: form.is_active
      };
      if (editing) {
        const { error } = await supabase.from('item_categories').update(payload).eq('id', editing.id);
        if (error) throw error;
      } else {
        const { error } = await supabase.from('item_categories').insert(payload);
        if (error) throw error;
      }
      setShowModal(false);
      loadCategories();
    } catch (err) { alert(t('cat.errorSave') + ': ' + err.message); }
    setSaving(false);
  }

  async function handleDelete(cat) {
    if (!confirm(t('cat.confirmDelete'))) return;
    const { error } = await supabase.from('item_categories').delete().eq('id', cat.id);
    if (error) { alert(t('cat.errorSave') + ': ' + error.message); return; }
    loadCategories();
  }

  const getParentName = (parentId) => {
    const p = categories.find(c => c.id === parentId);
    return p ? p.name : '-';
  };

  return (
    <div>
      <PageHeader title={t('cat.title')} subtitle={t('cat.subtitle')}
        actions={<Button onClick={openAdd}><Icons.Plus /> {t('cat.addNew')}</Button>} />
      <div className="bg-white rounded-xl shadow-sm border border-gray-100">
        <DataTable loading={loading}
          columns={[
            { header: t('cat.code'), render: r => <span className="font-mono text-xs bg-gray-100 px-2 py-0.5 rounded">{r.code}</span> },
            { header: t('cat.name'), render: r => <span className="font-medium">{r.name}</span> },
            { header: t('cat.description'), key: 'description' },
            { header: t('cat.parent'), render: r => r.parent_id ? getParentName(r.parent_id) : <span className="text-gray-400">-</span> },
            { header: t('cat.itemCount'), render: r => <span className="font-semibold">{itemCounts[r.id] || 0}</span> },
            { header: t('cat.status'), render: r => <Badge color={r.is_active ? 'green' : 'red'}>{r.is_active ? t('common.active') : t('common.inactive')}</Badge> },
            { header: t('common.actions'), render: r => (
              <div className="flex gap-1">
                <button onClick={() => openEdit(r)} className="p-1 text-blue-600 hover:bg-blue-50 rounded"><Icons.Edit /></button>
                {!(itemCounts[r.id] > 0) && <button onClick={() => handleDelete(r)} className="p-1 text-red-600 hover:bg-red-50 rounded"><Icons.Trash /></button>}
              </div>
            )},
          ]}
          data={categories}
        />
      </div>

      {showModal && (
        <Modal open={true} title={editing ? t('cat.editTitle') : t('cat.addNew')} onClose={() => setShowModal(false)}>
          <div className="space-y-4">
            <FormField label={t('cat.code')}>
              <Input value={form.code} onChange={e => setForm({...form, code: e.target.value})} placeholder="e.g. LIN, BEV" />
            </FormField>
            <FormField label={t('cat.name')}>
              <Input value={form.name} onChange={e => setForm({...form, name: e.target.value})} placeholder="Linen & Uniform" />
            </FormField>
            <FormField label={t('cat.description')}>
              <Input value={form.description} onChange={e => setForm({...form, description: e.target.value})} />
            </FormField>
            <FormField label={t('cat.parent')}>
              <Select value={form.parent_id} onChange={e => setForm({...form, parent_id: e.target.value})}>
                <option value="">{t('cat.noParent')}</option>
                {categories.filter(c => !editing || c.id !== editing.id).map(c =>
                  <option key={c.id} value={c.id}>{c.code} — {c.name}</option>
                )}
              </Select>
            </FormField>
            <FormField label={t('cat.status')}>
              <Select value={form.is_active ? 'true' : 'false'} onChange={e => setForm({...form, is_active: e.target.value === 'true'})}>
                <option value="true">{t('common.active')}</option>
                <option value="false">{t('common.inactive')}</option>
              </Select>
            </FormField>
            <div className="flex justify-end gap-2 pt-2">
              <Button variant="secondary" onClick={() => setShowModal(false)}>{t('common.cancel')}</Button>
              <Button onClick={handleSave} disabled={saving}>{saving ? '...' : (editing ? t('common.update') : t('common.create'))}</Button>
            </div>
          </div>
        </Modal>
      )}
    </div>
  );
}

// ============================================================
// WAREHOUSES PAGE (CRUD)
// ============================================================
function WarehousesPage() {
  const { selectedOrg } = useApp();
  const { t } = useTranslation();
  const [warehouses, setWarehouses] = useState([]);
  const [loading, setLoading] = useState(true);
  const [showModal, setShowModal] = useState(false);
  const [editing, setEditing] = useState(null);
  const [saving, setSaving] = useState(false);
  const [form, setForm] = useState({ code: '', name: '', description: '', warehouse_type: 'store', is_active: true });
  const [activeTab, setActiveTab] = useState('storage');

  useEffect(() => { if (selectedOrg) loadWarehouses(); }, [selectedOrg]);

  async function loadWarehouses() {
    setLoading(true);
    const { data } = await supabase.from('warehouses').select('*')
      .eq('organization_id', selectedOrg.id).order('code');
    setWarehouses(data || []);
    setLoading(false);
  }

  function openAdd() {
    setEditing(null);
    const defaultType = activeTab === 'room' ? 'room' : 'store';
    setForm({ code: '', name: '', description: '', warehouse_type: defaultType, is_active: true });
    setShowModal(true);
  }

  function openEdit(wh) {
    setEditing(wh);
    setForm({ code: wh.code, name: wh.name, description: wh.description || '', warehouse_type: wh.warehouse_type, is_active: wh.is_active });
    setShowModal(true);
  }

  async function handleSave() {
    if (!form.code.trim() || !form.name.trim()) return;
    setSaving(true);
    try {
      if (editing) {
        const { error } = await supabase.from('warehouses').update({
          code: form.code.trim().toUpperCase(), name: form.name.trim(), description: form.description.trim(),
          warehouse_type: form.warehouse_type, is_active: form.is_active, updated_at: new Date().toISOString()
        }).eq('id', editing.id);
        if (error) throw error;
      } else {
        const { error } = await supabase.from('warehouses').insert({
          organization_id: selectedOrg.id, code: form.code.trim().toUpperCase(), name: form.name.trim(),
          description: form.description.trim(), warehouse_type: form.warehouse_type, is_active: form.is_active
        });
        if (error) throw error;
      }
      setShowModal(false);
      loadWarehouses();
    } catch (err) { alert(t('wh.errorSave') + ': ' + err.message); }
    setSaving(false);
  }

  async function handleDelete(wh) {
    // Check dependencies before delete
    const [sbRes, smRes, rmRes] = await Promise.all([
      supabase.from('stock_balance').select('id', { count: 'exact', head: true }).eq('warehouse_id', wh.id),
      supabase.from('stock_movements').select('id', { count: 'exact', head: true }).eq('warehouse_id', wh.id),
      supabase.from('rooms').select('id', { count: 'exact', head: true }).eq('warehouse_id', wh.id),
    ]);
    const deps = [];
    if (sbRes.count > 0) deps.push(`${sbRes.count} stock balance(s)`);
    if (smRes.count > 0) deps.push(`${smRes.count} stock movement(s)`);
    if (rmRes.count > 0) deps.push(`${rmRes.count} room(s)`);
    if (deps.length > 0) {
      const msg = `Cannot delete "${wh.name}" — it has linked data: ${deps.join(', ')}. Deactivate instead?`;
      if (confirm(msg)) {
        await supabase.from('warehouses').update({ is_active: false }).eq('id', wh.id);
        loadWarehouses();
      }
      return;
    }
    if (!confirm(t('wh.confirmDelete'))) return;
    await supabase.from('warehouses').delete().eq('id', wh.id);
    loadWarehouses();
  }

  const typeLabel = (type) => {
    const map = { general: t('wh.type.general'), store: t('wh.type.store'), room: t('wh.type.room') };
    return map[type] || type;
  };

  const typeColor = (type) => {
    const map = { general: 'blue', store: 'green', room: 'purple' };
    return map[type] || 'gray';
  };

  const filteredWarehouses = warehouses.filter(wh => {
    if (activeTab === 'room') return wh.warehouse_type === 'room';
    return ['store', 'damage', 'in_use', 'general'].includes(wh.warehouse_type);
  });

  return (
    <div>
      <PageHeader title={t('wh.title')} subtitle={`${t('wh.subtitle')} ${selectedOrg?.name}`}
        actions={<Button onClick={openAdd}><Icons.Plus /> {t('wh.addNew')}</Button>} />
      <div className="bg-white rounded-xl shadow-sm border border-gray-100">
        <div className="border-b border-gray-100 flex gap-0">
          <button onClick={() => setActiveTab('storage')}
            className={`px-4 py-3 text-sm font-medium border-b-2 transition ${activeTab === 'storage' ? 'border-primary-500 text-primary-600' : 'border-transparent text-gray-600 hover:text-gray-800'}`}>
            Storage Warehouses
          </button>
          <button onClick={() => setActiveTab('room')}
            className={`px-4 py-3 text-sm font-medium border-b-2 transition ${activeTab === 'room' ? 'border-primary-500 text-primary-600' : 'border-transparent text-gray-600 hover:text-gray-800'}`}>
            Room Warehouses
          </button>
        </div>
        <DataTable loading={loading}
          columns={[
            { header: t('wh.code'), render: r => <span className="font-mono text-xs bg-gray-100 px-2 py-0.5 rounded">{r.code}</span> },
            { header: t('wh.name'), render: r => <span className="font-medium">{r.name}</span> },
            { header: t('wh.description'), key: 'description' },
            { header: t('wh.type'), render: r => <Badge color={typeColor(r.warehouse_type)}>{typeLabel(r.warehouse_type)}</Badge> },
            { header: t('wh.status'), render: r => <Badge color={r.is_active ? 'green' : 'red'}>{r.is_active ? t('common.active') : t('common.inactive')}</Badge> },
            { header: t('common.actions'), render: r => (
              <div className="flex gap-1">
                <button onClick={() => openEdit(r)} className="p-1 text-blue-600 hover:bg-blue-50 rounded"><Icons.Edit /></button>
                <button onClick={() => handleDelete(r)} className="p-1 text-red-600 hover:bg-red-50 rounded"><Icons.Trash /></button>
              </div>
            )},
          ]}
          data={filteredWarehouses}
        />
      </div>

      {showModal && (
        <Modal open={true} title={editing ? t('wh.editTitle') : t('wh.addNew')} onClose={() => setShowModal(false)}>
          <div className="space-y-4">
            <FormField label={t('wh.code')}>
              <Input value={form.code} onChange={e => setForm({...form, code: e.target.value})} placeholder="e.g. GS, FNB" />
            </FormField>
            <FormField label={t('wh.name')}>
              <Input value={form.name} onChange={e => setForm({...form, name: e.target.value})} placeholder="General Store" />
            </FormField>
            <FormField label={t('wh.description')}>
              <Input value={form.description} onChange={e => setForm({...form, description: e.target.value})} />
            </FormField>
            {activeTab !== 'room' && (
              <FormField label={t('wh.type')}>
                <Select value={form.warehouse_type} onChange={e => setForm({...form, warehouse_type: e.target.value})}>
                  <option value="general">{t('wh.type.general')}</option>
                  <option value="store">{t('wh.type.store')}</option>
                  <option value="damage">Damage</option>
                  <option value="in_use">In Use</option>
                </Select>
              </FormField>
            )}
            <FormField label={t('wh.status')}>
              <Select value={form.is_active ? 'true' : 'false'} onChange={e => setForm({...form, is_active: e.target.value === 'true'})}>
                <option value="true">{t('common.active')}</option>
                <option value="false">{t('common.inactive')}</option>
              </Select>
            </FormField>
            <div className="flex justify-end gap-2 pt-2">
              <Button variant="secondary" onClick={() => setShowModal(false)}>{t('common.cancel')}</Button>
              <Button onClick={handleSave} disabled={saving}>{saving ? '...' : (editing ? t('common.update') : t('common.create'))}</Button>
            </div>
          </div>
        </Modal>
      )}
    </div>
  );
}

// ROOM ITEMS MODAL (Replace & Refill items per room)
// ============================================================
function RoomItemsModal({ room, open, onClose }) {
  const { t } = useTranslation();
  const { showNotification } = useApp();
  const [roomItems, setRoomItems] = useState([]);
  const [allItems, setAllItems] = useState([]);
  const [loading, setLoading] = useState(true);
  const [addForm, setAddForm] = useState({ item_id: '', type: 'replace', default_qty: 1 });
  const [adding, setAdding] = useState(false);

  useEffect(() => { if (open && room) loadRoomItems(); }, [open, room]);

  async function loadRoomItems() {
    setLoading(true);
    const [riRes, itemsRes] = await Promise.all([
      supabase.from('room_items').select('*, items(id, code, name, brand)').eq('room_id', room.id).order('type').order('created_at'),
      supabase.from('items').select('id, code, name, brand').eq('is_active', true).order('name'),
    ]);
    setRoomItems(riRes.data || []);
    setAllItems(itemsRes.data || []);
    setLoading(false);
  }

  async function handleAdd() {
    if (!addForm.item_id || !addForm.type) return;
    const exists = roomItems.find(ri => ri.item_id === addForm.item_id && ri.type === addForm.type);
    if (exists) { showNotification(t('roomItems.duplicate'), 'error'); return; }
    setAdding(true);
    try {
      const { error } = await supabase.from('room_items').insert({ room_id: room.id, item_id: addForm.item_id, type: addForm.type, default_qty: parseFloat(addForm.default_qty) || 1 });
      if (error) throw error;
      showNotification(t('roomItems.successAdd'));
      setAddForm({ item_id: '', type: 'replace', default_qty: 1 });
      loadRoomItems();
    } catch (err) { showNotification(t('roomItems.errorAdd') + ': ' + err.message, 'error'); }
    setAdding(false);
  }

  async function handleRemove(id) {
    try {
      const { error } = await supabase.from('room_items').delete().eq('id', id);
      if (error) throw error;
      showNotification(t('roomItems.successDelete'));
      loadRoomItems();
    } catch (err) { showNotification('Error: ' + err.message, 'error'); }
  }

  async function handleQtyChange(id, newQty) {
    try {
      const { error } = await supabase.from('room_items').update({ default_qty: parseFloat(newQty) || 1 }).eq('id', id);
      if (error) throw error;
      setRoomItems(prev => prev.map(ri => ri.id === id ? { ...ri, default_qty: parseFloat(newQty) || 1 } : ri));
    } catch (err) { showNotification('Error: ' + err.message, 'error'); }
  }

  if (!room) return null;

  const replaceItems = roomItems.filter(ri => ri.type === 'replace');
  const refillItems = roomItems.filter(ri => ri.type === 'refill');

  return (
    <Modal open={open} onClose={onClose} title={`${t('roomItems.title')} - ${room.room_number}`} size="lg">
      <p className="text-sm text-gray-500 mb-4">{t('roomItems.subtitle')} {room.room_number}</p>

      {/* Add new item form */}
      <div className="bg-gray-50 rounded-lg p-4 mb-4">
        <h4 className="text-sm font-semibold text-gray-700 mb-3">{t('roomItems.addItem')}</h4>
        <div className="grid grid-cols-1 sm:grid-cols-4 gap-3 items-end">
          <div className="sm:col-span-2">
            <label className="block text-xs font-medium text-gray-600 mb-1">{t('roomItems.item')}</label>
            <Select value={addForm.item_id} onChange={e => setAddForm({...addForm, item_id: e.target.value})}>
              <option value="">{t('roomItems.selectItem')}</option>
              {allItems.map(item => <option key={item.id} value={item.id}>{item.code} - {item.name}{item.brand ? ` (${item.brand})` : ''}</option>)}
            </Select>
          </div>
          <div>
            <label className="block text-xs font-medium text-gray-600 mb-1">{t('roomItems.type')}</label>
            <Select value={addForm.type} onChange={e => setAddForm({...addForm, type: e.target.value})}>
              <option value="replace">{t('roomItems.replace')}</option>
              <option value="refill">{t('roomItems.refill')}</option>
            </Select>
          </div>
          <div className="flex gap-2 items-end">
            <div className="flex-1">
              <label className="block text-xs font-medium text-gray-600 mb-1">{t('roomItems.defaultQty')}</label>
              <Input type="number" min="0.01" step="0.01" value={addForm.default_qty} onChange={e => setAddForm({...addForm, default_qty: e.target.value})} />
            </div>
            <Button onClick={handleAdd} disabled={adding || !addForm.item_id}><Icons.Plus /></Button>
          </div>
        </div>
      </div>

      {loading ? <div className="text-center py-8 text-gray-400">Loading...</div> : roomItems.length === 0 ? (
        <div className="text-center py-8 text-gray-400">{t('roomItems.noItems')}</div>
      ) : (
        <div className="space-y-4">
          {/* Replace items */}
          {replaceItems.length > 0 && (
            <div>
              <h4 className="text-sm font-semibold text-orange-700 mb-2 flex items-center gap-2">
                <span className="w-2 h-2 bg-orange-500 rounded-full"></span> {t('roomItems.replace')} ({replaceItems.length})
              </h4>
              <div className="bg-orange-50 rounded-lg overflow-hidden">
                <table className="w-full text-sm">
                  <thead><tr className="bg-orange-100 text-orange-800">
                    <th className="text-left px-3 py-2 font-medium">{t('roomItems.item')}</th>
                    <th className="text-center px-3 py-2 font-medium w-24">{t('roomItems.defaultQty')}</th>
                    <th className="w-10"></th>
                  </tr></thead>
                  <tbody>
                    {replaceItems.map(ri => (
                      <tr key={ri.id} className="border-t border-orange-100">
                        <td className="px-3 py-2"><span className="font-mono text-xs bg-white px-1.5 py-0.5 rounded mr-2">{ri.items?.code}</span>{ri.items?.name}{ri.items?.brand ? <span className="text-gray-400 ml-1">({ri.items.brand})</span> : ''}</td>
                        <td className="px-3 py-2 text-center"><input type="number" min="0.01" step="0.01" value={ri.default_qty} onChange={e => handleQtyChange(ri.id, e.target.value)} className="w-20 text-center border border-orange-200 rounded px-2 py-1 text-sm" /></td>
                        <td className="px-2 py-2"><button onClick={() => handleRemove(ri.id)} className="p-1 hover:bg-red-100 rounded text-red-400"><Icons.Trash /></button></td>
                      </tr>
                    ))}
                  </tbody>
                </table>
              </div>
            </div>
          )}

          {/* Refill items */}
          {refillItems.length > 0 && (
            <div>
              <h4 className="text-sm font-semibold text-blue-700 mb-2 flex items-center gap-2">
                <span className="w-2 h-2 bg-blue-500 rounded-full"></span> {t('roomItems.refill')} ({refillItems.length})

              <div className="bg-blue-50 rounded-lg overflow-hidden">

  );
}
