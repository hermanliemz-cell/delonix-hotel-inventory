        const { data: res } = await q.order('opname_date', { ascending: false });
        setData(res || []);
      }
    } catch (err) { console.error(err); }
    setLoading(false);
  }

  function getExportHeaders() {
    if (reportType === 'valuation') return ['Item Code', 'Item Name', 'Brand', 'Category', 'Department', 'Qty', 'Avg Cost', 'Total Value'];
    if (reportType === 'movement') return ['Date', 'Item', 'Type', 'Qty', 'Unit Cost', 'Total Cost', 'Department', 'Reference', 'Notes'];
    if (reportType === 'lowstock') return ['Item Code', 'Item Name', 'Category', 'Department', 'Min Stock', 'Current Stock', 'Shortage'];
    if (reportType === 'opname') return ['Opname No.', 'Date', 'Department', 'Type', 'Status', 'Variance Value'];
    return [];
  }

  function getExportRows() {
    const arr = Array.isArray(data) ? data : [];
    if (reportType === 'valuation') return arr.map(r => [r.items?.code, r.items?.name, r.items?.brand||'', r.items?.item_categories?.name||'', r.departments?.code||'', r.quantity, r.avg_cost, r.total_value]);
    if (reportType === 'movement') return arr.map(r => [new Date(r.created_at).toLocaleDateString('id-ID'), r.items?.code+' - '+r.items?.name, r.movement_type, r.quantity, r.unit_cost, r.total_cost, r.departments?.code||'', r.reference_number||'', r.notes||'']);
    if (reportType === 'lowstock') return arr.map(r => [r.items?.code, r.items?.name, r.items?.item_categories?.name||'', r.departments?.code||'', r.items?.min_stock, r.quantity, r.items?.min_stock - r.quantity]);
    if (reportType === 'opname') return arr.map(r => [r.opname_number, new Date(r.opname_date).toLocaleDateString('id-ID'), r.departments?.code||'', r.opname_type, r.status, r.total_variance_value]);
    return [];
  }

  function exportExcel() {
    const headers = getExportHeaders();
    const rows = getExportRows();
    if (reportType === 'purchase') {
      const wb = XLSX.utils.book_new();
      const poHeaders = ['PO No.', 'Date', 'Vendor', 'Status', 'Total Amount'];
      const poRows = (data.pos||[]).map(r => [r.po_number, r.order_date, r.vendors?.name||'', r.status, r.total_amount]);
      const ws1 = XLSX.utils.aoa_to_sheet([poHeaders, ...poRows]);
      XLSX.utils.book_append_sheet(wb, ws1, 'Purchase Orders');
      const piHeaders = ['PI No.', 'Date', 'Vendor', 'From PO', 'Status', 'Payment', 'Total Amount'];
      const piRows = (data.pis||[]).map(r => [r.pi_number, r.invoice_date, r.vendors?.name||'', r.purchase_orders?.po_number||'', r.status, r.payment_status, r.total_amount]);
      const ws2 = XLSX.utils.aoa_to_sheet([piHeaders, ...piRows]);
      XLSX.utils.book_append_sheet(wb, ws2, 'Purchase Invoices');
      XLSX.writeFile(wb, `purchase_summary_${selectedOrg.code}.xlsx`);
    } else {
      const ws = XLSX.utils.aoa_to_sheet([headers, ...rows]);
      const wb = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(wb, ws, 'Report');
      XLSX.writeFile(wb, `${reportType}_report_${selectedOrg.code}.xlsx`);
    }
  }

  function exportPDF() {
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF({ orientation: 'landscape' });
    const reportNames = { valuation: t('reports.stockValuation'), movement: t('reports.stockMovement'), purchase: t('reports.purchaseSummary'), lowstock: t('reports.lowStock'), opname: t('reports.opnameSummary') };
    doc.setFontSize(16);
    doc.text(reportNames[reportType] || 'Report', 14, 15);
    doc.setFontSize(10);
    doc.text(`${selectedOrg?.name} | ${new Date().toLocaleDateString('id-ID')}`, 14, 22);

    if (reportType === 'purchase') {
      doc.setFontSize(12);
      doc.text('Purchase Orders', 14, 32);
      const poHeaders = ['PO No.', 'Date', 'Vendor', 'Status', 'Total'];
      const poRows = (data.pos||[]).map(r => [r.po_number, r.order_date, r.vendors?.name||'', r.status, formatCurrency(r.total_amount)]);
      doc.autoTable({ head: [poHeaders], body: poRows, startY: 35, styles: { fontSize: 8 } });
      doc.text('Purchase Invoices', 14, doc.lastAutoTable.finalY + 10);
      const piHeaders = ['PI No.', 'Date', 'Vendor', 'PO', 'Status', 'Payment', 'Total'];
      const piRows = (data.pis||[]).map(r => [r.pi_number, r.invoice_date, r.vendors?.name||'', r.purchase_orders?.po_number||'', r.status, r.payment_status, formatCurrency(r.total_amount)]);
      doc.autoTable({ head: [piHeaders], body: piRows, startY: doc.lastAutoTable.finalY + 13, styles: { fontSize: 8 } });
    } else {
      const headers = getExportHeaders();
      const rows = getExportRows().map(row => row.map(cell => typeof cell === 'number' ? formatNumber(cell) : (cell||'')));
      doc.autoTable({ head: [headers], body: rows, startY: 28, styles: { fontSize: 8 } });
    }
    doc.save(`${reportType}_report_${selectedOrg.code}.pdf`);
  }

  const reportTypes = [
    { id: 'valuation', label: t('reports.stockValuation') },
    { id: 'movement', label: t('reports.stockMovement') },
    { id: 'purchase', label: t('reports.purchaseSummary') },
    { id: 'lowstock', label: t('reports.lowStock') },
    { id: 'opname', label: t('reports.opnameSummary') },
  ];

  const showCatFilter = ['valuation', 'lowstock'].includes(reportType);
  const showDeptFilter = ['valuation', 'movement', 'opname'].includes(reportType);
  const showDateFilter = ['movement', 'purchase', 'opname'].includes(reportType);

  const arrData = Array.isArray(data) ? data : [];
  const totalValue = reportType === 'valuation' ? arrData.reduce((s, r) => s + (r.total_value || 0), 0) : 0;
  const totalItems = reportType === 'valuation' ? arrData.length : reportType === 'lowstock' ? arrData.length : 0;

  return (
    <div>
      <PageHeader title={t('reports.title')} subtitle={t('reports.subtitle')} />

      {/* Report selector & filters */}
      <div className="bg-white rounded-xl shadow-sm border border-gray-100 p-4 mb-6">
        <div className="flex flex-wrap gap-3 items-end">
          <div className="min-w-[180px]">
            <label className="text-xs font-medium text-gray-500 mb-1 block">{t('reports.selectReport')}</label>
            <select value={reportType} onChange={e => setReportType(e.target.value)} className="w-full px-3 py-2 border border-gray-200 rounded-lg text-sm bg-white">
              {reportTypes.map(rt => <option key={rt.id} value={rt.id}>{rt.label}</option>)}
            </select>
          </div>
          {showCatFilter && (
            <div className="min-w-[150px]">
              <label className="text-xs font-medium text-gray-500 mb-1 block">{t('reports.filterCategory')}</label>
              <select value={filterCat} onChange={e => setFilterCat(e.target.value)} className="w-full px-3 py-2 border border-gray-200 rounded-lg text-sm bg-white">
                <option value="">{t('reports.allCategories')}</option>
                {categories.map(c => <option key={c.id} value={c.id}>{c.code} - {c.name}</option>)}
              </select>
            </div>
          )}
          {showDeptFilter && (
            <div className="min-w-[150px]">
              <label className="text-xs font-medium text-gray-500 mb-1 block">{t('reports.filterDept')}</label>
              <select value={filterDept} onChange={e => setFilterDept(e.target.value)} className="w-full px-3 py-2 border border-gray-200 rounded-lg text-sm bg-white">
                <option value="">{t('reports.allDepts')}</option>
                {departments.map(d => <option key={d.id} value={d.id}>{d.code} - {d.name}</option>)}
              </select>
            </div>
          )}
          {showDateFilter && (
            <>
              <div className="min-w-[140px]">
                <label className="text-xs font-medium text-gray-500 mb-1 block">{t('reports.filterDateFrom')}</label>
                <input type="date" value={dateFrom} onChange={e => setDateFrom(e.target.value)} className="w-full px-3 py-2 border border-gray-200 rounded-lg text-sm" />
              </div>
              <div className="min-w-[140px]">
                <label className="text-xs font-medium text-gray-500 mb-1 block">{t('reports.filterDateTo')}</label>
                <input type="date" value={dateTo} onChange={e => setDateTo(e.target.value)} className="w-full px-3 py-2 border border-gray-200 rounded-lg text-sm" />
              </div>
            </>
          )}
          <Button onClick={generateReport}><Icons.BarChart /> {t('reports.generate')}</Button>
          <Button variant="secondary" onClick={exportPDF}>{t('reports.exportPDF')}</Button>
          <Button variant="secondary" onClick={exportExcel}>{t('reports.exportExcel')}</Button>
        </div>
      </div>

      {/* Summary cards for valuation */}
      {reportType === 'valuation' && (
        <div className="grid grid-cols-1 sm:grid-cols-3 gap-4 mb-6">
          <StatCard title={t('reports.totalStockValue')} value={formatCurrency(totalValue)} icon={Icons.Database} color="blue" />
          <StatCard title={t('reports.totalSKU')} value={formatNumber(totalItems)} icon={Icons.Package} color="green" />
          <StatCard title={t('reports.hotel')} value={selectedOrg?.name} icon={Icons.Building} color="purple" />
        </div>
      )}

      {/* Low stock summary */}
      {reportType === 'lowstock' && (
        <div className="grid grid-cols-1 sm:grid-cols-2 gap-4 mb-6">
          <StatCard title={t('reports.lowStock')} value={formatNumber(arrData.length)} icon={Icons.AlertTriangle} color="red" />
          <StatCard title={t('reports.hotel')} value={selectedOrg?.name} icon={Icons.Building} color="purple" />
        </div>
      )}

      {/* Purchase summary cards */}
      {reportType === 'purchase' && !Array.isArray(data) && data.pos && (
        <div className="grid grid-cols-1 sm:grid-cols-4 gap-4 mb-6">
          <StatCard title={t('reports.totalPO')} value={formatNumber(data.pos.length)} icon={Icons.ShoppingCart} color="blue" />
          <StatCard title={t('reports.totalPOValue')} value={formatCurrency(data.pos.reduce((s,r) => s+(r.total_amount||0), 0))} icon={Icons.Database} color="green" />
          <StatCard title={t('reports.totalPI')} value={formatNumber(data.pis.length)} icon={Icons.ClipboardList} color="purple" />
          <StatCard title={t('reports.totalPIValue')} value={formatCurrency(data.pis.reduce((s,r) => s+(r.total_amount||0), 0))} icon={Icons.Database} color="orange" />
        </div>
      )}

      {/* Report data tables */}
      <div className="bg-white rounded-xl shadow-sm border border-gray-100">
        <div className="p-4 border-b border-gray-100">
          <h3 className="font-semibold text-gray-800">{reportTypes.find(r=>r.id===reportType)?.label}</h3>
        </div>

        {reportType === 'valuation' && (
          <DataTable loading={loading} columns={[
            { header: t('dashboard.item'), render: r => <div><span className="font-medium">{r.items?.name}</span>{r.items?.brand ? <span className="text-xs text-gray-400 ml-1">({r.items.brand})</span> : ''}<br/><span className="text-xs text-gray-400">{r.items?.code}</span></div> },
            { header: t('items.category'), render: r => <Badge color="purple">{r.items?.item_categories?.code}</Badge> },
            { header: t('stock.dept'), render: r => <Badge color="blue">{r.departments?.code}</Badge> },
            { header: t('dashboard.qty'), render: r => formatNumber(r.quantity) },
            { header: t('stock.avgCost'), render: r => formatCurrency(r.avg_cost) },
            { header: t('stock.totalValue'), render: r => <span className="font-semibold">{formatCurrency(r.total_value)}</span> },
          ]} data={arrData} />
        )}

        {reportType === 'movement' && (
          <DataTable loading={loading} columns={[
            { header: t('common.date'), render: r => new Date(r.created_at).toLocaleDateString('id-ID') },
            { header: t('dashboard.item'), render: r => <span className="text-xs">{r.items?.code} - {r.items?.name}</span> },
            { header: t('reports.movementType'), render: r => <Badge color={r.movement_type==='IN'?'green':r.movement_type==='OUT'?'red':'yellow'}>{r.movement_type}</Badge> },
            { header: t('reports.movementQty'), render: r => <span className={r.movement_type==='IN'?'text-green-600':r.movement_type==='OUT'?'text-red-600':''}>{r.movement_type==='OUT'?'-':r.movement_type==='IN'?'+':''}{formatNumber(r.quantity)}</span> },
            { header: t('stock.dept'), render: r => <Badge color="blue">{r.departments?.code}</Badge> },
            { header: t('reports.reference'), render: r => <span className="font-mono text-xs">{r.reference_number||'-'}</span> },
          ]} data={arrData} />
        )}

        {reportType === 'purchase' && !Array.isArray(data) && data.pos && (
          <div>
            <div className="p-3 bg-gray-50 border-b"><span className="font-semibold text-sm">Purchase Orders ({data.pos.length})</span></div>
            <DataTable loading={loading} columns={[
              { header: t('reports.poNumber'), render: r => <span className="font-mono text-xs font-semibold text-primary-700">{r.po_number}</span> },
              { header: t('common.date'), render: r => new Date(r.order_date).toLocaleDateString('id-ID') },
              { header: t('reports.vendorName'), render: r => r.vendors?.name || '-' },
              { header: t('common.status'), render: r => <StatusBadge status={r.status}/> },
              { header: t('po.totalAmount'), render: r => <span className="font-semibold">{formatCurrency(r.total_amount)}</span> },
            ]} data={data.pos} />
            <div className="p-3 bg-gray-50 border-b border-t"><span className="font-semibold text-sm">Purchase Invoices ({data.pis.length})</span></div>
            <DataTable loading={false} columns={[
              { header: t('reports.piNumber'), render: r => <span className="font-mono text-xs font-semibold text-primary-700">{r.pi_number}</span> },
              { header: t('common.date'), render: r => new Date(r.invoice_date).toLocaleDateString('id-ID') },
              { header: t('reports.vendorName'), render: r => r.vendors?.name || '-' },
              { header: t('pi.fromPO'), render: r => r.purchase_orders?.po_number ? <Badge color="blue">{r.purchase_orders.po_number}</Badge> : '-' },
              { header: t('common.status'), render: r => <StatusBadge status={r.status}/> },
              { header: t('pi.paymentStatus'), render: r => <Badge color={r.payment_status==='PAID'?'green':r.payment_status==='PARTIAL'?'yellow':'red'}>{r.payment_status}</Badge> },
              { header: t('pi.totalAmount'), render: r => <span className="font-semibold">{formatCurrency(r.total_amount)}</span> },
            ]} data={data.pis} />
          </div>
        )}

        {reportType === 'lowstock' && (
          <DataTable loading={loading} columns={[
            { header: t('dashboard.item'), render: r => <div><span className="font-medium">{r.items?.name}</span><br/><span className="text-xs text-gray-400">{r.items?.code}</span></div> },
            { header: t('items.category'), render: r => <Badge color="purple">{r.items?.item_categories?.code}</Badge> },
            { header: t('stock.dept'), render: r => <Badge color="blue">{r.departments?.code}</Badge> },
            { header: t('reports.minStock'), render: r => formatNumber(r.items?.min_stock) },
            { header: t('reports.currentStock'), render: r => <span className="text-red-600 font-semibold">{formatNumber(r.quantity)}</span> },
            { header: t('reports.shortage'), render: r => <span className="text-red-700 font-bold">-{formatNumber(r.items?.min_stock - r.quantity)}</span> },
          ]} data={arrData} />
        )}

        {reportType === 'opname' && (
          <DataTable loading={loading} columns={[
            { header: t('reports.opnameNumber'), render: r => <span className="font-mono text-xs font-semibold text-primary-700">{r.opname_number}</span> },
            { header: t('common.date'), render: r => new Date(r.opname_date).toLocaleDateString('id-ID') },
            { header: t('stock.dept'), render: r => <Badge color="blue">{r.departments?.code}</Badge> },
            { header: t('opname.type'), render: r => <Badge color={r.opname_type==='annual'?'purple':r.opname_type==='spot'?'orange':'gray'}>{r.opname_type}</Badge> },
            { header: t('common.status'), render: r => <StatusBadge status={r.status}/> },
            { header: t('reports.varianceValue'), render: r => <span className={r.total_variance_value < 0 ? 'text-red-600 font-semibold' : r.total_variance_value > 0 ? 'text-green-600 font-semibold' : ''}>{formatCurrency(r.total_variance_value)}</span> },
          ]} data={arrData} />
        )}

        {!loading && ((Array.isArray(data) && data.length === 0) || (!Array.isArray(data) && data.pos && data.pos.length === 0 && data.pis && data.pis.length === 0)) && (
          <div className="p-8 text-center text-gray-500">{t('reports.noData')}</div>
        )}
      </div>
    </div>
  );
}

// APPROVAL CENTER PAGE

function ApprovalPage() {
  const { selectedOrg, showNotification, currentUser } = useApp();
  const { t } = useTranslation();
  const [tab, setTab] = useState('pending');
  const [loading, setLoading] = useState(true);
  const [pendingItems, setPendingItems] = useState([]);
  const [historyItems, setHistoryItems] = useState([]);
  const [users, setUsers] = useState([]);
  const [rejectModal, setRejectModal] = useState(null);
  const [rejectNotes, setRejectNotes] = useState('');

  const userRole = currentUser?.role?.code || '';

  function getUserName(userId) {
    const u = users.find(u => u.id === userId);
    return u ? u.full_name || u.username : '-';
  }

  async function loadAll() {
    if (!selectedOrg) return;
    setLoading(true);
    const [prRes, poRes, piRes, woRes, opnRes, usersRes, logRes] = await Promise.all([
      supabase.from('purchase_requests').select('*, users:created_by(full_name)').eq('organization_id', selectedOrg.id).eq('status', 'PENDING'),
      supabase.from('purchase_orders').select('*, vendors(name)').eq('organization_id', selectedOrg.id).eq('status', 'PENDING'),
      supabase.from('purchase_invoices').select('*, vendors(name)').eq('organization_id', selectedOrg.id).eq('status', 'PENDING'),
      supabase.from('write_offs').select('*, departments(name)').eq('organization_id', selectedOrg.id).eq('status', 'PENDING'),
      supabase.from('stock_opname').select('*').eq('organization_id', selectedOrg.id).eq('status', 'SUBMITTED'),
      supabase.from('users').select('id, username, full_name, role_id, roles:role_id(code)').eq('is_active', true),
      supabase.from('approval_logs').select('*, users:action_by(full_name)').eq('organization_id', selectedOrg.id).order('created_at', { ascending: false }).limit(100),
    ]);
    const pending = [];
    (prRes.data || []).forEach(r => pending.push({ ...r, _type: 'PR', _number: r.pr_number, _date: r.request_date, _desc: r.notes || '-' }));
    (poRes.data || []).forEach(r => pending.push({ ...r, _type: 'PO', _number: r.po_number, _date: r.order_date, _desc: r.vendors?.name || '-' }));
    (piRes.data || []).forEach(r => pending.push({ ...r, _type: 'PI', _number: r.pi_number, _date: r.invoice_date, _desc: r.vendors?.name || '-' }));
    (woRes.data || []).forEach(r => pending.push({ ...r, _type: 'WRITEOFF', _number: r.wo_number, _date: r.write_off_date, _desc: r.departments?.name || r.reason || '-' }));
    (opnRes.data || []).forEach(r => pending.push({ ...r, _type: 'STOCK_OPNAME', _number: r.opname_number, _date: r.opname_date, _desc: 'Stock Opname' }));
    // Sort by date desc
    pending.sort((a, b) => new Date(b._date) - new Date(a._date));
    setPendingItems(pending);
    setUsers(usersRes.data || []);
    setHistoryItems(logRes.data || []);
    setLoading(false);
  }

  React.useEffect(() => { loadAll(); }, [selectedOrg?.id]);

  function canApprove(item) {
    if (userRole === 'superadmin' || userRole === 'gm') return true;
    if (userRole === 'findir' && (item._type === 'WRITEOFF' || item._type === 'STOCK_OPNAME')) return true;
    return false;
  }

  async function handleApprove(item) {
    if (!confirm(t('approval.confirmApprove'))) return;
    const now = new Date().toISOString();
    let tableName, upd;

    if (item._type === 'WRITEOFF' || item._type === 'STOCK_OPNAME') {
      // Dual approval for write-off and stock opname
      tableName = item._type === 'WRITEOFF' ? 'write_offs' : 'stock_opname';
      if (userRole === 'superadmin') {
        // Superadmin can do both approvals
        if (!item.gm_approved_by && !item.findir_approved_by) {
          // First approval as GM
          upd = { gm_approved_by: currentUser?.id, gm_approved_at: now };
        } else if (item.gm_approved_by && !item.findir_approved_by) {
          // GM done, complete as FinDir = fully approved
          upd = { status: 'APPROVED', findir_approved_by: currentUser?.id, findir_approved_at: now };
        } else if (!item.gm_approved_by && item.findir_approved_by) {
          // FinDir done, complete as GM = fully approved
          upd = { status: 'APPROVED', gm_approved_by: currentUser?.id, gm_approved_at: now };
        }
      } else if (userRole === 'gm') {
        if (item.findir_approved_by) {
          // FinDir already approved, GM completing = fully approved
          upd = { status: 'APPROVED', gm_approved_by: currentUser?.id, gm_approved_at: now };
        } else {
          // GM approving first, still waiting for FinDir
          upd = { gm_approved_by: currentUser?.id, gm_approved_at: now };
        }
      } else if (userRole === 'findir') {
        if (item.gm_approved_by) {
          // GM already approved, FinDir completing = fully approved
          upd = { status: 'APPROVED', findir_approved_by: currentUser?.id, findir_approved_at: now };
        } else {
          // FinDir approving first, still waiting for GM
          upd = { findir_approved_by: currentUser?.id, findir_approved_at: now };
        }
      }
    } else {
      // Single approval for PR, PO, PI (GM only)
      tableName = item._type === 'PR' ? 'purchase_requests' : item._type === 'PO' ? 'purchase_orders' : 'purchase_invoices';
      upd = { status: 'APPROVED', approved_by: currentUser?.id, approved_at: now };
    }

    const { error } = await supabase.from(tableName).update(upd).eq('id', item.id);
    if (error) { showNotification('Error: ' + error.message, 'error'); return; }

    await supabase.from('approval_logs').insert({
      organization_id: selectedOrg.id, document_type: item._type, document_id: item.id,
      document_number: item._number, action: 'APPROVED', action_by: currentUser?.id,
      approval_level: (item._type === 'WRITEOFF' && userRole === 'findir') ? 2 : 1,
    });
    showNotification(item._number + ' approved', 'success');
    loadAll();
  }

  async function handleReject(item) {
    setRejectModal(item);
    setRejectNotes('');
  }

  async function confirmReject() {
    const item = rejectModal;
    if (!item) return;
    const now = new Date().toISOString();
    const tableName = item._type === 'PR' ? 'purchase_requests' : item._type === 'PO' ? 'purchase_orders' : item._type === 'PI' ? 'purchase_invoices' : item._type === 'STOCK_OPNAME' ? 'stock_opname' : 'write_offs';
    const upd = { status: 'REJECTED', rejected_by: currentUser?.id, rejected_at: now, rejection_notes: rejectNotes || null };
    const { error } = await supabase.from(tableName).update(upd).eq('id', item.id);
    if (error) { showNotification('Error: ' + error.message, 'error'); return; }

    await supabase.from('approval_logs').insert({
      organization_id: selectedOrg.id, document_type: item._type, document_id: item.id,
      document_number: item._number, action: 'REJECTED', action_by: currentUser?.id,
      notes: rejectNotes || null,
    });
    showNotification(item._number + ' rejected', 'error');
    setRejectModal(null);
    loadAll();
  }

  const typeColors = { PR: 'blue', PO: 'purple', PI: 'orange', WRITEOFF: 'red', STOCK_OPNAME: 'green' };

  return (
    <div>
      <PageHeader title={t('approval.pageTitle')} subtitle={t('approval.pageSubtitle')} />

      <div className="flex gap-2 mb-4">
        <button onClick={() => setTab('pending')}
          className={`px-4 py-2 rounded-lg text-sm font-medium transition-colors ${tab === 'pending' ? 'bg-primary-600 text-white' : 'bg-gray-100 text-gray-600 hover:bg-gray-200'}`}>
          {t('approval.pending')} {pendingItems.length > 0 && <span className="ml-1 bg-red-500 text-white text-xs rounded-full px-1.5 py-0.5">{pendingItems.length}</span>}
        </button>
        <button onClick={() => setTab('history')}
          className={`px-4 py-2 rounded-lg text-sm font-medium transition-colors ${tab === 'history' ? 'bg-primary-600 text-white' : 'bg-gray-100 text-gray-600 hover:bg-gray-200'}`}>
          {t('approval.history')}
        </button>
      </div>

      {tab === 'pending' && (
        <div className="bg-white rounded-xl shadow-sm border border-gray-100">
          {loading ? <div className="p-8 text-center">Loading...</div> : pendingItems.length === 0 ? (
            <div className="p-12 text-center text-gray-400"><Icons.Shield /><p className="mt-2">{t('approval.noPending')}</p></div>
          ) : (
            <div className="divide-y divide-gray-100">
              {pendingItems.map(item => (
                <div key={item._type + '-' + item.id} className="p-4 hover:bg-gray-50 transition-colors">
                  <div className="flex items-center justify-between">
                    <div className="flex items-center gap-3">
                      <Badge color={typeColors[item._type]}>{item._type}</Badge>
                      <span className="font-mono text-sm font-semibold text-gray-900">{item._number}</span>
                      <span className="text-sm text-gray-500">{new Date(item._date).toLocaleDateString('id-ID')}</span>
                      <span className="text-sm text-gray-400">{item._desc}</span>
                      {(item._type === 'WRITEOFF' || item._type === 'STOCK_OPNAME') && (
                        <span className="text-xs text-amber-600 bg-amber-50 px-2 py-0.5 rounded">
                          {item.gm_approved_by && !item.findir_approved_by ? t('approval.waitingFinDir') :
                           !item.gm_approved_by && item.findir_approved_by ? t('approval.waitingGM') :
                           t('approval.waitingBoth')}
                        </span>
                      )}
                    </div>
                    <div className="flex items-center gap-2">
                      {item.submitted_by && <span className="text-xs text-gray-400">{t('approval.submittedBy')}: {getUserName(item.submitted_by)}</span>}
                      {canApprove(item) && (
                        <>
                          <button onClick={() => handleApprove(item)} className="px-3 py-1.5 text-xs font-medium bg-green-50 text-green-700 rounded-lg hover:bg-green-100 transition-colors">
                            <Icons.Check /> {t('approval.approve')}
                          </button>
                          <button onClick={() => handleReject(item)} className="px-3 py-1.5 text-xs font-medium bg-red-50 text-red-700 rounded-lg hover:bg-red-100 transition-colors">
                            <Icons.X /> {t('approval.reject')}
                          </button>
                        </>
                      )}
                    </div>
                  </div>
                </div>
              ))}
            </div>
          )}
        </div>
      )}

      {tab === 'history' && (
        <div className="bg-white rounded-xl shadow-sm border border-gray-100">
          {loading ? <div className="p-8 text-center">Loading...</div> : historyItems.length === 0 ? (
            <div className="p-12 text-center text-gray-400">No approval history</div>
          ) : (
            <DataTable loading={false}
              columns={[
                { header: 'Type', render: r => <Badge color={typeColors[r.document_type] || 'gray'}>{r.document_type}</Badge> },
                { header: 'Document', render: r => <span className="font-mono text-xs font-semibold">{r.document_number}</span> },
                { header: 'Action', render: r => (
                  <Badge color={r.action === 'APPROVED' ? 'green' : r.action === 'REJECTED' ? 'red' : 'blue'}>{r.action}</Badge>
                )},
                { header: 'By', render: r => r.users?.full_name || '-' },
                { header: 'Date', render: r => new Date(r.action_at).toLocaleString('id-ID') },
                { header: 'Notes', render: r => r.notes || '-' },
                { header: 'Level', render: r => r.approval_level > 1 ? `Level ${r.approval_level}` : '-' },
              ]}
              data={historyItems}
            />
          )}
        </div>
      )}

      <Modal open={!!rejectModal} onClose={() => setRejectModal(null)} title={t('approval.reject') + ' ' + (rejectModal?._number || '')} size="sm">
        <FormField label={t('approval.rejectReason')}>
          <textarea value={rejectNotes} onChange={e => setRejectNotes(e.target.value)} rows={3}
            className="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-red-500 focus:border-transparent" />
        </FormField>
        <div className="flex justify-end gap-2 mt-4">
          <Button onClick={() => setRejectModal(null)}>{t('common.cancel')}</Button>
          <Button variant="primary" onClick={confirmReject} className="bg-red-600 hover:bg-red-700">{t('approval.reject')}</Button>
        </div>
      </Modal>
    </div>
  );
}

function UserManagementPage() {
  const { showNotification } = useApp();
  const { t } = useTranslation();
  const [users, setUsers] = useState([]);
  const [roles, setRoles] = useState([]);
  const [orgs, setOrgs] = useState([]);
  const [departments, setDepartments] = useState([]);
  const [loading, setLoading] = useState(true);
  const [showForm, setShowForm] = useState(false);
  const [editing, setEditing] = useState(null);
  const [form, setForm] = useState({ full_name: '', username: '', email: '', phone: '', role_id: '', organization_id: '', department_id: '', is_active: true, password: '' });

  useEffect(() => { loadData(); }, []);

  async function loadData() {
    setLoading(true);
    const [usersRes, rolesRes, orgsRes, deptRes] = await Promise.all([
      supabase.from('users').select('*, roles(name), organizations(name, code), departments(name, code)').order('full_name'),
      supabase.from('roles').select('id, name').order('name'),
      supabase.from('organizations').select('id, name, code').order('name'),
      supabase.from('departments').select('id, name, code, organization_id').eq('is_active', true).order('name'),
    ]);
    setUsers(usersRes.data || []);
    setRoles(rolesRes.data || []);
    setOrgs(orgsRes.data || []);
    setDepartments(deptRes.data || []);
    setLoading(false);
  }

  function openCreate() {
    setEditing(null);
    setForm({ full_name: '', username: '', email: '', phone: '', role_id: '', organization_id: '', department_id: '', is_active: true, password: '' });
    setShowForm(true);
  }

  function openEdit(user) {
    setEditing(user);
    setForm({ full_name: user.full_name || '', username: user.username || '', email: user.email || '', phone: user.phone || '', role_id: user.role_id || '', organization_id: user.organization_id || '', department_id: user.department_id || '', is_active: user.is_active !== false, password: '' });
    setShowForm(true);
  }

  async function handleSave() {
    const payload = { full_name: form.full_name, username: form.username || null, email: form.email, phone: form.phone || null, role_id: form.role_id || null, organization_id: form.organization_id || null, department_id: form.department_id || null, is_active: form.is_active };
    if (form.password && form.password.length >= 6) {
      payload.password_hash = await hashPassword(form.password);
    }
    if (editing) {
      await supabase.from('users').update(payload).eq('id', editing.id);
    } else {
      await supabase.from('users').insert(payload);
    }
    showNotification(t('users.successSave'), 'success');
    setShowForm(false);
    loadData();
  }

  async function handleDelete(user) {
    // Check dependencies
    const [smRes, acRes, iuRes] = await Promise.all([
      supabase.from('stock_movements').select('id', { count: 'exact', head: true }).eq('created_by', user.id),
      supabase.from('makeup_activity_checks').select('id', { count: 'exact', head: true }).eq('checked_by', user.id),
      supabase.from('makeup_inuse_checks').select('id', { count: 'exact', head: true }).eq('checked_by', user.id),
    ]);
    const deps = [];
    if (smRes.count > 0) deps.push(`${smRes.count} stock movement(s)`);
    if (acRes.count > 0) deps.push(`${acRes.count} activity check(s)`);
    if (iuRes.count > 0) deps.push(`${iuRes.count} in-use check(s)`);
    if (deps.length > 0) {
      const msg = `Cannot delete user "${user.full_name}" — linked data: ${deps.join(', ')}. Deactivate instead?`;
      if (confirm(msg)) {
        await supabase.from('users').update({ is_active: false }).eq('id', user.id);
        loadData();
      }
      return;
    }
    if (!confirm(t('users.confirmDelete'))) return;
    await supabase.from('users').delete().eq('id', user.id);
    showNotification(t('users.successDelete'), 'success');
    loadData();
  }

  const filteredDepts = form.organization_id ? departments.filter(d => d.organization_id === form.organization_id) : departments;

  return (
    <div>
      <PageHeader title={t('users.title')} subtitle={t('users.subtitle')} actions={<Button onClick={openCreate}><Icons.Plus /> {t('users.createUser')}</Button>} />

      <div className="bg-white rounded-xl shadow-sm border border-gray-100">
        <DataTable loading={loading}
          columns={[
            { header: t('users.fullName'), render: r => <div><span className="font-medium">{r.full_name}</span>{r.username ? <span className="text-xs text-gray-400 ml-1">@{r.username}</span> : ''}</div> },
            { header: t('users.email'), render: r => <span className="text-sm">{r.email}</span> },
            { header: t('users.role'), render: r => <Badge color="purple">{r.roles?.name || '-'}</Badge> },
            { header: t('users.hotel'), render: r => r.organizations ? <Badge color="blue">{r.organizations.code}</Badge> : <Badge color="gray">{t('users.allHotels')}</Badge> },
            { header: t('users.department'), render: r => r.departments ? <Badge color="green">{r.departments.code}</Badge> : <span className="text-gray-400">-</span> },
            { header: t('common.status'), render: r => <Badge color={r.is_active?'green':'red'}>{r.is_active ? t('common.active') : t('common.inactive')}</Badge> },
          ]}
          data={users}
          actions={row => (
            <div className="flex gap-1 justify-end">
              <button onClick={() => openEdit(row)} className="p-1 text-blue-600 hover:bg-blue-50 rounded"><Icons.Edit /></button>
              <button onClick={() => handleDelete(row)} className="p-1 text-red-600 hover:bg-red-50 rounded"><Icons.Trash /></button>
            </div>
          )}
        />
      </div>

      <Modal open={showForm} onClose={() => setShowForm(false)} title={editing ? t('users.editUser') : t('users.createUser')}>
        <div className="space-y-3">
          <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
            <div>
              <label className="text-xs font-medium text-gray-500 mb-1 block">{t('users.fullName')} *</label>
              <input value={form.full_name} onChange={e => setForm({...form, full_name: e.target.value})} className="w-full px-3 py-2 border border-gray-200 rounded-lg text-sm" />
            </div>
            <div>
              <label className="text-xs font-medium text-gray-500 mb-1 block">{t('users.username')}</label>
              <input value={form.username} onChange={e => setForm({...form, username: e.target.value})} className="w-full px-3 py-2 border border-gray-200 rounded-lg text-sm" placeholder="optional" />
            </div>
          </div>
          <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
            <div>
              <label className="text-xs font-medium text-gray-500 mb-1 block">{t('users.email')} *</label>
              <input type="email" value={form.email} onChange={e => setForm({...form, email: e.target.value})} className="w-full px-3 py-2 border border-gray-200 rounded-lg text-sm" />
            </div>
            <div>
              <label className="text-xs font-medium text-gray-500 mb-1 block">{t('users.phone')}</label>
              <input value={form.phone} onChange={e => setForm({...form, phone: e.target.value})} className="w-full px-3 py-2 border border-gray-200 rounded-lg text-sm" />
            </div>
          </div>
          <div>
            <label className="text-xs font-medium text-gray-500 mb-1 block">{t('users.password')}</label>
            <input type="password" value={form.password} onChange={e => setForm({...form, password: e.target.value})} className="w-full px-3 py-2 border border-gray-200 rounded-lg text-sm" placeholder={t('users.passwordHint')} />
          </div>
          <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
            <div>
              <label className="text-xs font-medium text-gray-500 mb-1 block">{t('users.role')}</label>
              <select value={form.role_id} onChange={e => setForm({...form, role_id: e.target.value})} className="w-full px-3 py-2 border border-gray-200 rounded-lg text-sm bg-white">
                <option value="">{t('users.selectRole')}</option>
                {roles.map(r => <option key={r.id} value={r.id}>{r.name}</option>)}
              </select>
            </div>
            <div>
              <label className="text-xs font-medium text-gray-500 mb-1 block">{t('users.hotel')}</label>
              <select value={form.organization_id} onChange={e => setForm({...form, organization_id: e.target.value, department_id: ''})} className="w-full px-3 py-2 border border-gray-200 rounded-lg text-sm bg-white">
                <option value="">{t('users.allHotels')}</option>
                {orgs.map(o => <option key={o.id} value={o.id}>{o.code} - {o.name}</option>)}
              </select>
            </div>
          </div>
          <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
            <div>
              <label className="text-xs font-medium text-gray-500 mb-1 block">{t('users.department')}</label>
              <select value={form.department_id} onChange={e => setForm({...form, department_id: e.target.value})} className="w-full px-3 py-2 border border-gray-200 rounded-lg text-sm bg-white">
                <option value="">{t('users.selectDept')}</option>
                {filteredDepts.map(d => <option key={d.id} value={d.id}>{d.code} - {d.name}</option>)}
              </select>
            </div>
            <div className="flex items-end pb-1">
              <label className="flex items-center gap-2 cursor-pointer">
                <input type="checkbox" checked={form.is_active} onChange={e => setForm({...form, is_active: e.target.checked})} className="w-4 h-4 rounded border-gray-300" />
                <span className="text-sm font-medium text-gray-700">{t('common.active')}</span>
              </label>
            </div>
          </div>
          <div className="flex justify-end gap-2 pt-3 border-t">
            <Button variant="secondary" onClick={() => setShowForm(false)}>{t('common.cancel')}</Button>
            <Button onClick={handleSave} disabled={!form.full_name || !form.email}>{t('common.save')}</Button>
          </div>
        </div>
      </Modal>
    </div>
  );
}

  { id: 'approve_pi', label: 'roles.action.approve_pi' },

function RoleManagementPage() {
  const { showNotification } = useApp();
  const { t } = useTranslation();
  const [roles, setRoles] = useState([]);
  const [loading, setLoading] = useState(true);
  const [showForm, setShowForm] = useState(false);
  const [editing, setEditing] = useState(null);
  const [form, setForm] = useState({ name: '', description: '', menus: {}, actions: {} });

  useEffect(() => { loadRoles(); }, []);

  async function loadRoles() {
    setLoading(true);
    const { data } = await supabase.from('roles').select('*').order('name');
    setRoles(data || []);
    setLoading(false);
  }

  function parsePermissions(perms) {
    if (!perms) return { menus: {}, actions: {} };
    if (perms.all === true) {
      const menus = {}; ALL_MENUS.forEach(m => menus[m.id] = true);
      const actions = {}; ALL_ACTIONS.forEach(a => actions[a.id] = true);
      return { menus, actions };
    }
    const menus = {}; const actions = {};
    if (perms.menu_access) { Object.keys(perms.menu_access).forEach(k => menus[k] = !!perms.menu_access[k]); }
    if (perms.special_actions) { Object.keys(perms.special_actions).forEach(k => actions[k] = !!perms.special_actions[k]); }
    return { menus, actions };
  }

  function buildPermissions(menus, actions) {
    const allMenus = ALL_MENUS.every(m => menus[m.id]);
    const allActions = ALL_ACTIONS.every(a => actions[a.id]);
    if (allMenus && allActions) return { all: true };
    return { menu_access: { ...menus }, special_actions: { ...actions } };
  }

  function openCreate() {
    setEditing(null);
    setForm({ name: '', description: '', menus: {}, actions: {} });
    setShowForm(true);
  }

  function openEdit(role) {
    setEditing(role);
    const parsed = parsePermissions(role.permissions);
    setForm({ name: role.name, description: role.description || '', menus: parsed.menus, actions: parsed.actions });
    setShowForm(true);
  }

  function toggleMenu(menuId) {
    setForm(f => ({ ...f, menus: { ...f.menus, [menuId]: !f.menus[menuId] } }));
  }

  function toggleAction(actionId) {
    setForm(f => ({ ...f, actions: { ...f.actions, [actionId]: !f.actions[actionId] } }));
  }

  function toggleAllMenus() {
    const allOn = ALL_MENUS.every(m => form.menus[m.id]);
    const menus = {};
    ALL_MENUS.forEach(m => menus[m.id] = !allOn);
    setForm(f => ({ ...f, menus }));
  }

  function toggleAllActions() {
    const allOn = ALL_ACTIONS.every(a => form.actions[a.id]);
    const actions = {};
    ALL_ACTIONS.forEach(a => actions[a.id] = !allOn);
    setForm(f => ({ ...f, actions }));
  }

  async function handleSave() {
    const permissions = buildPermissions(form.menus, form.actions);
    const payload = { name: form.name, description: form.description, permissions };
    if (editing) {
      await supabase.from('roles').update(payload).eq('id', editing.id);
    } else {
      payload.is_system = false;
      await supabase.from('roles').insert(payload);
    }
    showNotification(t('roles.successSave'), 'success');
    setShowForm(false);
    loadRoles();
  }

  async function handleDelete(role) {
    if (role.is_system) { showNotification(t('roles.cannotDeleteSystem'), 'error'); return; }
    const { count } = await supabase.from('users').select('id', { count: 'exact', head: true }).eq('role_id', role.id);
    if (count > 0) {
      showNotification(`Cannot delete role "${role.name}" — ${count} user(s) assigned to this role.`, 'error');
      return;
    }
    if (!confirm(t('roles.confirmDelete'))) return;
    await supabase.from('roles').delete().eq('id', role.id);
    showNotification(t('roles.successDelete'), 'success');
    loadRoles();
  }

  function getPermSummary(role) {
    const p = role.permissions || {};
    if (p.all) return 'Full Access';
    const ma = p.menu_access || {};
    const menuCount = Object.values(ma).filter(Boolean).length;
    const sa = p.special_actions || {};
    const actCount = Object.values(sa).filter(Boolean).length;
    return `${menuCount} menu, ${actCount} action`;
  }

  return (
    <div>
      <PageHeader title={t('roles.title')} subtitle={t('roles.subtitle')} actions={<Button onClick={openCreate}><Icons.Plus /> {t('roles.createRole')}</Button>} />

      <div className="bg-white rounded-xl shadow-sm border border-gray-100">
        <DataTable loading={loading}
          columns={[
            { header: t('roles.roleName'), render: r => <span className="font-semibold">{r.name}</span> },
            { header: t('roles.description'), render: r => <span className="text-sm text-gray-600">{r.description || '-'}</span> },
            { header: t('roles.permissions'), render: r => <Badge color={r.permissions?.all ? 'green' : 'blue'}>{getPermSummary(r)}</Badge> },
            { header: t('common.status'), render: r => r.is_system ? <Badge color="purple">{t('roles.system')}</Badge> : <Badge color="gray">Custom</Badge> },
          ]}
          data={roles}
          actions={row => (
            <div className="flex gap-1 justify-end">
              <button onClick={() => openEdit(row)} className="p-1 text-blue-600 hover:bg-blue-50 rounded"><Icons.Edit /></button>
              {!row.is_system && <button onClick={() => handleDelete(row)} className="p-1 text-red-600 hover:bg-red-50 rounded"><Icons.Trash /></button>}
            </div>
          )}
        />
      </div>

      <Modal open={showForm} onClose={() => setShowForm(false)} title={editing ? t('roles.editRole') : t('roles.createRole')}>
        <div className="space-y-4">
          <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
            <div>
              <label className="text-xs font-medium text-gray-500 mb-1 block">{t('roles.roleName')} *</label>
              <input value={form.name} onChange={e => setForm({...form, name: e.target.value})} className="w-full px-3 py-2 border border-gray-200 rounded-lg text-sm" />
            </div>
            <div>
              <label className="text-xs font-medium text-gray-500 mb-1 block">{t('roles.description')}</label>
              <input value={form.description} onChange={e => setForm({...form, description: e.target.value})} className="w-full px-3 py-2 border border-gray-200 rounded-lg text-sm" />
            </div>
          </div>

          {/* Menu Access */}
          <div>
            <div className="flex items-center justify-between mb-2">
              <h4 className="text-sm font-semibold text-gray-700">{t('roles.menuAccess')}</h4>
              <button onClick={toggleAllMenus} className="text-xs text-primary-600 hover:text-primary-700 font-medium">
                {ALL_MENUS.every(m => form.menus[m.id]) ? 'Deselect All' : 'Select All'}
              </button>
            </div>
            <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-1 bg-gray-50 p-3 rounded-lg max-h-48 overflow-y-auto">
              {ALL_MENUS.map(menu => (
                <label key={menu.id} className="flex items-center gap-2 py-1 px-2 rounded hover:bg-white cursor-pointer text-xs">
                  <input type="checkbox" checked={!!form.menus[menu.id]} onChange={() => toggleMenu(menu.id)} className="w-3.5 h-3.5 rounded border-gray-300 text-primary-600" />
                  <span className="text-gray-700">{menu.label}</span>
                </label>
              ))}
            </div>
          </div>

          {/* Special Actions */}
          <div>
            <div className="flex items-center justify-between mb-2">
              <h4 className="text-sm font-semibold text-gray-700">{t('roles.specialActions')}</h4>
              <button onClick={toggleAllActions} className="text-xs text-primary-600 hover:text-primary-700 font-medium">
                {ALL_ACTIONS.every(a => form.actions[a.id]) ? 'Deselect All' : 'Select All'}
              </button>
            </div>
            <div className="grid grid-cols-1 sm:grid-cols-2 gap-1 bg-gray-50 p-3 rounded-lg">
              {ALL_ACTIONS.map(action => (
                <label key={action.id} className="flex items-center gap-2 py-1 px-2 rounded hover:bg-white cursor-pointer text-xs">
                  <input type="checkbox" checked={!!form.actions[action.id]} onChange={() => toggleAction(action.id)} className="w-3.5 h-3.5 rounded border-gray-300 text-primary-600" />
                  <span className="text-gray-700">{t(action.label)}</span>
                </label>
              ))}
            </div>
          </div>

          <div className="flex justify-end gap-2 pt-3 border-t">
            <Button variant="secondary" onClick={() => setShowForm(false)}>{t('common.cancel')}</Button>
            <Button onClick={handleSave} disabled={!form.name}>{t('common.save')}</Button>
          </div>
        </div>
      </Modal>
    </div>
  );
}

function ChangePasswordPage() {
  const { showNotification } = useApp();
  const { t } = useTranslation();
  const [users, setUsers] = useState([]);
  const [selectedUserId, setSelectedUserId] = useState('');
  const [currentPassword, setCurrentPassword] = useState('');
  const [newPassword, setNewPassword] = useState('');
  const [confirmPassword, setConfirmPassword] = useState('');
  const [loading, setLoading] = useState(false);

  useEffect(() => {
    supabase.from('users').select('id, full_name, email, username').order('full_name').then(({ data }) => setUsers(data || []));
  }, []);

  async function handleChangePassword() {
    if (newPassword.length < 6) { showNotification(t('pwd.errorShort'), 'error'); return; }
    if (newPassword !== confirmPassword) { showNotification(t('pwd.errorMismatch'), 'error'); return; }
    if (!selectedUserId) return;

    setLoading(true);
    // Verify current password
    const { data: user } = await supabase.from('users').select('password_hash').eq('id', selectedUserId).single();
    const currentHash = await hashPassword(currentPassword);
    if (user?.password_hash && user.password_hash !== currentHash) {
      showNotification(t('pwd.errorCurrent'), 'error');
      setLoading(false);
      return;
    }

    // Update password
    const newHash = await hashPassword(newPassword);
    await supabase.from('users').update({ password_hash: newHash, updated_at: new Date().toISOString() }).eq('id', selectedUserId);
    showNotification(t('pwd.success'), 'success');
    setCurrentPassword('');
    setNewPassword('');
    setConfirmPassword('');
    setLoading(false);
  }

  return (
    <div>
      <PageHeader title={t('pwd.title')} subtitle={t('pwd.subtitle')} />

      <div className="max-w-lg mx-auto">
        <div className="bg-white rounded-xl shadow-sm border border-gray-100 p-6">
          <div className="flex items-center gap-3 mb-6 pb-4 border-b">
            <div className="w-12 h-12 bg-primary-100 rounded-full flex items-center justify-center">
              <Icons.Lock />
            </div>
            <div>
              <h3 className="font-semibold text-gray-800">{t('pwd.title')}</h3>
              <p className="text-sm text-gray-500">{t('pwd.subtitle')}</p>
            </div>
          </div>

          <div className="space-y-4">
            <div>
              <label className="text-xs font-medium text-gray-500 mb-1 block">{t('pwd.selectUser')} *</label>
              <select value={selectedUserId} onChange={e => setSelectedUserId(e.target.value)} className="w-full px-3 py-2 border border-gray-200 rounded-lg text-sm bg-white">
                <option value="">{t('pwd.selectUser')}</option>
                {users.map(u => <option key={u.id} value={u.id}>{u.full_name} ({u.username || u.email})</option>)}
              </select>
            </div>

            <div>
              <label className="text-xs font-medium text-gray-500 mb-1 block">{t('pwd.currentPassword')}</label>
              <input type="password" value={currentPassword} onChange={e => setCurrentPassword(e.target.value)} className="w-full px-3 py-2 border border-gray-200 rounded-lg text-sm" placeholder="Enter current password" />
            </div>

            <div>
              <label className="text-xs font-medium text-gray-500 mb-1 block">{t('pwd.newPassword')} *</label>
              <input type="password" value={newPassword} onChange={e => setNewPassword(e.target.value)} className="w-full px-3 py-2 border border-gray-200 rounded-lg text-sm" placeholder="Min 6 characters" />
            </div>

            <div>
              <label className="text-xs font-medium text-gray-500 mb-1 block">{t('pwd.confirmPassword')} *</label>
              <input type="password" value={confirmPassword} onChange={e => setConfirmPassword(e.target.value)} className="w-full px-3 py-2 border border-gray-200 rounded-lg text-sm" placeholder="Re-enter new password" />
            </div>

            {newPassword && confirmPassword && newPassword !== confirmPassword && (
              <div className="text-red-500 text-xs flex items-center gap-1"><Icons.AlertTriangle /> {t('pwd.errorMismatch')}</div>
            )}

            <div className="pt-3">
              <Button onClick={handleChangePassword} disabled={!selectedUserId || !newPassword || !confirmPassword || newPassword !== confirmPassword || loading} className="w-full">
                <Icons.Lock /> {loading ? '...' : t('pwd.change')}
              </Button>
            </div>
          </div>
        </div>
      </div>
    </div>
  );
}
