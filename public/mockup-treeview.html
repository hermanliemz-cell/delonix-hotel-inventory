<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tree View Category Selector - Mockup</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.9/babel.min.js"></script>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  body { background: #f3f4f6; font-family: system-ui, -apple-system, sans-serif; }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useRef, useEffect } = React;

// Simulated category data (parent + children)
const categories = [
  { id: '1', name: 'Guest Amenities', code: 'AMN', parent_id: null },
  { id: '1a', name: 'Bodywash', code: 'AMN-BW', parent_id: '1' },
  { id: '1b', name: 'Comb', code: 'AMN-CM', parent_id: '1' },
  { id: '1c', name: 'Dental Kit', code: 'AMN-DK', parent_id: '1' },
  { id: '1d', name: 'Handwash', code: 'AMN-HW', parent_id: '1' },
  { id: '1e', name: 'Shampoo', code: 'AMN-SH', parent_id: '1' },
  { id: '1f', name: 'Shower Cap', code: 'AMN-SC', parent_id: '1' },
  { id: '1g', name: 'Slipper', code: 'AMN-SL', parent_id: '1' },
  { id: '2', name: 'Linen & Uniform', code: 'LIN', parent_id: null },
  { id: '2a', name: 'Bed Sheet', code: 'LIN-BS', parent_id: '2' },
  { id: '2b', name: 'Duvet Cover', code: 'LIN-DC', parent_id: '2' },
  { id: '2c', name: 'Pillow Case', code: 'LIN-PC', parent_id: '2' },
  { id: '2d', name: 'Bath Towel', code: 'LIN-BT', parent_id: '2' },
  { id: '2e', name: 'Hand Towel', code: 'LIN-HT', parent_id: '2' },
  { id: '3', name: 'Room Facility', code: 'ROO', parent_id: null },
  { id: '3a', name: 'Hanger', code: 'ROO-HG', parent_id: '3' },
  { id: '3b', name: 'Remote Control', code: 'ROO-RC', parent_id: '3' },
];

function TreeSelect({ value, onChange, categories }) {
  const [open, setOpen] = useState(false);
  const [expanded, setExpanded] = useState({});
  const [search, setSearch] = useState('');
  const ref = useRef(null);

  const parents = categories.filter(c => !c.parent_id);
  const getChildren = (parentId) => categories.filter(c => c.parent_id === parentId);
  const selected = categories.find(c => c.id === value);

  useEffect(() => {
    const handler = (e) => { if (ref.current && !ref.current.contains(e.target)) setOpen(false); };
    document.addEventListener('mousedown', handler);
    return () => document.removeEventListener('mousedown', handler);
  }, []);

  const toggleExpand = (id, e) => {
    e.stopPropagation();
    setExpanded(prev => ({ ...prev, [id]: !prev[id] }));
  };

  const selectCategory = (cat) => {
    onChange(cat.id);
    setOpen(false);
    setSearch('');
  };

  // Filter logic
  const matchesSearch = (cat) => {
    if (!search) return true;
    const s = search.toLowerCase();
    return cat.name.toLowerCase().includes(s) || cat.code.toLowerCase().includes(s);
  };

  const parentMatchesOrHasChildMatch = (parent) => {
    if (matchesSearch(parent)) return true;
    return getChildren(parent.id).some(c => matchesSearch(c));
  };

  return (
    <div ref={ref} className="relative">
      {/* Trigger Button */}
      <button
        type="button"
        onClick={() => setOpen(!open)}
        className="w-full flex items-center justify-between px-3 py-2 border border-gray-300 rounded-lg text-sm bg-white hover:border-gray-400 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition-colors"
      >
        <span className={selected ? 'text-gray-800' : 'text-gray-400'}>
          {selected ? (
            <span className="flex items-center gap-2">
              {selected.parent_id && <span className="text-gray-400 text-xs">{categories.find(c => c.id === selected.parent_id)?.name} /</span>}
              <span className="font-medium">{selected.name}</span>
              <span className="text-xs bg-gray-100 text-gray-500 px-1.5 py-0.5 rounded">{selected.code}</span>
            </span>
          ) : 'Select Category'}
        </span>
        <svg className={`w-4 h-4 text-gray-400 transition-transform ${open ? 'rotate-180' : ''}`} fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M19 9l-7 7-7-7" />
        </svg>
      </button>

      {/* Dropdown */}
      {open && (
        <div className="absolute z-50 mt-1 w-full bg-white border border-gray-200 rounded-xl shadow-lg overflow-hidden" style={{ maxHeight: '320px' }}>
          {/* Search */}
          <div className="p-2 border-b border-gray-100">
            <div className="relative">
              <svg className="absolute left-2.5 top-1/2 -translate-y-1/2 w-4 h-4 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
              </svg>
              <input
                type="text"
                placeholder="Search category..."
                value={search}
                onChange={e => setSearch(e.target.value)}
                className="w-full pl-8 pr-3 py-1.5 text-sm border border-gray-200 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500"
                autoFocus
              />
            </div>
          </div>

          {/* Tree */}
          <div className="overflow-y-auto" style={{ maxHeight: '260px' }}>
            {parents.filter(p => parentMatchesOrHasChildMatch(p)).map(parent => {
              const children = getChildren(parent.id).filter(c => matchesSearch(c) || matchesSearch(parent));
              const isExpanded = expanded[parent.id] || (search && children.length > 0);
              const hasChildren = children.length > 0;

              return (
                <div key={parent.id}>
                  {/* Parent row */}
                  <div className="flex items-center group">
                    {hasChildren && (
                      <button
                        onClick={(e) => toggleExpand(parent.id, e)}
                        className="p-1.5 ml-1 hover:bg-gray-100 rounded transition-colors flex-shrink-0"
                      >
                        <svg className={`w-3.5 h-3.5 text-gray-500 transition-transform ${isExpanded ? 'rotate-90' : ''}`} fill="none" stroke="currentColor" viewBox="0 0 24 24">
                          <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2.5} d="M9 5l7 7-7 7" />
                        </svg>
                      </button>
                    )}
                    {!hasChildren && <div className="w-7 flex-shrink-0" />}
                    <button
                      onClick={() => selectCategory(parent)}
                      className={`flex-1 flex items-center gap-2 px-2 py-2 text-sm text-left hover:bg-blue-50 transition-colors ${value === parent.id ? 'bg-blue-50 text-blue-700 font-semibold' : 'text-gray-700'}`}
                    >
                      <span className="w-2 h-2 rounded-full bg-blue-500 flex-shrink-0" style={{ opacity: hasChildren ? 1 : 0.3 }}></span>
                      <span>{parent.name}</span>
                      <span className="text-xs bg-gray-100 text-gray-500 px-1.5 py-0.5 rounded ml-auto">{parent.code}</span>
                      {value === parent.id && (
                        <svg className="w-4 h-4 text-blue-600 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                          <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2.5} d="M5 13l4 4L19 7" />
                        </svg>
                      )}
                    </button>
                  </div>

                  {/* Children */}
                  {isExpanded && children.map(child => (
                    <button
                      key={child.id}
                      onClick={() => selectCategory(child)}
                      className={`w-full flex items-center gap-2 pl-10 pr-3 py-1.5 text-sm text-left hover:bg-blue-50 transition-colors ${value === child.id ? 'bg-blue-50 text-blue-700 font-medium' : 'text-gray-600'}`}
                    >
                      <span className="w-1 h-1 rounded-full bg-gray-400 flex-shrink-0"></span>
                      <span>{child.name}</span>
                      <span className="text-xs bg-gray-50 text-gray-400 px-1.5 py-0.5 rounded ml-auto">{child.code}</span>
                      {value === child.id && (
                        <svg className="w-4 h-4 text-blue-600 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                          <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2.5} d="M5 13l4 4L19 7" />
                        </svg>
                      )}
                    </button>
                  ))}
                </div>
              );
            })}
          </div>
        </div>
      )}
    </div>
  );
}

function App() {
  const [selectedCategory, setSelectedCategory] = useState('1c');
  const [showComparison, setShowComparison] = useState(true);

  return (
    <div className="min-h-screen p-8 flex items-start justify-center gap-8">
      {/* Current (Before) */}
      <div className="w-96">
        <h2 className="text-lg font-bold text-gray-800 mb-1">Before (Sekarang)</h2>
        <p className="text-sm text-gray-500 mb-4">Flat dropdown biasa — semua kategori satu level</p>
        <div className="bg-white rounded-xl shadow-sm border border-gray-200 p-6">
          <label className="block text-sm font-medium text-gray-700 mb-1.5">
            Category <span className="text-red-500">*</span>
          </label>
          <select
            value={selectedCategory}
            onChange={e => setSelectedCategory(e.target.value)}
            className="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm bg-white"
          >
            <option value="">Select Category</option>
            {categories.map(c => (
              <option key={c.id} value={c.id}>
                {c.parent_id ? `  ├─ ${c.name}` : c.name}
              </option>
            ))}
          </select>
          <p className="text-xs text-gray-400 mt-2">Semua parent & child campur jadi satu, sulit dibedakan</p>
        </div>
      </div>

      {/* Arrow */}
      <div className="pt-24">
        <svg className="w-10 h-10 text-blue-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M13 7l5 5m0 0l-5 5m5-5H6" />
        </svg>
      </div>

      {/* New (Tree View) */}
      <div className="w-96">
        <h2 className="text-lg font-bold text-blue-700 mb-1">After (Usulan Tree View)</h2>
        <p className="text-sm text-gray-500 mb-4">Tree view dengan expand/collapse + search</p>
        <div className="bg-white rounded-xl shadow-sm border border-blue-200 p-6 ring-2 ring-blue-100">
          <label className="block text-sm font-medium text-gray-700 mb-1.5">
            Category <span className="text-red-500">*</span>
          </label>
          <TreeSelect
            value={selectedCategory}
            onChange={setSelectedCategory}
            categories={categories}
          />
          <div className="mt-4 space-y-1.5">
            <p className="text-xs text-green-600 flex items-center gap-1">
              <svg className="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M5 13l4 4L19 7" /></svg>
              Parent category bisa expand/collapse
            </p>
            <p className="text-xs text-green-600 flex items-center gap-1">
              <svg className="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M5 13l4 4L19 7" /></svg>
              Bisa pilih parent ATAU child
            </p>
            <p className="text-xs text-green-600 flex items-center gap-1">
              <svg className="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M5 13l4 4L19 7" /></svg>
              Ada search untuk cari cepat
            </p>
            <p className="text-xs text-green-600 flex items-center gap-1">
              <svg className="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M5 13l4 4L19 7" /></svg>
              Menampilkan kode category (AMN, LIN, dll)
            </p>
            <p className="text-xs text-green-600 flex items-center gap-1">
              <svg className="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M5 13l4 4L19 7" /></svg>
              Tanda centang pada item terpilih
            </p>
          </div>
        </div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
